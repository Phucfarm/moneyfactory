<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Money Factory Tycoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
<style>
/* ============================================================
   style.css — Money Factory Tycoon
   Visual identity: industrial print-shop / mint. Brass + cash-
   green accents on a dark factory-floor base. Condensed display
   type for HUD numbers, humanist sans for UI text.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg-deep: #12141a;
  --bg-panel: #1c2028;
  --bg-panel-2: #262b35;
  --bg-panel-3: #2f3542;
  --line: rgba(255,255,255,0.09);
  --line-strong: rgba(255,255,255,0.16);

  --accent-cash: #3ddc84;
  --accent-cash-dim: #24a05e;
  --accent-brass: #d9a441;
  --accent-brass-dim: #a97d2e;
  --accent-warn: #ff6b4a;
  --accent-info: #5b8cff;
  --accent-mythic: #ff5da2;

  --text-primary: #eef1f5;
  --text-secondary: #b7bfcc;
  --text-muted: #7c8494;

  --font-display: 'Oswald', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.hidden { display: none !important; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: auto;
}

#app {
  position: fixed; inset: 0;
  display: flex;
  flex-direction: column;
  user-select: none;
}

#gameCanvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#gameCanvas:active { cursor: grabbing; }

/* ---------------- Rivet / metal-plate panel treatment ---------------- */
.plate {
  background: linear-gradient(180deg, var(--bg-panel-3) 0%, var(--bg-panel) 70%);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-md);
  box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  position: relative;
}
.plate::before, .plate::after {
  content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #6b7280, #24272f);
  top: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
}
.plate::before { left: 6px; }
.plate::after { right: 6px; }

/* ---------------- Top HUD ---------------- */
#hud-top {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 8px calc(10px + env(safe-area-inset-right, 0px)) 8px calc(10px + env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(18,20,26,0.985), rgba(18,20,26,0.965));
  border-bottom: 1px solid var(--line);
  z-index: 20;
  /* Stable HUD surface: avoid repaint shimmer when an animated Ocean background sits underneath. */
}
.hud-chip {
  display:flex; align-items:center; gap:6px; background:var(--bg-panel); border:1px solid var(--line);
  border-left:3px solid var(--accent-cash); border-radius:var(--radius-sm); padding:5px 10px;
  font-family:var(--font-display); font-size:16px; letter-spacing:.3px; white-space:nowrap;
}
.hud-chip.brass{border-left-color:var(--accent-brass)} .hud-chip.info{border-left-color:var(--accent-info)}
.hud-chip.skill-chip{border-left-color:var(--accent-brass); min-width:95px; position:relative; overflow:hidden}
.hud-chip.skill-chip::after{content:""; position:absolute; left:0; bottom:0; height:2px; width:var(--skill-progress,0%); background:var(--accent-brass); opacity:.8}
.hud-chip .ico{font-size:15px;opacity:.85} .hud-chip .sub{font-family:var(--font-body);font-size:11px;color:var(--text-muted);font-weight:500}
#hud-location {
  font-family: var(--font-body); font-size: 12px; color: var(--text-secondary);
  margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 1px;
}
#hud-location b { color: var(--text-primary); font-weight: 600; }

/* ---------------- Location bar (zones / floors) ---------------- */
#location-bar {
  position: absolute; top: 46px; left: calc(10px + env(safe-area-inset-left, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
  display: flex; gap: 6px; align-items: center;
  z-index: 19;
  pointer-events: none;
  min-width: 0;
}
#location-bar .location-scroll {
  display: flex; gap: 6px; align-items: center;
  min-width: 0; max-width: 100%; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -ms-overflow-style: none;
  pointer-events: auto; touch-action: pan-x;
  -webkit-overflow-scrolling: touch;
}
#location-bar .location-scroll::-webkit-scrollbar { display: none; }
#location-bar .lb-group { display: flex; gap: 4px; flex: 0 0 auto; pointer-events: auto; background: rgba(18,20,26,0.7); padding: 3px; border-radius: var(--radius-sm); border: 1px solid var(--line); }
.lb-btn {
  font-family: var(--font-body); font-size: 12px; font-weight: 600;
  padding: 5px 9px; border-radius: 5px; border: 1px solid transparent;
  background: transparent; color: var(--text-secondary); cursor: pointer;
  white-space: nowrap;
}
.lb-btn.active { background: var(--bg-panel-3); color: var(--accent-cash); border-color: var(--line-strong); }
.lb-btn.locked { color: var(--text-muted); }
.lb-btn .lock-cost { display: block; font-size: 10px; color: var(--accent-brass); font-weight: 500; }

/* ---------------- Global machine catalogue ---------------- */
#zone-machine-selector {
  position:absolute; left:10px; bottom:140px; z-index:18; width:min(760px,calc(100% - 20px)); max-height:260px; overflow:hidden;
  padding:7px 9px 8px; border:1px solid rgba(255,255,255,.12); border-radius:var(--radius-md); background:linear-gradient(180deg,rgba(28,33,43,.94),rgba(15,18,25,.94));
  box-shadow:0 14px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.machine-selector-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}.machine-selector-title{min-width:0;display:flex;align-items:center;gap:9px}.machine-selector-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;color:var(--accent-cash);background:rgba(61,220,132,.10);border:1px solid rgba(61,220,132,.22);font-size:16px}.machine-selector-title>span:last-child{min-width:0;display:flex;flex-direction:column;gap:1px}.machine-selector-title b{font-family:var(--font-display);font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}.machine-selector-title small{color:var(--text-muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(390px,55vw)}.machine-selector-toggle{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:rgba(255,255,255,.035);color:var(--text-primary);cursor:pointer}.machine-selector-toggle:hover{border-color:var(--accent-brass);background:rgba(255,178,56,.07)}.machine-selector-toggle span{font-size:16px;line-height:12px}.machine-selector-toggle small{font-size:9px;color:var(--text-muted)}.machine-selector-body{max-height:220px;overflow:hidden;transition:max-height .22s ease,opacity .18s ease,margin-top .18s ease;margin-top:4px}#zone-machine-selector.is-collapsed{width:min(330px,calc(100% - 20px));max-height:54px}#zone-machine-selector.is-collapsed .machine-selector-body{max-height:0;opacity:0;margin-top:0;pointer-events:none}
.machine-catalog-group + .machine-catalog-group { margin-top:8px; }
.machine-catalog-group h4 {
  margin:0 0 5px; padding:0 2px; font-family:var(--font-display); font-size:11px;
  color:var(--text-secondary); font-weight:700; text-transform:none;
}
.machine-catalog-track { display:flex; gap:7px; overflow-x:auto; overflow-y:hidden; padding-bottom:3px; scrollbar-width:thin; }
.machine-catalog-track::-webkit-scrollbar { height:5px; }
.machine-catalog-card {
  flex:0 0 190px; min-width:0; min-height:58px; display:grid; grid-template-columns:12px minmax(0,1fr) auto;
  align-items:center; gap:7px; padding:7px 8px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--bg-panel-2); color:var(--text-primary); text-align:left; cursor:pointer;
}
.machine-catalog-card:hover { border-color:var(--accent-brass); }
.machine-catalog-card.selected { border-color:var(--accent-cash); box-shadow:0 0 0 1px rgba(61,220,132,.25); }
.machine-catalog-card.locked { opacity:.62; }
.machine-catalog-card.ready { border-color:var(--accent-brass); }
.catalog-swatch { width:11px; height:30px; border-radius:4px; box-shadow:0 0 9px rgba(255,255,255,.13); }
.catalog-main { min-width:0; display:flex; flex-direction:column; gap:2px; }
.catalog-main b { min-width:0; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.catalog-main small { min-width:0; font-size:9px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.catalog-meta { max-width:90px; font-size:9px; line-height:1.2; color:var(--text-secondary); text-align:right; overflow-wrap:anywhere; }

/* ---------------- Zone Atlas ---------------- */
.zone-atlas-layout { display:grid; grid-template-columns:minmax(150px, 220px) minmax(0,1fr); gap:10px; min-height:350px; }
.zone-atlas-list { min-width:0; max-height:58vh; overflow-y:auto; padding-right:3px; }
.zone-atlas-item {
  width:100%; display:block; padding:9px; margin-bottom:6px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--bg-panel-2); color:var(--text-primary); text-align:left; cursor:pointer;
}
.zone-atlas-item.active { border-color:var(--accent-brass); background:rgba(255,178,56,.08); }
.zone-atlas-item.locked { opacity:.72; }
.zone-atlas-item .atlas-item-title { display:block; font-family:var(--font-display); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.zone-atlas-item small { display:block; margin-top:2px; font-size:9px; color:var(--text-muted); }
.zone-atlas-detail { min-width:0; max-height:58vh; overflow-y:auto; padding-right:3px; }
.zone-preview-surface {
  position:relative; min-height:150px; overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius-md);
  margin:8px 0 10px; background-size:cover; background-position:center;
}
.zone-preview-surface::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.38)); pointer-events:none; }
.zone-preview-overlay { position:absolute; left:10px; right:10px; bottom:10px; z-index:1; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.zone-preview-overlay strong { font-family:var(--font-display); font-size:18px; text-shadow:0 2px 8px rgba(0,0,0,.65); }
.zone-preview-overlay span { font-size:10px; color:var(--text-secondary); padding:4px 6px; border:1px solid var(--line); border-radius:999px; background:rgba(8,10,14,.72); }
.atlas-meta { display:flex; flex-wrap:wrap; gap:5px; }
.atlas-chip { padding:4px 6px; font-size:10px; border:1px solid var(--line); border-radius:999px; color:var(--text-secondary); }
.atlas-req { display:inline-flex; padding:4px 6px; font-size:10px; border:1px solid var(--line); border-radius:999px; margin:0 4px 4px 0; }
.atlas-req.ok { border-color:rgba(80,220,120,.35); }
.atlas-req.missing { border-color:rgba(255,160,80,.35); }
.atlas-machine { display:flex; align-items:center; gap:7px; }
.zone-preview-badge { position:absolute; left:10px; top:10px; z-index:1; padding:5px 7px; border:1px solid rgba(255,255,255,.18); border-radius:999px; background:rgba(8,10,14,.72); font-size:10px; }
.atlas-section { margin-top:9px; padding-top:8px; border-top:1px dashed var(--line); }
.atlas-section > b { display:block; margin-bottom:6px; font-size:11px; color:var(--text-secondary); }
.atlas-requirements { display:flex; flex-wrap:wrap; gap:5px; }
.atlas-machine-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:6px; }
.atlas-count { float:right; color:var(--text-muted); font-weight:600; }
.atlas-meta-line { font-size:10px; color:var(--text-muted); margin:-2px 0 7px; }
.atlas-mechanic { min-width:0; padding:8px; border:1px solid var(--line); border-radius:var(--radius-sm); background:rgba(255,255,255,.025); margin-bottom:5px; }
.atlas-mechanic-title { display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:var(--font-display); font-size:11px; }
.atlas-mechanic-title small { color:var(--text-muted); font-family:var(--font-body); font-size:9px; }
.atlas-mechanic-desc { margin-top:4px; color:var(--text-muted); font-size:10px; line-height:1.4; }
.atlas-mechanic-hint { margin-top:5px; color:var(--text-secondary); font-size:9px; line-height:1.4; }
.atlas-mechanic.is-hidden { background:rgba(0,0,0,.18); border-style:dashed; }
.atlas-secret small { display:block; margin-top:3px; color:var(--text-muted); line-height:1.35; }
.atlas-secret-mask, .atlas-mechanic .atlas-secret-mask { letter-spacing:2px; filter:blur(.35px); color:var(--text-secondary); }
.atlas-machine { min-width:0; padding:7px; border:1px solid var(--line); border-radius:var(--radius-sm); background:rgba(255,255,255,.025); }
.atlas-machine b { display:block; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.atlas-machine small { display:block; margin-top:3px; color:var(--text-muted); font-size:9px; line-height:1.35; }
.atlas-secret { padding:7px; border:1px solid var(--line); border-radius:var(--radius-sm); font-size:10px; margin-bottom:5px; }
.atlas-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }


/* ---------------- Bottom menu ---------------- */
#bottom-menu {
  position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; z-index: 19;
}
.menu-btn {
  font-family: var(--font-display); font-size: 13px;
  background: var(--bg-panel); border: 1px solid var(--line-strong);
  color: var(--text-primary); border-radius: var(--radius-sm);
  padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  position: relative;
}
.menu-btn > span:first-child { font-size: 20px; line-height: 1; flex: 0 0 auto; }
.menu-btn .dot { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-warn); display: none; }
.menu-btn .dot.show { display: block; }

.mobile-only { display: none; }

/* ---------------- Machine side panel ---------------- */
#machine-panel {
  position: absolute; top: 90px; right: 10px; width: 260px;
  z-index: 21; padding: 12px; max-height: calc(100% - 180px); overflow-y: auto;
}
#machine-panel h3 { margin: 4px 0 2px; font-family: var(--font-display); font-size: 18px; }
#machine-panel .m-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.upg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); }
.upg-row:first-of-type { border-top: none; }
.upg-name { font-size: 13px; font-weight: 600; }
.upg-level { font-size: 11px; color: var(--text-muted); }
.btn {
  font-family: var(--font-body); font-weight: 600; font-size: 12px;
  border: none; border-radius: var(--radius-sm); padding: 7px 10px; cursor: pointer;
  background: var(--accent-cash-dim); color: #05230f;
}
.btn:hover { filter: brightness(1.12); }
.btn:disabled { background: #3a3f4a; color: var(--text-muted); cursor: not-allowed; }
.btn.brass { background: var(--accent-brass); color: #2a1c02; }
.btn.warn { background: var(--accent-warn); color: #2a0d02; }
.btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--text-primary); }
.panel-close { position: absolute; top: 5px; right: 5px; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; background: rgba(18,20,26,.34); color: var(--text-muted); font-size: 22px; line-height: 1; cursor: pointer; touch-action: manipulation; z-index: 5; }
.panel-close:hover, .panel-close:focus-visible { color: var(--text-primary); border-color: var(--line-strong); background: rgba(255,255,255,.06); outline: none; }
.panel-close:active { transform: scale(.96); }

/* ---------------- Modal overlay ---------------- */
#modal-overlay {
  position: absolute; inset: 0; z-index: 30;
  background: rgba(8,9,12,0.72);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  touch-action: auto;
}
#modal-content {
  width: min(720px, 100%); max-height: 92%; overflow-y: auto;
  padding: 18px;
  min-width: 0;
  touch-action: pan-y;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
#modal-content h2 { font-family: var(--font-display); font-size: 24px; margin: 4px 0 6px; }
.modal-overlay--light { background: rgba(8,9,12,0.34) !important; backdrop-filter: blur(2px); }
.hard-reset-confirm { text-align: center; padding: 18px 8px 4px; }
.hard-reset-icon { width: 48px; height: 48px; margin: 2px auto 12px; display:grid; place-items:center; border:1px solid rgba(240,166,78,.45); border-radius:12px; background:rgba(94,53,18,.18); color:var(--accent-warn); font:800 24px/1 var(--font-display); }
.hard-reset-confirm h2 { margin: 0 0 8px !important; }
.hard-reset-actions { display:flex; justify-content:center; gap:8px; margin-top:18px; flex-wrap:wrap; }
.hard-reset-actions .btn { min-width:145px; min-height:40px; }
#modal-content .m-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
.tab-row { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.tab-btn { background: none; border: none; color: var(--text-muted); font-family: var(--font-display); font-size: 14px; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--accent-cash); border-bottom-color: var(--accent-cash); }

.room-card, .list-row {
  display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px;
  background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.room-card .r-icon { font-size: 26px; width: 40px; text-align: center; }
.room-card .r-body { flex: 1; min-width: 0; }
.room-card .r-title { font-family: var(--font-display); font-size: 16px; }
.room-card .r-desc { font-size: 12px; color: var(--text-muted); }
.zone-content-card { position: relative; }
.zone-content-card.is-hidden { opacity: 0.62; }
.zone-content-card.is-hidden .r-title { letter-spacing: 0.12em; }
.zone-content-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; font-size: 11px; color: var(--text-secondary); }
.zone-content-req { margin-top: 4px; font-size: 11px; color: var(--accent-warn); }
.zone-content-card .btn { flex: 0 0 auto; }
.bar-track { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent-cash); }

.tech-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tech-branch h4 { font-family: var(--font-display); font-size: 14px; color: var(--text-secondary); margin: 0 0 8px; text-transform: none; }
.tech-node {
  padding: 9px; margin-bottom: 6px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--bg-panel-2);
  font-size: 12px; cursor: pointer;
}
.tech-node.owned { border-color: var(--accent-cash-dim); background: rgba(61,220,132,0.09); cursor: default; }
.tech-node.locked { opacity: 0.45; cursor: not-allowed; }
.tech-node .t-name { font-weight: 700; margin-bottom: 2px; }
.tech-node .t-cost { color: var(--accent-brass); font-size: 11px; }

.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); min-width: 0; }
.setting-row:first-of-type { border-top: none; }
.setting-language { align-items: flex-start; }
.setting-language > span { flex: 0 0 auto; padding-top: 7px; }
.lang-toggle { display: flex; min-width: 0; max-width: 100%; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.lang-toggle button { flex: 1 1 auto; min-width: 0; border: none; background: var(--bg-panel-2); color: var(--text-secondary); padding: 6px 10px; font-family: var(--font-body); font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
.lang-toggle button.active { background: var(--accent-cash-dim); color: #05230f; }
.switch { position: relative; width: 42px; height: 24px; }
.switch input { display:none; }
.switch .track { position: absolute; inset: 0; background: #3a3f4a; border-radius: 999px; transition: background 0.15s; }
.switch input:checked + .track { background: var(--accent-cash-dim); }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: white; transition: transform 0.15s; }
.switch input:checked + .track + .knob { transform: translateX(18px); }
.setting-slider-row > label { flex: 0 0 auto; font-size: 13px; }
.setting-danger-buttons { display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; }

.volume-control { display: flex; align-items: center; gap: 10px; min-width: 0; width: min(260px, 58%); }
.volume-control input[type="range"] { flex: 1 1 auto; min-width: 80px; accent-color: var(--accent-cash); cursor: pointer; }

/* ---------------- Mechanic UI --------------------------------------------- */
#mechanic-indicator-stack {
  position: absolute; top: 82px; left: 50%; transform: translateX(-50%);
  /* Includes numeric mechanic counters such as the Ocean Ink Siphon tank.
     Stay above gameplay HUD controls, but let modal panels cover the whole stack. */
  z-index: 25; display: flex; gap: 6px; align-items: stretch; justify-content: center;
  width: min(96vw, 760px); pointer-events: none; flex-wrap: wrap;
}
.mechanic-indicator {
  position: relative; display: flex; align-items: center; gap: 6px; min-height: 30px;
  padding: 6px 9px; border-radius: var(--radius-sm); background: rgba(18,22,29,0.93);
  border: 1px solid var(--line); box-shadow: 0 5px 16px rgba(0,0,0,0.18); overflow: hidden;
  font-size: 12px; color: var(--text-primary);
}
.mechanic-indicator.info { border-left: 3px solid var(--accent-info); }
.mechanic-indicator.good { border-left: 3px solid #67d990; }
.mechanic-indicator.warn { border-left: 3px solid var(--accent-warn); }
.mechanic-indicator.danger { border-left: 3px solid #ff6578; }
.mechanic-indicator.muted { border-left: 3px solid var(--text-muted); }
.mechanic-indicator-icon { font-size: 15px; line-height: 1; }
.mechanic-indicator-copy { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mechanic-indicator-copy b { font-family: var(--font-display); font-size: 11px; white-space: nowrap; }
.mechanic-indicator-copy small { color: var(--text-muted); font-size: 10px; white-space: nowrap; }
.mechanic-indicator > strong { margin-left: 4px; font-family: var(--font-display); font-size: 12px; white-space: nowrap; }
.mechanic-indicator-progress {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent-info) var(--progress,0%), transparent var(--progress,0%));
  opacity: .8;
}

/* ---------------- Toasts ---------------- */
/* DEV CHEAT CODE UI — REMOVE THIS BLOCK WITH #dev-cheat-money BEFORE RELEASE. */
.dev-cheat-btn {
  position: fixed;
  right: calc(10px + env(safe-area-inset-right, 0px));
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  /* Dev helper remains above the canvas, but must never sit on top of gameplay UI. */
  z-index: 10;
  min-width: 46px;
  height: 34px;
  padding: 0 9px;
  border: 1px solid rgba(255,178,56,.45);
  border-radius: 10px;
  background: rgba(30,24,16,.82);
  color: var(--accent-brass);
  font: 700 11px var(--font-body);
  letter-spacing: .03em;
  box-shadow: 0 5px 18px rgba(0,0,0,.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  touch-action: manipulation;
  opacity: .78;
}
.dev-cheat-btn:hover, .dev-cheat-btn:focus-visible {
  opacity: 1;
  border-color: var(--accent-brass);
  background: rgba(45,34,18,.95);
  outline: none;
}
.dev-cheat-btn:active { transform: translateY(1px) scale(.97); }

#toast-stack {
  position: absolute; left: 50%; top: 122px; transform: translateX(-50%);
  z-index: 35; display: flex; flex-direction: column; gap: 6px; align-items: center;
  pointer-events: none;
}
.toast {
  font-family: var(--font-body); font-weight: 600; font-size: 13px;
  background: rgba(20,22,28,0.94); border: 1px solid var(--line-strong);
  border-left: 3px solid var(--accent-cash); padding: 7px 12px; border-radius: var(--radius-sm);
  animation: toast-in 0.18s ease-out, toast-out 0.3s ease-in 2.4s forwards;
  white-space: normal; text-align: center;
  max-width: min(92vw, 520px); overflow-wrap: anywhere;
}
.toast.warn { border-left-color: var(--accent-warn); }
.toast.danger { border-left-color: #ff6578; }
.toast.mechanic { border-left-color: var(--accent-info); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

/* ============================================================
   Responsive: mobile landscape gets a dedicated touch layout.
   Breakpoint by pointer/touch + narrower viewport height.
   ============================================================ */
@media (pointer: coarse), (hover: none) {

  }

@media (max-width: 700px) {

/* The fish is genuinely stranded: flop + wet splashes. */

.stranded-fish-decoration.is-auto-catching .fish-art{animation:strandedFishCatch .32s ease-in-out infinite alternate}
.stranded-fish-decoration .fish-splash{position:absolute;width:4px;height:7px;border-radius:80% 20% 80% 20%;background:linear-gradient(180deg,rgba(203,249,255,.95),rgba(83,193,224,.25));opacity:.9;filter:blur(.15px)}
.stranded-fish-decoration .fish-splash--1{left:20px;top:16px;animation:fishSplash .7s ease-out infinite}.stranded-fish-decoration .fish-splash--2{left:29px;top:9px;animation:fishSplash .7s .18s ease-out infinite}.stranded-fish-decoration .fish-splash--3{left:50px;top:11px;animation:fishSplash .7s .33s ease-out infinite}.stranded-fish-decoration .fish-splash--4{left:56px;top:21px;animation:fishSplash .7s .46s ease-out infinite}.stranded-fish-decoration .fish-splash--5{left:39px;top:29px;animation:fishSplash .7s .56s ease-out infinite}
@keyframes strandedFishFlop{0%,100%{transform:translate(-50%,-50%) rotate(-6deg) translateY(0)}35%{transform:translate(-50%,-50%) rotate(8deg) translateY(-2px)}65%{transform:translate(-50%,-50%) rotate(-12deg) translateY(1px)}}

/* ============================================================
   Mobile machine selector — tall, compact, vertically scrollable.
   Keep the controls/cards small while giving the catalogue enough
   vertical room to browse. Uses dynamic viewport units so it tracks
   the visual viewport on phones whose CSS layout viewport is wider.
   ============================================================ */
@media (pointer: coarse) and (orientation: landscape),
       (orientation: landscape) and (max-height: 700px) {
  #zone-machine-selector {
    left: calc(6px + env(safe-area-inset-left, 0px));
    right: auto;
    bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    width: min(48dvw, 380px);
    max-width: min(48dvw, 380px);
    height: min(52dvh, 320px);
    max-height: min(52dvh, 320px);
    padding: 5px 6px 6px;
    box-sizing: border-box;
    overflow: hidden;
  }

  #zone-machine-selector:not(.is-collapsed) {
    bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  }

  #zone-machine-selector.is-collapsed {
    left: calc(6px + env(safe-area-inset-left, 0px));
    right: auto;
    width: min(225px, 48dvw);
    max-width: min(225px, 48dvw);
    height: 40px;
    max-height: 40px;
  }

  .machine-selector-head {
    flex: 0 0 auto;
    gap: 5px;
    min-height: 25px;
  }

  .machine-selector-title {
    gap: 5px;
    min-width: 0;
  }

  .machine-selector-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    font-size: 12px;
  }

  .machine-selector-title b { font-size: 8px; }
  .machine-selector-title small { max-width: 30dvw; font-size: 7px; }

  .machine-selector-toggle {
    flex: 0 0 auto;
    gap: 2px;
    padding: 3px 4px;
    border-radius: 6px;
  }
  .machine-selector-toggle span { font-size: 12px; }
  .machine-selector-toggle small { display: none; }

  .machine-selector-body {
    height: calc(min(52dvh, 320px) - 39px);
    max-height: calc(min(52dvh, 320px) - 39px);
    margin-top: 3px;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.24) transparent;
  }

  .machine-catalog-group + .machine-catalog-group { margin-top: 5px; }
  .machine-catalog-group h4 {
    margin-bottom: 3px;
    font-size: 8px;
  }

  /* One compact vertical list per tier: no nested horizontal swipe. */
  .machine-catalog-track {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-x: visible;
    overflow-y: visible;
    padding-bottom: 1px;
  }

  .machine-catalog-card {
    flex: 0 0 auto;
    width: 100%;
    min-height: 43px;
    grid-template-columns: 8px minmax(0, 1fr) auto;
    gap: 5px;
    padding: 5px;
    border-radius: 6px;
    box-sizing: border-box;
  }

  .catalog-swatch { width: 8px; height: 23px; }
  .catalog-main { gap: 1px; }
  .catalog-main b { font-size: 9px; }
  .catalog-main small { font-size: 7px; }
  .catalog-meta { max-width: 58px; font-size: 7px; }
}

/* Ink-infection HUD/action states */
.hud-chip.danger { border-color: rgba(255,101,120,.72); box-shadow: 0 0 14px rgba(255,70,90,.14); }
.hud-chip.danger #hud-money-val, #hud-mps-val.danger { color: #ff6578; }
.mechanic-action { pointer-events: auto; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font: inherit; font-family: var(--font-display); font-size: 10px; color: var(--text-primary); background: rgba(24,29,38,.96); cursor: pointer; }
.mechanic-action.good { border-color: rgba(103,217,144,.6); }
.mechanic-action.warn { border-color: rgba(255,194,77,.65); }
.mechanic-action.danger { border-color: rgba(255,101,120,.7); }
.mechanic-action:disabled { opacity: .55; cursor: default; }

/* UI layer order follows the shared gameplay stack: the modal sits above the
   developer helper, HUD, and numeric mechanic indicators (including the Ocean
   Ink Siphon counter). Toasts and the tutorial acknowledgement remain above it.
   Do not raise the dev helper or hide/reorder unrelated HUD siblings in JS when
   a panel opens; the modal backdrop blocks input to lower layers. */

/* Ocean's brighter presentation is a zone baseline, not a modal effect.
   Keep the current Ocean palette independent of opening/closing panels.
   Other Zones keep their own unfiltered palette. */
#zone-background.zone-background--ocean {
  filter: brightness(1.8) saturate(1.08);
}
#zone-background.zone-background--ocean ~ #gameCanvas {
  filter: brightness(1.3);
}

/* ============================================================
   Guidance Core (onboarding + contextual tips) — src/13-tutorial*.js
   Presentation-only overlay. Ordinary modal panels suppress this layer; Rooms
   and the Zone Atlas may reparent it locally for contextual action hints. The
   developer helper sits below regular UI. Every element is pointer-events:none
   except the small card buttons, so it cannot intercept canvas input.
   ============================================================ */
#tutorial-layer {
  position: fixed; inset: 0; z-index: 40;
  pointer-events: none; overflow: hidden; display: none;
}
#tutorial-layer.tut-on { display: block; }

  position: absolute; display: none; border-radius: 14px;

}
.tut-mode-spotlight .tut-spot { box-shadow: 0 0 0 3px rgba(61,220,132,.28), 0 0 18px 2px rgba(61,220,132,.55), 0 0 0 100vmax rgba(4,7,12,.64); }

@keyframes tut-pulse { 0%,100% { border-color: rgba(61,220,132,.95); } 50% { border-color: rgba(61,220,132,.4); } }

.tut-pointer {
  position: absolute; display: none; width: 0; height: 0;
  transform: translate(-50%, -50%) rotate(var(--tut-rot, 0deg));
}
.tut-pointer i {
  position: absolute; left: -11px; top: -8px; width: 0; height: 0;
  border-left: 11px solid transparent; border-right: 11px solid transparent;
  border-bottom: 16px solid var(--accent-cash);
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.6));
  animation: tut-bob .9s ease-in-out infinite;
}
@keyframes tut-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
.tut-mode-card .tut-pointer:not(.tut-pointer-edge) { display: none !important; }

.tut-card {
  position: absolute; width: min(300px, calc(100vw - 24px)); padding: 10px 12px 10px;
  background: linear-gradient(180deg, rgba(34,40,52,.98), rgba(24,28,37,.98));

  pointer-events: none;
}
.tut-tag { font-family: var(--font-display); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-brass); margin-bottom: 2px; }
.tut-title { font-family: var(--font-display); font-size: 15px; letter-spacing: .02em; margin-bottom: 3px; }
.tut-text { color: var(--text-secondary); overflow-wrap: anywhere; }
.tut-card .tut-text:first-child, .tut-tag.tut-empty + .tut-title.tut-empty + .tut-text { color: var(--text-primary); }
.tut-empty { display: none; }
.tut-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
.tut-btn {
  pointer-events: auto; min-height: 32px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: rgba(255,255,255,.05); color: var(--text-secondary);
  font: 600 11px/1 var(--font-body); touch-action: manipulation;
}
.tut-btn:hover, .tut-btn:focus-visible { color: var(--text-primary); border-color: var(--text-muted); outline: none; }
.tut-btn-primary { background: var(--accent-cash-dim); border-color: var(--accent-cash); color: #04170b; }

@media (pointer: coarse) { .tut-btn { min-height: 40px; padding: 8px 14px; } }
@media (max-height: 520px) {
  .tut-card { width: min(250px, calc(100vw - 20px)); padding: 7px 9px; font-size: 11.5px; line-height: 1.3; }
  .tut-title { font-size: 13px; }
  .tut-tag { font-size: 9px; }
  .tut-actions { margin-top: 5px; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) { .tut-spot, .tut-pointer i { animation: none; } }

.setting-guidance-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.setting-guidance-label small { color: var(--text-muted); font-size: 11px; font-weight: 400; }

  let currentLang = "en";
  const listeners = [];

  function t(key, params) {
    const dict = STRINGS[currentLang] || STRINGS.en;
    let str = dict[key];
    if (str === undefined) str = STRINGS.en[key];
    if (str === undefined) return key;
    if (params) {
      Object.keys(params).forEach((p) => {
        str = str.replace(new RegExp("\\{" + p + "\\}", "g"), params[p]);
      });
    }
    return str;
  }

  function setLang(lang) {
    if (!STRINGS[lang]) return;
    currentLang = lang;
    applyToDom();
    listeners.forEach((fn) => {
      try { fn(lang); } catch (e) { console.error(e); }
    });
  }

  function getLang() { return currentLang; }

  function onChange(fn) { listeners.push(fn); }

  function applyToDom() {
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      el.textContent = t(key);
    });
    document.querySelectorAll("[data-i18n-attr]").forEach((el) => {
      // format: data-i18n-attr="placeholder:some.key|title:other.key"
      const spec = el.getAttribute("data-i18n-attr");
      spec.split("|").forEach((pair) => {
        const [attr, key] = pair.split(":");
        if (attr && key) el.setAttribute(attr, t(key));
      });
    });
    document.documentElement.setAttribute("lang", currentLang);
  }

  G.i18n = { t, setLang, getLang, onChange, applyToDom, STRINGS };
})(window.Game = window.Game || {});

   Every system (economy, factory, save, ui) reads and
   mutates THIS object. No system keeps its own duplicated copy.

(function (G) {

  const D = G.DATA;

  const SAVE_VERSION = 8;

  function makeEmptyGrid() {
    const slots = [];
    for (let r = 0; r < D.GRID_ROWS; r++) {
      for (let c = 0; c < D.GRID_COLS; c++) {
        slots.push({
          r, c,
          machine: null, // { typeId, tierId, levels: {speed,output,ink}, progress: 0..1, banked }
        });
      }
    }
    return slots;
  }

  function makeFloor(floorDef) {
    return {
      id: floorDef.id,
      unlocked: !floorDef.unlock,
      grid: makeEmptyGrid(),
      systems: {
        conveyor: 0,
        collector: 0,
      },
    };
  }

  function cloneJson(value) {
    try { return JSON.parse(JSON.stringify(value)); } catch (_e) { return {}; }
  }

  function isPlainObject(value) { return !!value && typeof value === "object" && !Array.isArray(value); }

  function mergeDeclaredObject(target, source, definition) {
    if (!isPlainObject(target) || !isPlainObject(definition)) return;
    if (!isPlainObject(source)) return;
    Object.keys(definition).forEach((key) => {
      if (!Object.prototype.hasOwnProperty.call(source, key)) return;
      const declared = definition[key];
      const loaded = source[key];
      if (isPlainObject(declared)) {
        if (isPlainObject(loaded)) mergeDeclaredObject(target[key], loaded, declared);
      } else if (Array.isArray(declared)) {
        if (Array.isArray(loaded)) target[key] = cloneJson(loaded);
      } else if (declared === null) {
        if (loaded === null) target[key] = null;
      } else if (typeof declared === "number") {
        if (typeof loaded === "number" && isFinite(loaded)) target[key] = loaded;
      } else if (typeof loaded === typeof declared) {
        target[key] = loaded;
      }
    });
  }

  function makeZone(zoneDef) {
    const mechanicState = {};
    (zoneDef.mechanics || []).forEach((mechanic) => {
      if (mechanic && typeof mechanic.id === "string") {
        mechanicState[mechanic.id] = mechanic.initialState && typeof mechanic.initialState === "object"
          ? cloneJson(mechanic.initialState)
          : {};
      }
    });
    return {
      id: zoneDef.id,
      unlocked: !zoneDef.unlock,
      floors: zoneDef.floors.map(makeFloor),
      mechanicState,
      mechanicDiscoveries: [],
      variables: cloneJson(zoneDef.variables || {}),
      upgrades: {},
      purchases: {},
      secrets: [],
      unlockedMachineIds: [],
      stats: {
        playTimeSeconds: 0,
        totalCycles: 0,
        cashGenerated: 0,
        machinesPlaced: 0,
        cashCollected: 0,
      },
    };
  }

  function defaultState() {
    return {
      saveVersion: SAVE_VERSION,
      createdAt: Date.now(),
      lastSaveTime: Date.now(),

      money: 50,
      totalEarned: 0,       // cumulative cash granted in this save
      lifetimeEarned: 0,    // total cash ever granted; used for lifetime unlocks/stats only
      maxMoney: 50,         // highest cash balance ever reached in the current run

      research: 0,          // research points from R&D room; spent on Tech Tree purchases

      currentZoneId: D.ZONES[0].id,
      currentFloorId: D.ZONES[0].floors[0].id,
      zones: D.ZONES.map(makeZone),

      rooms: {
        rnd: { level: 0 },
        vault: { level: 0 },
        power: { level: 0 },
      },

      skills: {
        points: 0,
        onlineSeconds: 0,
        tech: {}, // techId -> true
      },

      settings: {
        lang: "en",
        music: true,
        sfx: true,
        musicVolume: 0.35,
        sfxVolume: 0.7,
      },

      camera: { x: 0, y: 0, zoom: 1 },

      selectedTierId: "common",
      selectedMachineId: "printer_common",

      stats: {
        totalClicks: 0,
        totalMachinesPlaced: 0,
        totalUpgradesBought: 0,
        playTimeSeconds: 0,
      },
    };
  }

  // ---- Defensive merge: fills in any missing/invalid fields from a
  // loaded save with sensible defaults so corrupt/partial saves never
  // crash the game (spec section 23).
  function sanitizeState(loaded) {
    const base = defaultState();
    if (!loaded || typeof loaded !== "object") return base;

    const out = base;
    try {
      if (typeof loaded.money === "number" && isFinite(loaded.money) && loaded.money >= 0) out.money = loaded.money;
      if (typeof loaded.totalEarned === "number" && isFinite(loaded.totalEarned)) out.totalEarned = Math.max(0, loaded.totalEarned);
      if (typeof loaded.lifetimeEarned === "number" && isFinite(loaded.lifetimeEarned)) out.lifetimeEarned = Math.max(0, loaded.lifetimeEarned);
      if (typeof loaded.maxMoney === "number" && isFinite(loaded.maxMoney)) out.maxMoney = Math.max(0, loaded.maxMoney);
      out.maxMoney = Math.max(out.maxMoney, out.money);
      if (typeof loaded.research === "number" && isFinite(loaded.research)) out.research = Math.max(0, loaded.research);
      if (typeof loaded.lastSaveTime === "number" && isFinite(loaded.lastSaveTime) && loaded.lastSaveTime >= 0) out.lastSaveTime = loaded.lastSaveTime;
      if (typeof loaded.createdAt === "number" && isFinite(loaded.createdAt) && loaded.createdAt >= 0) out.createdAt = loaded.createdAt;

      if (loaded.settings && typeof loaded.settings === "object") {
        if (loaded.settings.lang === "en" || loaded.settings.lang === "vi" || loaded.settings.lang === "id" || loaded.settings.lang === "es") out.settings.lang = loaded.settings.lang;
        if (typeof loaded.settings.music === "boolean") out.settings.music = loaded.settings.music;
        if (typeof loaded.settings.sfx === "boolean") out.settings.sfx = loaded.settings.sfx;
        if (typeof loaded.settings.musicVolume === "number" && isFinite(loaded.settings.musicVolume)) out.settings.musicVolume = clamp01(loaded.settings.musicVolume);
        if (typeof loaded.settings.sfxVolume === "number" && isFinite(loaded.settings.sfxVolume)) out.settings.sfxVolume = clamp01(loaded.settings.sfxVolume);
      }

      const oldPrestige = loaded.prestige && typeof loaded.prestige === "object" ? loaded.prestige : null;
      if (loaded.skills && typeof loaded.skills === "object") {
        if (typeof loaded.skills.points === "number" && isFinite(loaded.skills.points)) out.skills.points = Math.max(0, Math.floor(loaded.skills.points));
        if (typeof loaded.skills.onlineSeconds === "number" && isFinite(loaded.skills.onlineSeconds)) out.skills.onlineSeconds = Math.max(0, loaded.skills.onlineSeconds);
        if (loaded.skills.tech && typeof loaded.skills.tech === "object") {
          const legacyTech = loaded.skills.tech;
          const hadPreV7Auto4 = legacyTech.t_auto_4 === true;
          const hadPreV7Auto5 = legacyTech.t_auto_5 === true;
          D.TECH_TREE.forEach((t) => {
            let owned = legacyTech[t.id] === true;
            // v6 had no t_auto_3. A v6 save that already owned auto-4/5 is
            // migrated to the new sequential chain without losing the unlock.
            if (t.id === "t_auto_3" && (hadPreV7Auto4 || hadPreV7Auto5)) owned = true;
            if (t.id === "t_auto_4" && hadPreV7Auto5) owned = true;
            if (owned && t.requires.every((req) => !!out.skills.tech[req])) out.skills.tech[t.id] = true;
          });
        }
      } else if (oldPrestige) {
        // One-time migration: keep old earned points/upgrades, discard only the
        // old Rebirth counter and reset behavior. New points come from online time.
        if (typeof oldPrestige.perkPoints === "number" && isFinite(oldPrestige.perkPoints)) out.skills.points = Math.max(0, Math.floor(oldPrestige.perkPoints));
        if (oldPrestige.tech && typeof oldPrestige.tech === "object") {
          const legacyTech = oldPrestige.tech;
          const hadPreV7Auto4 = legacyTech.t_auto_4 === true;
          const hadPreV7Auto5 = legacyTech.t_auto_5 === true;
          D.TECH_TREE.forEach((t) => {
            let owned = legacyTech[t.id] === true;
            if (t.id === "t_auto_3" && (hadPreV7Auto4 || hadPreV7Auto5)) owned = true;
            if (t.id === "t_auto_4" && hadPreV7Auto5) owned = true;
            if (owned && t.requires.every((req) => !!out.skills.tech[req])) out.skills.tech[t.id] = true;
          });
        }
      }

      if (loaded.rooms && typeof loaded.rooms === "object") {
        ["rnd", "vault", "power"].forEach((k) => {
          const def = D.ROOMS[k];
          const lvl = loaded.rooms[k] && loaded.rooms[k].level;
          if (typeof lvl === "number" && isFinite(lvl)) {
            out.rooms[k].level = Math.max(0, Math.min(def.maxLevel, Math.floor(lvl)));
          }
        });
      }

      if (typeof loaded.selectedTierId === "string" && D.tierById(loaded.selectedTierId)) {
        out.selectedTierId = loaded.selectedTierId;
      }
      if (typeof loaded.selectedMachineId === "string" && D.machineById(loaded.selectedMachineId)) {
        out.selectedMachineId = loaded.selectedMachineId;
      }

      if (loaded.camera && typeof loaded.camera === "object") {
        if (typeof loaded.camera.x === "number" && isFinite(loaded.camera.x)) out.camera.x = loaded.camera.x;
        if (typeof loaded.camera.y === "number" && isFinite(loaded.camera.y)) out.camera.y = loaded.camera.y;
        if (typeof loaded.camera.zoom === "number" && isFinite(loaded.camera.zoom) && loaded.camera.zoom > 0) out.camera.zoom = clamp(loaded.camera.zoom, 0.34, 2.8);
      }

      if (typeof loaded.currentZoneId === "string" && D.zoneById(loaded.currentZoneId)) out.currentZoneId = loaded.currentZoneId;

      // Zones/floors/grid — merge by id, ignore anything unrecognized/corrupt.
      if (Array.isArray(loaded.zones)) {
        out.zones.forEach((zone) => {
          const lz = loaded.zones.find((z) => z && z.id === zone.id);
          if (!lz) return;
          if (typeof lz.unlocked === "boolean") zone.unlocked = lz.unlocked || zone.unlocked;
          const zoneDef = D.zoneById(zone.id);
          if (Array.isArray(lz.mechanicDiscoveries)) {
            const validMechanics = new Set((zoneDef.mechanics || []).filter((x) => x && x.visibility && x.visibility.hidden === true).map((x) => x.id));
            zone.mechanicDiscoveries = lz.mechanicDiscoveries.filter((id) => typeof id === "string" && validMechanics.has(id));
          }
          if (Array.isArray(lz.secrets)) {
            const validSecrets = new Set((zoneDef.secrets || []).map((x) => x.id));
            zone.secrets = lz.secrets.filter((id) => typeof id === "string" && validSecrets.has(id));
          }
          if (lz.variables && typeof lz.variables === "object" && !Array.isArray(lz.variables)) {
            mergeDeclaredObject(zone.variables, lz.variables, zoneDef.variables || {});
          }
          if (lz.upgrades && typeof lz.upgrades === "object" && !Array.isArray(lz.upgrades)) {
            const validUpgradeDefs = new Map((zoneDef.upgrades || []).map((x) => [x.id, x]));
            Object.keys(lz.upgrades).forEach((id) => {
              const def = validUpgradeDefs.get(id);
              const value = lz.upgrades[id];
              if (!def || !Number.isFinite(value)) return;
              const maxLevel = Math.max(1, Math.floor(Number(def.maxLevel) || 1));
              zone.upgrades[id] = Math.max(0, Math.min(maxLevel, Math.floor(value)));
            });
          }
          if (lz.purchases && typeof lz.purchases === "object" && !Array.isArray(lz.purchases)) {
            const validPurchaseIds = new Set((zoneDef.purchases || []).map((x) => x.id));
            Object.keys(lz.purchases).forEach((id) => {
              if (validPurchaseIds.has(id) && lz.purchases[id] === true) zone.purchases[id] = true;
            });
          }
          if (Array.isArray(lz.unlockedMachineIds)) {
            const validMachineIds = new Set((zoneDef.machines || []).map((x) => x.id));
            zone.unlockedMachineIds = lz.unlockedMachineIds.filter((id) => typeof id === "string" && validMachineIds.has(id));
          }
          if (lz.mechanicState && typeof lz.mechanicState === "object") {
            (zoneDef.mechanics || []).forEach((mechanicDef) => {
              const value = lz.mechanicState[mechanicDef.id];
              if (value && typeof value === "object") zone.mechanicState[mechanicDef.id] = cloneJson(value);
            });
          }
          if (lz.stats && typeof lz.stats === "object") {
            Object.keys(lz.stats).forEach((key) => {
              const value = lz.stats[key];
              if (typeof value === "number" && isFinite(value) && value >= 0) zone.stats[key] = value;
            });
          }
          if (Array.isArray(lz.floors)) {
            zone.floors.forEach((floor) => {
              const lf = lz.floors.find((f) => f && f.id === floor.id);
              if (!lf) return;
              if (typeof lf.unlocked === "boolean") floor.unlocked = lf.unlocked || floor.unlocked;
              if (lf.systems && typeof lf.systems === "object") {
                ["conveyor", "collector"].forEach((k) => {
                  const v = lf.systems[k];
                  if (typeof v === "number" && isFinite(v)) {
                    const maxLevel = Number(D.FLOOR_SYSTEMS[k]?.maxLevel) || 0;
                    floor.systems[k] = Math.max(0, Math.min(maxLevel, Math.floor(v)));
                  }
                });
              }
              if (Array.isArray(lf.grid)) {
                floor.grid.forEach((slot) => {
                  const ls = lf.grid.find((s) => s && s.r === slot.r && s.c === slot.c);
                  if (!ls || !ls.machine) return;
                  const m = ls.machine;
                  // Legacy saves used tier ids directly (for example `common`)
                  // or only stored `tierId`. Resolve those ids back to the current
                  // global machine definition so upgrades/progress/banked cash are
                  // not silently deleted during the new schema sanitization.
                  const directDef = typeof m.typeId === "string" ? D.machineById(m.typeId) : null;
                  const legacyTier = !directDef && typeof m.typeId === "string" ? D.tierById(m.typeId) : null;
                  const legacyType = !directDef && typeof m.tierId === "string"
                    ? D.MACHINE_TYPES.find((type) => type.tierId === m.tierId)
                    : null;
                  const def = directDef
                    || (legacyTier ? D.machineById("printer_" + legacyTier.id) : null)
                    || (legacyType ? D.machineById(legacyType.id) : null);
                  if (def) {
                    slot.machine = {
                      typeId: def.id,
                      // tierId remains as a compatibility/visual fallback for older core code.
                      tierId: def.tierId || "common",
                      levels: {
                        speed: safeLevel(m.levels && m.levels.speed, D.UPGRADES.speed.maxLevel),
                        output: safeLevel(m.levels && m.levels.output, D.UPGRADES.output.maxLevel),
                        ink: safeLevel(m.levels && m.levels.ink, D.UPGRADES.ink.maxLevel),
                      },
                      progress: typeof m.progress === "number" && isFinite(m.progress) ? clamp01(m.progress) : 0,
                      banked: typeof m.banked === "number" && isFinite(m.banked) ? Math.max(0, m.banked) : 0,
                    };
                  }
                });
              }
              if (typeof lf.id === "string" && loaded.currentFloorId === lf.id) {
                // handled below
              }
            });
          }
        });
      }
      // Keep the active location valid and accessible.
      const activeZone = D.zoneById(out.currentZoneId);
      if (!activeZone) out.currentZoneId = D.ZONES[0].id;
      else if (!out.zones.find((z) => z.id === out.currentZoneId && z.unlocked)) {
        const fallback = out.zones.find((z) => z.unlocked);
        out.currentZoneId = fallback ? fallback.id : D.ZONES[0].id;
      }
      // Selection is global: a machine can be inspected/selected without
      // entering its home Zone. Placement itself is validated by Zone Core.
      if (!D.tierById(out.selectedTierId)) out.selectedTierId = "common";
      if (!D.machineById(out.selectedMachineId)) out.selectedMachineId = "printer_" + out.selectedTierId;

      const activeZoneState = out.zones.find((z) => z.id === out.currentZoneId);
      const requestedFloor = typeof loaded.currentFloorId === "string" ? loaded.currentFloorId : null;
      if (activeZoneState) {
        const wanted = activeZoneState.floors.find((f) => f.id === requestedFloor && f.unlocked);
        const fallbackFloor = activeZoneState.floors.find((f) => f.unlocked);
        out.currentFloorId = wanted ? wanted.id : (fallbackFloor ? fallbackFloor.id : D.ZONES.find((z) => z.id === out.currentZoneId).floors[0].id);
      }

      out.lifetimeEarned = Math.max(out.lifetimeEarned, out.totalEarned);
      out.maxMoney = Math.max(out.maxMoney, out.money);

      if (loaded.stats && typeof loaded.stats === "object") {
        Object.keys(out.stats).forEach((k) => {
          if (typeof loaded.stats[k] === "number" && isFinite(loaded.stats[k])) out.stats[k] = Math.max(0, loaded.stats[k]);
        });
      }
    } catch (e) {
      console.error("Save sanitize error, falling back to safe defaults for affected fields:", e);
    }
    out.saveVersion = SAVE_VERSION;
    return out;
  }

  function safeLevel(v, max) {
    if (typeof v !== "number" || !isFinite(v) || v < 0) return 0;
    return Math.min(max, Math.floor(v));
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function clamp01(v) { return clamp(v, 0, 1); }

  G.State = {
    SAVE_VERSION,
    defaultState,
    sanitizeState,
    clamp,
    clamp01,
  };
})(window.Game = window.Game || {});

/* ============================================================
   03-save.js — LocalStorage persistence layer.
   Defensive: any corrupt/missing/invalid data falls back to safe
   defaults (via Game.State.sanitizeState) rather than crashing.
   ============================================================ */
(function (G) {
  "use strict";

  const SAVE_KEY = "moneyFactoryTycoon.save";
  const LEGACY_SAVE_KEYS = ["moneyFactoryTycoon.save.v1"];
  const AUTOSAVE_INTERVAL_SEC = 20;

  function isStorageAvailable() {
    try {
      const k = "__mft_test__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  const storageAvailable = isStorageAvailable();

  function save(state) {
    if (!storageAvailable || !state || typeof state !== "object") return false;
    const criticalNumbers = ["money", "totalEarned", "lifetimeEarned", "maxMoney", "research"];
    if (criticalNumbers.some((key) => typeof state[key] !== "number" || !Number.isFinite(state[key]))) {
      console.warn("Save skipped because a critical numeric field is invalid; preserving the previous save.");
      return false;
    }
    try {
      state.lastSaveTime = Date.now();
      const json = JSON.stringify(state);
      if (!json) return false;
      window.localStorage.setItem(SAVE_KEY, json);
      return true;
    } catch (e) {
      console.error("Save failed:", e);
      return false;
    }
  }

  function migrateRawSave(raw) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
    const versionValue = Number(raw.saveVersion);
    const version = Number.isFinite(versionValue) && versionValue > 0 ? Math.floor(versionValue) : 1;
    if (version > G.State.SAVE_VERSION) return null;
    const migrated = JSON.parse(JSON.stringify(raw));
    // Historical saves are intentionally normalized through the current sanitizer.
    // Version gates live here so future schema changes have an explicit migration home.
    migrated.saveVersion = G.State.SAVE_VERSION;
    return migrated;
  }

  function loadRaw() {
    if (!storageAvailable) return null;
    const keys = [SAVE_KEY, ...LEGACY_SAVE_KEYS];
    for (const key of keys) {
      try {
        const json = window.localStorage.getItem(key);
        if (!json) continue;
        const raw = JSON.parse(json);
        const migrated = migrateRawSave(raw);
        if (migrated) return migrated;
      } catch (e) {
        console.error("Save data corrupt, ignoring candidate:", key, e);
      }
    }
    return null;
  }

  // Returns { state, isNewGame }
  function load() {
    const raw = loadRaw();
    const state = G.State.sanitizeState(raw);
    const isNewGame = !raw;
    return { state, isNewGame };
  }

  function hardReset() {
    if (storageAvailable) {
      try {
        [SAVE_KEY, ...LEGACY_SAVE_KEYS].forEach((key) => window.localStorage.removeItem(key));
      } catch (e) { /* ignore */ }
    }
    return G.State.defaultState();
  }

  function exportSave(state) {
    try {
      return btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    } catch (e) {
      return null;
    }
  }

  function isLikelySave(raw) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return false;
    const hasSkills = raw.skills && typeof raw.skills === "object" && !Array.isArray(raw.skills);
    const hasLegacyProgress = raw.prestige && typeof raw.prestige === "object" && !Array.isArray(raw.prestige);
    const hasRooms = raw.rooms && typeof raw.rooms === "object" && !Array.isArray(raw.rooms);
    return typeof raw.money === "number" && Number.isFinite(raw.money)
      && Array.isArray(raw.zones)
      && raw.settings && typeof raw.settings === "object" && !Array.isArray(raw.settings)
      && (hasSkills || hasLegacyProgress)
      && hasRooms;
  }

  function importSave(base64) {
    try {
      if (typeof base64 !== "string" || !base64.trim()) return null;
      const json = decodeURIComponent(escape(atob(base64.trim())));
      const raw = JSON.parse(json);
      if (!isLikelySave(raw)) return null;
      const migrated = migrateRawSave(raw);
      if (!migrated) return null;
      return G.State.sanitizeState(migrated);
    } catch (e) {
      console.error("Import failed:", e);
      return null;
    }
  }

  G.Save = {
    SAVE_KEY, LEGACY_SAVE_KEYS, AUTOSAVE_INTERVAL_SEC, storageAvailable,
    save, load, loadRaw, hardReset, exportSave, importSave, isLikelySave,
  };
})(window.Game = window.Game || {});

/* ============================================================
   04-economy.js — All numeric formulas in one place.
   Pure functions operating on (state, DATA) -> numbers.
   Keeping formulas centralized avoids drift/duplication bugs.
   ============================================================ */
(function (G) {
  "use strict";
  const D = G.DATA;
  const techEffectCache = new WeakMap();
  const machineDefinitionCache = new WeakMap();

  // ---- Tech tree effect aggregation -----------------------------------
  // Tech purchases are infrequent compared with the game loop. Cache the aggregate
  // per state and invalidate only when a tech is actually purchased.
  const EMPTY_TECH_EFFECTS = Object.freeze({
    globalOutputMult: 0, globalSpeedMult: 0, critChanceAdd: 0, powerDiscount: 0,
    collectorSpeedMult: 0, rndRateMult: 0, upgradeDiscount: 0, vaultInterestAdd: 0,
    machineCostDiscount: 0,
  });

  function techEffects(state) {
    if (!state || !state.skills || !state.skills.tech) return EMPTY_TECH_EFFECTS;
    const cached = techEffectCache.get(state);
    if (cached) return cached;
    const eff = {
      globalOutputMult: 0,
      globalSpeedMult: 0,
      critChanceAdd: 0,
      powerDiscount: 0,
      collectorSpeedMult: 0,
      rndRateMult: 0,
      upgradeDiscount: 0,
      vaultInterestAdd: 0,
      machineCostDiscount: 0,
    };
    Object.keys(state.skills.tech).forEach((id) => {
      if (!state.skills.tech[id]) return;
      const t = D.techById(id);
      if (!t) return;
      const e = t.effect;
      if (eff[e.type] !== undefined) eff[e.type] += e.value;
    });
    techEffectCache.set(state, eff);
    return eff;
  }

  function invalidateTechEffects(state) {
    if (state && typeof state === "object") techEffectCache.delete(state);
  }


  // ---- Machine placement cost: scales with how many of that tier are
  // already placed anywhere in the factory (global count per tier). ----
  function tierPlacedCount(state, tierId) {
    let n = 0;
    state.zones.forEach((z) => z.floors.forEach((f) => f.grid.forEach((s) => {
      if (s.machine && s.machine.tierId === tierId) n++;
    })));
    return n;
  }

  function machineCountById(state, machineId) {
    let n = 0;
    state.zones.forEach((z) => z.floors.forEach((f) => f.grid.forEach((s) => {
      if (s.machine && s.machine.typeId === machineId) n++;
    })));
    return n;
  }

  function machineCostById(state, machineId) {
    const def = D.machineById(machineId);
    if (!def) return Infinity;
    const n = machineCountById(state, machineId);
    const eff = techEffects(state);
    const raw = def.baseCost * Math.pow(def.costGrowth || 1, n);
    return Math.ceil(raw * (1 - Math.min(0.6, eff.machineCostDiscount)));
  }

  function machineCost(state, tierIdOrMachineId) {
    const def = D.machineById(tierIdOrMachineId);
    if (def) return machineCostById(state, def.id);
    const type = D.machineTypeById(tierIdOrMachineId);
    if (type) return machineCostById(state, type.id);
    const tier = D.tierById(tierIdOrMachineId);
    return tier ? machineCostById(state, "printer_" + tier.id) : Infinity;
  }

  function tierUnlocked(state, tierId) {
    const tier = D.tierById(tierId);
    if (!tier || !tier.unlockRequirement) return !!tier;
