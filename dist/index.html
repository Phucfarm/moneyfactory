/* ============================================================
   05-factory.js — Factory simulation: machines, conveyors,
   auto-collectors, zones/floors, and rooms tick. This is the
   beating heart of the active production loop.
   ============================================================ */
(function (G) {
  "use strict";
  const D = G.DATA;
  const E = G.Econ;

  // Runtime-only (non-persisted-critical) per-floor timers, keyed by Zone + floor.
  // Floor ids are only required to be unique inside a Zone, so floor id alone
  // is not a safe runtime key once multiple Zones exist.
  const floorRuntime = {}; // { [zoneId + "::" + floorId]: { collectorTimer, bonusTimer } }
  // Reused because tick() is strictly synchronous: Core dispatch and Main event
  // processing finish before the next tick starts. This removes one array allocation
  // per animation frame without changing the event contract.
  const tickEvents = [];
  function rt(zoneId, floorId) {
    const key = String(zoneId) + "::" + String(floorId);
    if (!floorRuntime[key]) floorRuntime[key] = { collectorTimer: 0, bonusTimer: 3 + Math.random() * 6 };
    return floorRuntime[key];
  }

  function getZone(state, zoneId) { return state.zones.find((z) => z.id === zoneId); }
  function getFloor(state, zoneId, floorId) {
    const z = getZone(state, zoneId);
    return z ? z.floors.find((f) => f.id === floorId) : null;
  }
  function currentZone(state) { return getZone(state, state.currentZoneId); }
  function currentFloor(state) { return getFloor(state, state.currentZoneId, state.currentFloorId); }

  // ---- Placement / upgrades ---------------------------------------------
  function canPlaceMachine(state, slot) {
    return !slot.machine;
  }

  function normalizeMachineId(machineIdOrTierId) {
    if (D.machineById(machineIdOrTierId)) return machineIdOrTierId;
    if (D.tierById(machineIdOrTierId) && Array.isArray(D.MACHINE_TYPES)) {
      const type = D.MACHINE_TYPES.find((item) => item && item.tierId === machineIdOrTierId);
      return type ? type.id : null;
    }
    return null;
  }

  function placeMachine(state, zoneId, floorId, r, c, machineIdOrTierId, events) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor || !floor.unlocked) return { ok: false, reason: "floorLocked" };
    const machineId = normalizeMachineId(machineIdOrTierId);
    const def = machineId ? D.machineById(machineId) : null;
    if (!def) return { ok: false, reason: "machineInvalid" };
    if (def.kind === "zone" && !G.Zone.canPlaceMachineInZone(state, machineId, zoneId)) {
      return { ok: false, reason: "wrongZone", machineId, requiredZoneId: def.zoneId };
    }
    if (!G.Zone.isMachineUnlocked(state, machineId)) return { ok: false, reason: "machineLocked", machineId };
    const slot = floor.grid.find((s) => s.r === r && s.c === c);
    if (!slot || slot.machine) return { ok: false, reason: "occupied" };
    const cost = E.machineCostById(state, machineId);
    if (state.money < cost) return { ok: false, reason: "money", cost, machineId };
    state.money -= cost;
    slot.machine = {
      typeId: machineId,
      tierId: def.tierId || "common",
      levels: { speed: 0, output: 0, ink: 0 },
      progress: 0,
      banked: 0,
    };
    state.stats.totalMachinesPlaced++;
    const zoneStats = G.Zone.getZoneState(state, zoneId).stats;
    zoneStats.machinesPlaced = (zoneStats.machinesPlaced || 0) + 1;
    G.Zone.onMachinePlaced(state, zoneId, floor, slot.machine, slot, events || null);
    if (Array.isArray(events)) events.push({ type: "machinePlaced", zoneId, floorId, r, c, machineId, cost });
    return { ok: true, cost, machineId, tierId: def.tierId || null };
  }

  function upgradeMachine(state, zoneId, floorId, r, c, upgradeId) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor || !floor.unlocked) return { ok: false, reason: "floorLocked" };
    const slot = floor.grid.find((s) => s.r === r && s.c === c);
    if (!slot || !slot.machine) return { ok: false };
    const u = D.UPGRADES[upgradeId];
    if (!u) return { ok: false, reason: "invalid" };
    const cur = slot.machine.levels[upgradeId];
    if (cur >= u.maxLevel) return { ok: false, reason: "max" };
    const cost = E.upgradeCost(upgradeId, cur, state);
    if (state.money < cost) return { ok: false, reason: "money", cost };
    state.money -= cost;
    slot.machine.levels[upgradeId] = cur + 1;
    state.stats.totalUpgradesBought++;
    return { ok: true, cost, newLevel: cur + 1 };
  }

  // ---- Floor systems (conveyor / collector) ---------------------
  function buyFloorSystem(state, zoneId, floorId, systemId) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor || !floor.unlocked) return { ok: false, reason: "floorLocked" };
    const def = D.FLOOR_SYSTEMS[systemId];
    if (!def) return { ok: false, reason: "invalid" };
    const cur = floor.systems[systemId];
    if (cur >= def.maxLevel) return { ok: false, reason: "max" };
    const cost = E.floorSystemCost(systemId, cur, state);
    if (state.money < cost) return { ok: false, reason: "money", cost };
    // Power check for turning ON the collector (level 0 -> 1)
    if (systemId === "collector" && cur === 0) {
      const eff = E.techEffects(state);
      const discount = 1 - Math.min(0.4, eff.powerDiscount);
      const addedDemand = D.POWER_COST_COLLECTOR * discount;
      const demandAfter = E.powerDemand(state) + addedDemand;
      if (demandAfter > E.powerCapacity(state) + 1e-9) {
        return { ok: false, reason: "power" };
      }
    }
    state.money -= cost;
    floor.systems[systemId] = cur + 1;
    state.stats.totalUpgradesBought = Math.max(0, Number(state.stats.totalUpgradesBought) || 0) + 1;
    return { ok: true, cost, newLevel: cur + 1 };
  }

  // ---- Zones / floors unlocking -------------------------------------------
  function unlockZone(state, zoneId, events) {
    return G.Zone.unlockZone(state, zoneId, events);
  }

  function unlockFloor(state, zoneId, floorId, events) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor) return { ok: false };
    return G.Zone.unlockFloor(state, zoneId, floorId, events);
  }

  // ---- Rooms -----------------------------------------------------------------
  function upgradeRoom(state, roomId) {
    const def = D.ROOMS[roomId];
    if (!def) return { ok: false, reason: "invalid" };
    const cur = state.rooms[roomId].level;
    if (cur >= def.maxLevel) return { ok: false, reason: "max" };
    const cost = E.roomCost(roomId, cur);
    if (state.money < cost) return { ok: false, reason: "money", cost };
    state.money -= cost;
    state.rooms[roomId].level = cur + 1;
    return { ok: true, cost, newLevel: cur + 1 };
  }

  // ---- Collection ---------------------------------------------------------
  function grantMoney(state, amount) {
    if (!Number.isFinite(amount) || amount <= 0) return;
    state.money += amount;
    state.maxMoney = Math.max(state.maxMoney, state.money);
    state.totalEarned += amount;
    state.lifetimeEarned += amount;
  }

  // Explicit, bounded onboarding rewards. Guidance may request these milestones,
  // but the gameplay-owned Factory API performs the actual money mutation.
  const TUTORIAL_BONUSES = Object.freeze({ firstCollect: 100, basicDone: 1000 });
  function grantTutorialBonus(state, milestoneId) {
    const amount = TUTORIAL_BONUSES[milestoneId];
    if (!Number.isFinite(amount) || amount <= 0) return 0;
    grantMoney(state, amount);
    return amount;
  }

  function chargeMoney(state, amount, _reason) {
    const value = Number(amount);
    if (!Number.isFinite(value) || value <= 0) return 0;
    const charged = Math.min(Math.max(0, Number(state.money) || 0), value);
    state.money -= charged;
    return charged;
  }

  // Collection action contract: always returns { ok, amount, reason? }.
  // `amount` remains present for backwards compatibility with the UI.
  function collectMachine(state, zoneId, floorId, r, c, events) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor || !floor.unlocked) return { ok: false, amount: 0, reason: "floorLocked" };
    const slot = floor.grid.find((s) => s.r === r && s.c === c);
    if (!slot || !slot.machine || slot.machine.banked <= 0) return { ok: false, amount: 0, reason: "empty" };
    const amount = slot.machine.banked;
    slot.machine.banked = 0;
    grantMoney(state, amount);
    state.stats.totalClicks++;
    const zoneStats = G.Zone.getZoneState(state, zoneId).stats;
    zoneStats.cashCollected = (zoneStats.cashCollected || 0) + amount;
    if (G.Zone) G.Zone.onMachineCollected(state, zoneId, floor, slot.machine, slot, amount, events || null, false);
    if (Array.isArray(events)) events.push({ type: "machineCollected", zoneId, floorId, r, c, machineId: slot.machine.typeId, amount, automatic: false });
    return { ok: true, amount };
  }

  function collectFloor(state, zoneId, floorId, events) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor || !floor.unlocked) return 0;
    let total = 0;
    floor.grid.forEach((s) => {
      if (s.machine && s.machine.banked > 0) {
        const amount = s.machine.banked;
        total += amount;
        s.machine.banked = 0;
        if (G.Zone) G.Zone.onMachineCollected(state, zoneId, floor, s.machine, s, amount, events || null, true);
        if (Array.isArray(events)) events.push({ type: "machineCollected", zoneId, floorId, r: s.r, c: s.c, machineId: s.machine.typeId, amount, automatic: true });
      }
    });
    const zoneStats = G.Zone.getZoneState(state, zoneId).stats;

  // ---- Core production tick (used by live loop, called every frame) --------
  // events: array the caller can push {type,...} onto for render/audio hooks.
  function tickFloor(state, zone, floor, dt, events) {
    const outMult = E.floorOutputMult(floor);
    const hasCollector = floor.systems.collector > 0;
    const r = rt(zone.id, floor.id);
    const eff = E.techEffects(state);
    const speedPerLevel = D.UPGRADES.speed.effectPerLevel;
    const outputPerLevel = D.UPGRADES.output.effectPerLevel;
    const inkPerLevel = D.UPGRADES.ink.effectPerLevel;

        const outputLvl = Number(m.levels && m.levels.output) || 0;
        const outputMult = 1 + outputPerLevel * outputLvl + eff.globalOutputMult;
        let yieldAmt = def ? def.baseYield * outputMult * outMult : 0;
        const inkLvl = Number(m.levels && m.levels.ink) || 0;
        const critChance = def ? Math.min(0.6, def.critChance + inkPerLevel * inkLvl + eff.critChanceAdd) : 0;
        const isCrit = Math.random() < critChance;
        if (isCrit) yieldAmt *= def ? (def.critMult + 0.15 * inkLvl) : 1;
        const zoneMultiplier = G.Zone.getProductionMultiplier(state, zone.id, floor, m, slot);
        yieldAmt *= zoneMultiplier;
        const result = { amount: yieldAmt, crit: isCrit };

        zone.stats.cashGenerated = (zone.stats.cashGenerated || 0) + yieldAmt;
        if (yieldAmt >= 0) m.banked += yieldAmt;
        else chargeMoney(state, -yieldAmt, "negativeProduction");
        if (events) events.push({ type: "cycle", zoneId: zone.id, floorId: floor.id, r: slot.r, c: slot.c, amount: yieldAmt, crit: isCrit });
        G.Zone.afterMachineCycle(state, zone, floor, m, slot, result, events);

    if (hasCollector) {
      const tickSec = E.collectorTickSeconds(floor, state);
      r.collectorTimer += dt;
      if (tickSec && r.collectorTimer >= tickSec) {
        r.collectorTimer = 0;

    // but we run it for all unlocked floors so it's consistent with idle sim).
    r.bonusTimer -= dt;

      r.bonusTimer = 12 + Math.random() * 18;
      const occupied = floor.grid.filter((s) => s.machine);
      if (occupied.length > 0 && events) {
        const pick = occupied[Math.floor(Math.random() * occupied.length)];
        events.push({ type: "bonusReady", zoneId: zone.id, floorId: floor.id, r: pick.r, c: pick.c });
      }
    }
  }


  function tick(state, dt) {
    const events = tickEvents;
    events.length = 0;
    const zones = state.zones;
    for (let zi = 0; zi < zones.length; zi++) {
      const zone = zones[zi];
      if (!zone.unlocked) continue;
      G.Zone.beforeZoneTick(state, zone, dt, events);
      let zoneHadUnlockedFloor = false;
      const floors = zone.floors;
      for (let fi = 0; fi < floors.length; fi++) {
        const floor = floors[fi];
        if (!floor.unlocked) continue;
        zoneHadUnlockedFloor = true;
        tickFloor(state, zone, floor, dt, events);
        G.Zone.afterTick(state, zone, floor, dt, events);
      }
      if (zoneHadUnlockedFloor) zone.stats.playTimeSeconds = (zone.stats.playTimeSeconds || 0) + dt;
      G.Zone.afterZoneTick(state, zone, dt, events);
    }
    // Resolve discoveries after gameplay state changes but before dispatch so
    // mechanic-emitted discovery/events can participate in the same bounded
    // event chain during this tick.
    G.Zone.checkAllSecrets(state, events);
    G.Zone.dispatchEvents(state, events);
    // R&D research accrual
    const rndRate = E.rndRatePerSec(state);
    if (rndRate > 0) state.research += rndRate * dt;
    // Vault passive interest, applied continuously (per-hour rate -> per-second)
    const interestPerHour = E.vaultInterestPerHour(state);
    if (interestPerHour > 0 && state.money > 0) {
      grantMoney(state, state.money * (interestPerHour / 3600) * dt);
    }
    state.stats.playTimeSeconds += dt;

    // Cumulative online-time rewards. The remainder is stored in onlineSeconds,
    // so 15 min today + 15 min tomorrow still crosses the same 30 min milestone.
    const interval = D.SKILL_POINT_INTERVAL_SECONDS;
    const before = Math.floor((state.skills.onlineSeconds || 0) / interval);
    state.skills.onlineSeconds = Math.max(0, (state.skills.onlineSeconds || 0) + Math.max(0, dt));
    const after = Math.floor(state.skills.onlineSeconds / interval);
    const gainedSkillPoints = after - before;
    if (gainedSkillPoints > 0) {
      state.skills.points += gainedSkillPoints;
      events.push({ type: "skillPoint", amount: gainedSkillPoints });
    }

    return events;
  }

  // ---- Tech tree purchase ---------------------------------------------------
  function buyTech(state, techId) {
    const tech = D.techById(techId);
    if (!tech) return { ok: false };
    if (state.skills.tech[techId]) return { ok: false, reason: "owned" };
    if (!E.techRequirementsMet(state, tech)) return { ok: false, reason: "requires" };
    const purchaseReason = E.techPurchaseReason(state, tech);
    if (purchaseReason) return { ok: false, reason: purchaseReason };
    state.skills.points -= tech.cost;
    state.research -= tech.researchCost;
    state.skills.tech[techId] = true;
    if (E.invalidateTechEffects) E.invalidateTechEffects(state);
    return { ok: true };
  }

  G.Factory = {
    getZone, getFloor, currentZone, currentFloor,
    canPlaceMachine, placeMachine, upgradeMachine,
    buyFloorSystem, unlockZone, unlockFloor, upgradeRoom,
    collectMachine, collectFloor, grantMoney, grantTutorialBonus, chargeMoney,
    tick, tickFloor,
    buyTech,
    resetRuntime() { Object.keys(floorRuntime).forEach((k) => delete floorRuntime[k]); },
  };
})(window.Game = window.Game || {});

/* ============================================================
   08-audio.js — Audio Core.

   The Web Audio API remains the backwards-compatible synthesized fallback.
   External assets can be registered in content/audio.json or referenced
   directly from Zone/content JSON via an optional `audio` field.

   External audio is intentionally decoupled from Zone gameplay rules:
   content declares what should play, this core owns loading/playback/volume,
   and Main routes transient game events here.
   ============================================================ */
(function (G) {
  "use strict";

  const D = G.DATA || {};
  const AudioContent = G.AudioContent || { assets: [], events: {} };
  const audioAssets = new Map((Array.isArray(AudioContent.assets) ? AudioContent.assets : [])
    .filter((item) => item && typeof item.id === "string")
    .map((item) => [item.id, item]));

  let ctx = null;
  let masterGain, sfxGain, musicGain;
  let unlocked = false;
  let musicEnabled = true, sfxEnabled = true;
  let musicVolume = 0.35, sfxVolume = 0.7;
  let musicTimer = null;
  let humNodes = new Map(); // key -> {osc, gain}

  let externalMusic = null;
  let externalMusicRef = null;
  let externalMusicSpec = null;
  const musicFadeTimers = new Map();
  const activeSfx = new Set();
  const sfxLastPlayedAt = new Map();

  function ensureCtx() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(ctx.destination);

    sfxGain = ctx.createGain();
    sfxGain.gain.value = sfxVolume;
    sfxGain.connect(masterGain);

    musicGain = ctx.createGain();
    musicGain.gain.value = musicVolume;
    musicGain.connect(masterGain);
    return ctx;
  }

  function unlock() {
    const c = ensureCtx();
    if (c && c.state === "suspended") c.resume().catch(() => {});
    unlocked = true;
    resumeExternalMusic();
    if (musicEnabled && !externalMusicSpec) startSynthMusic();
  }

  function setSfxEnabled(v) { sfxEnabled = !!v; }
  function setMusicEnabled(v) {
    musicEnabled = !!v;
    if (!musicEnabled) stopMusic();
    else resumeMusic();
  }
  function setSfxVolume(v) {
    sfxVolume = Math.max(0, Math.min(1, Number(v) || 0));
    if (sfxGain) sfxGain.gain.value = sfxVolume;
    activeSfx.forEach((entry) => {
      try { entry.node.volume = Math.max(0, Math.min(1, sfxVolume * entry.baseVolume)); } catch (_) {}
    });
  }
  function setMusicVolume(v) {
    musicVolume = Math.max(0, Math.min(1, Number(v) || 0));
    if (musicGain) musicGain.gain.value = musicVolume;
    if (externalMusic && externalMusicSpec) externalMusic.volume = trackVolume(externalMusicSpec);
  }

  // ---- Generic tone helper -------------------------------------------------
  function tone({ freq = 440, type = "sine", dur = 0.15, gain = 0.3, slideTo = null, delay = 0, attack = 0.005, decay = null }) {
    if (!sfxEnabled) return;
    const c = ensureCtx();
    if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (decay || dur));
    osc.connect(g);
    g.connect(sfxGain);
    osc.start(t0);
    osc.stop(t0 + (decay || dur) + 0.05);
  }

  function noiseBurst({ dur = 0.12, gain = 0.2, delay = 0, filterFreq = 2000 }) {
    if (!sfxEnabled) return;
    const c = ensureCtx();
    if (!c) return;
    const t0 = c.currentTime + delay;
    const bufferSize = c.sampleRate * dur;
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = c.createBufferSource();
    src.buffer = buffer;
    const filt = c.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = filterFreq;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, t0);

    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function gearPath(teeth) {
    const key = String(teeth);
    if (gearPathCache.has(key)) return gearPathCache.get(key);
    const path = new Path2D();
    const toothH = 0.34;
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2;
      const a1 = a0 + (Math.PI * 2) / teeth / 2;
      const a2 = a0 + (Math.PI * 2) / teeth;
      path.lineTo(Math.cos(a0), Math.sin(a0));
      path.lineTo(Math.cos(a1) * (1 + toothH), Math.sin(a1) * (1 + toothH));
      path.lineTo(Math.cos(a2), Math.sin(a2));
    }
    path.closePath();
    gearPathCache.set(key, path);
    return path;
  }

  function drawGear(cx, cy, radius, teeth, rotation, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.scale(radius, radius);
    ctx.fillStyle = color;
    ctx.fill(gearPath(teeth));
    ctx.beginPath();
    ctx.arc(0, 0, 0.62, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fill();
    ctx.restore();
  }

  function drawFloorBackground(floor, zoneDef, includeConveyor = true) {
    const theme = zoneDef && zoneDef.theme ? zoneDef.theme : {};
    const b = gridWorldBounds();
    const tl = worldToScreen(b.x0 - CELL * 0.6, b.y0 - CELL * 0.6);
    const br = worldToScreen(b.x0 + b.w + CELL * 0.6, b.y0 + b.h + CELL * 0.6);

    // The DOM Background Core owns the full-zone visual layer. Canvas stays transparent
    // outside the placement floor so CSS backgrounds are visible underneath.
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

    // floor slab
    ctx.fillStyle = theme.floor || "#22262f";
    roundRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y, 18 * camera.zoom);
    ctx.fill();

    // grid tiles (checker, subtle)
    for (let r = 0; r < D.GRID_ROWS; r++) {
      for (let c = 0; c < D.GRID_COLS; c++) {
        const p = slotWorldPos(r, c);
        const s = worldToScreen(p.x - CELL / 2, p.y - CELL / 2);
        const size = CELL * camera.zoom;
        ctx.fillStyle = (r + c) % 2 === 0 ? (theme.tileA || "rgba(255,255,255,0.02)") : (theme.tileB || "rgba(255,255,255,0.045)");
        ctx.fillRect(s.x, s.y, size, size);
      }
    }

    // conveyor belts along each row if floor has conveyor level
    if (includeConveyor && floor.systems.conveyor > 0) {
      for (let r = 0; r < D.GRID_ROWS; r++) {
        const left = slotWorldPos(r, 0);
        const right = slotWorldPos(r, D.GRID_COLS - 1);
        const sL = worldToScreen(left.x - CELL / 2, left.y + CELL * 0.34);
        const sR = worldToScreen(right.x + CELL / 2, right.y + CELL * 0.44);
        drawConveyorStrip(sL.x, sL.y, sR.x - sL.x, (sR.y - sL.y) + 14 * camera.zoom, floor.systems.conveyor);
      }
    }

    // grid outline
    ctx.strokeStyle = theme.grid || "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    for (let r = 0; r <= D.GRID_ROWS; r++) {
      const p1 = worldToScreen(b.x0, b.y0 + r * CELL);
      const p2 = worldToScreen(b.x0 + b.w, b.y0 + r * CELL);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    for (let c = 0; c <= D.GRID_COLS; c++) {
      const p1 = worldToScreen(b.x0 + c * CELL, b.y0);
      const p2 = worldToScreen(b.x0 + c * CELL, b.y0 + b.h);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
  }

  function drawConveyorStrip(x, y, w, h, level) {
    ctx.save();
    ctx.fillStyle = "#12151b";
    roundRect(x, y, w, Math.max(6, h * 0.4), 4);
    ctx.fill();
    ctx.strokeStyle = "#3a4250";
    ctx.lineWidth = 2;
    roundRect(x, y, w, Math.max(6, h * 0.4), 4);
    ctx.stroke();
    const dashLen = 18 * camera.zoom;
    const speed = 40 * (1 + level * 0.25);
    const offset = (timeAcc * speed) % (dashLen * 2);
    ctx.strokeStyle = "#ffcf6b";
    ctx.lineWidth = 3;
    ctx.setLineDash([dashLen * 0.5, dashLen * 0.5]);
    ctx.lineDashOffset = -offset;
    ctx.beginPath();
    ctx.moveTo(x + 4, y + Math.max(6, h * 0.4) / 2);
    ctx.lineTo(x + w - 4, y + Math.max(6, h * 0.4) / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawEmptySlot(r, c, tierIdForGhost) {
    const p = slotWorldPos(r, c);
    const s = worldToScreen(p.x, p.y);
    const size = (CELL - MACHINE_PAD * 2) * camera.zoom;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#5865f2";
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    roundRect(s.x - size / 2, s.y - size / 2, size, size, 12 * camera.zoom);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#5865f2";
    ctx.beginPath();
    ctx.arc(s.x, s.y, 10 * camera.zoom, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.font = `${16 * camera.zoom}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("+", s.x, s.y - 1 * camera.zoom);
    ctx.restore();
  }

  function drawMechanicStatus(status, size, cx, cy) {
    if (!status) return;
    const toneColor = { danger: "#ff6578", warn: "#ffc857", info: "#67d8ff", good: "#6fe39a", muted: "#a2a8b2" }[status.tone] || "#67d8ff";
    ctx.save();
    const alpha = status.variant === "disabled" ? 0.72 : 0.58;
    ctx.globalAlpha = alpha;
    if (status.variant === "disabled") {
      ctx.fillStyle = "rgba(7,20,28,0.72)";
      roundRect(cx - size * 0.45, cy - size * 0.34, size * 0.9, size * 0.68, 8 * camera.zoom);
      ctx.fill();
      ctx.strokeStyle = hexAlpha(toneColor, 0.95);
      ctx.lineWidth = 2 * camera.zoom;
      ctx.setLineDash([6 * camera.zoom, 4 * camera.zoom]);
      roundRect(cx - size * 0.45, cy - size * 0.34, size * 0.9, size * 0.68, 8 * camera.zoom);
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (status.variant === "buff") {
      ctx.strokeStyle = hexAlpha(toneColor, 0.95);
      ctx.lineWidth = 3 * camera.zoom;
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.46, 0, Math.PI * 2);
      ctx.stroke();
    } else if (status.variant === "warning") {
      ctx.fillStyle = hexAlpha(toneColor, 0.12);
      roundRect(cx - size * 0.45, cy - size * 0.34, size * 0.9, size * 0.68, 8 * camera.zoom);
      ctx.fill();
    }

    const icon = typeof status.icon === "string" ? status.icon : "";
    if (icon) {
      ctx.font = `bold ${Math.max(11, 15 * camera.zoom)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = toneColor;
      ctx.fillText(icon, cx, cy - size * 0.02);
    }
    const label = typeof status.label === "string" ? status.label : "";
    if (label) {
      ctx.font = `bold ${Math.max(8, 8.5 * camera.zoom)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillStyle = "#f4f7fb";
      ctx.fillText(label, cx, cy + size * 0.24, size * 0.78);
    }
    if (Number.isFinite(Number(status.value))) {
      ctx.font = `bold ${Math.max(8, 8 * camera.zoom)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillStyle = toneColor;
      const unit = typeof status.valueUnit === "string" ? status.valueUnit : "";
      ctx.fillText(String(status.value) + unit, cx, cy - size * 0.26, size * 0.76);
    }
    if (typeof status.value === "string") {
      ctx.font = `bold ${Math.max(8, 8 * camera.zoom)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillStyle = toneColor;
      ctx.fillText(status.value, cx, cy - size * 0.26, size * 0.76);
    }
    if (Number.isFinite(Number(status.progress))) {
      const p = Math.max(0, Math.min(1, Number(status.progress)));
      const barW = size * 0.68, barH = Math.max(2, 3 * camera.zoom);
      const barX = cx - barW / 2, barY = cy + size * 0.34;
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = toneColor;
      ctx.fillRect(barX, barY, barW * p, barH);
    }
    ctx.restore();
  }

  function getDataCached(map, id, getter) {
    if (!id) return null;
    if (map.has(id)) return map.get(id);
    const value = getter(id);
    map.set(id, value || null);
    return value || null;
  }

  function drawMachine(slot, isHover, isSelected, mechanicStatus) {
    const m = slot.machine;
    const machine = getDataCached(machineCache, m.typeId, D.machineById);
    const tier = getDataCached(tierCache, m.tierId, D.tierById) || { order: 0, color: "#9aa5ad", glow: "#c7cfd4", particleDensity: 0.5, id: "common" };
    const visual = machine || tier;
    const p = slotWorldPos(slot.r, slot.c);
    const s = worldToScreen(p.x, p.y);
    const size = (CELL - MACHINE_PAD * 2) * camera.zoom;
    const bodyH = size * 0.62;

    ctx.save();

    // glow for higher tiers
    if ((visual.order || 0) >= 2) {
      const grad = ctx.createRadialGradient(s.x, s.y, size * 0.1, s.x, s.y, size * 0.75);
      grad.addColorStop(0, hexAlpha(visual.glow, 0.28));
      grad.addColorStop(1, hexAlpha(visual.glow, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(s.x, s.y, size * 0.75, 0, Math.PI * 2);
      ctx.fill();
    }

    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(s.x, s.y + size * 0.34, size * 0.38, size * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // body
    const bx = s.x - size * 0.42, by = s.y - bodyH * 0.55;
    const grad2 = ctx.createLinearGradient(bx, by, bx, by + bodyH);
    grad2.addColorStop(0, shade(visual.color, 18));
    grad2.addColorStop(1, shade(visual.color, -18));
    ctx.fillStyle = grad2;
    roundRect(bx, by, size * 0.84, bodyH, 8 * camera.zoom);
    ctx.fill();
    ctx.strokeStyle = isSelected ? "#ffffff" : isHover ? hexAlpha("#ffffff", 0.6) : "rgba(0,0,0,0.35)";
    ctx.lineWidth = isSelected ? 3 : 1.5;
    roundRect(bx, by, size * 0.84, bodyH, 8 * camera.zoom);
    ctx.stroke();

    // paper output slot
    ctx.fillStyle = "#12151b";
    roundRect(bx + size * 0.1, by + bodyH * 0.62, size * 0.64, bodyH * 0.22, 3 * camera.zoom);
    ctx.fill();
    // paper sliding out animated by progress
    const paperProgress = m.progress;
    ctx.save();
    ctx.beginPath();
    roundRect(bx + size * 0.1, by + bodyH * 0.62, size * 0.64, bodyH * 0.22, 3 * camera.zoom);
    ctx.clip();
    ctx.fillStyle = "#eef1e6";
    const paperW = size * 0.3;
    const px = bx + size * 0.1 + paperProgress * (size * 0.64 + paperW) - paperW;
    ctx.fillRect(px, by + bodyH * 0.62, paperW, bodyH * 0.22);
    ctx.strokeStyle = "#9aa08c";
    ctx.lineWidth = 1;
    for (let i = 1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(px + (paperW * i) / 3, by + bodyH * 0.66);
      ctx.lineTo(px + (paperW * i) / 3, by + bodyH * 0.8);
      ctx.stroke();
    }
    ctx.restore();

    // gear
    const gearR = size * 0.16;
    const rot = timeAcc * (1.4 + tier.order * 0.5) * (m.banked > 0 ? 1.6 : 1);
    drawGear(s.x + size * 0.24, by + bodyH * 0.28, gearR, 8, rot, shade(visual.color, -35));
    drawGear(s.x + size * 0.24 - gearR * 1.3, by + bodyH * 0.28 + gearR * 0.2, gearR * 0.65, 6, -rot * 1.4, shade(visual.color, -50));

    // Data-driven machine silhouettes. Zone content can opt into a visual shape
    // without adding Zone-id branches to the renderer.
    const visualShape = visual && visual.visual && typeof visual.visual.shape === "string" ? visual.visual.shape : "";
    if (visualShape === "abyssal") {
      ctx.save();
      ctx.translate(s.x + size * 0.03, by + bodyH * 0.28);
      ctx.fillStyle = visual.glow;
      ctx.globalAlpha = 0.95;
      ctx.fillRect(-size * 0.08, -size * 0.04, size * 0.16, size * 0.12);
      ctx.fillRect(-size * 0.055, -size * 0.16, size * 0.11, size * 0.22);
      ctx.strokeStyle = visual.glow;
      ctx.lineWidth = 2 * camera.zoom;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.17, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (visualShape === "leviathan") {
      ctx.save();
      ctx.translate(s.x + size * 0.03, by + bodyH * 0.28);
      ctx.strokeStyle = visual.glow;
      ctx.fillStyle = visual.glow;
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = 2 * camera.zoom;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, size * (0.08 + i * 0.055), -Math.PI * 0.8, Math.PI * 0.8);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(-size * 0.1, 0);
      ctx.lineTo(size * 0.1, 0);
      ctx.lineTo(0, size * 0.09);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (tier.id === "rare") {
      ctx.save(); ctx.translate(s.x + size * 0.03, by + bodyH * 0.28); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = tier.glow; ctx.globalAlpha = 0.9;
      ctx.fillRect(-size * 0.055, -size * 0.055, size * 0.11, size * 0.11); ctx.restore();
    } else if (tier.id === "ascendant") {
      ctx.save(); ctx.translate(s.x + size * 0.03, by + bodyH * 0.28);
      ctx.fillStyle = tier.glow; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(0, -size * 0.09); ctx.lineTo(size * 0.09, size * 0.07); ctx.lineTo(-size * 0.09, size * 0.07); ctx.closePath(); ctx.fill(); ctx.restore();
    } else if (tier.id === "transcendent") {
      ctx.save(); ctx.translate(s.x + size * 0.03, by + bodyH * 0.28);
      ctx.fillStyle = tier.glow; ctx.globalAlpha = 0.95;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5; const r = i % 2 ? size * 0.045 : size * 0.11; const x = Math.cos(a) * r, y = Math.sin(a) * r; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // tier label chip
    ctx.fillStyle = shade(visual.color, -45);
    roundRect(bx + 4 * camera.zoom, by + 4 * camera.zoom, size * 0.28, bodyH * 0.16, 4 * camera.zoom);
    ctx.fill();

    // progress ring (small, top-right)
    const ringR = size * 0.1;
    const ringCx = bx + size * 0.84 - ringR - 4 * camera.zoom;
    const ringCy = by + ringR + 4 * camera.zoom;
    ctx.beginPath();
    ctx.arc(ringCx, ringCy, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.lineWidth = 3 * camera.zoom;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ringCx, ringCy, ringR, -Math.PI / 2, -Math.PI / 2 + m.progress * Math.PI * 2);
    ctx.strokeStyle = "#ffe27a";
    ctx.lineWidth = 3 * camera.zoom;
    ctx.stroke();

    // banked cash stack indicator
    if (m.banked > 0) {
      const bcx = s.x, bcy = by - 10 * camera.zoom;
      const pulse = 1 + Math.sin(timeAcc * 6) * 0.06;
      ctx.save();
      ctx.translate(bcx, bcy);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = "#2fae59";
      roundRect(-16 * camera.zoom, -10 * camera.zoom, 32 * camera.zoom, 20 * camera.zoom, 3 * camera.zoom);
      ctx.fill();
      ctx.strokeStyle = "#1d7a3d";
      ctx.lineWidth = 1.5;
      roundRect(-16 * camera.zoom, -10 * camera.zoom, 32 * camera.zoom, 20 * camera.zoom, 3 * camera.zoom);
      ctx.stroke();
      ctx.fillStyle = "#eafff0";
      ctx.font = `bold ${11 * camera.zoom}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("$", 0, 1);
      ctx.restore();

      // faint upward cash label
      ctx.fillStyle = "#ffe27a";
      ctx.font = `bold ${12 * camera.zoom}px sans-serif`;
      ctx.textAlign = "center";
      let cashText = cashTextCache.get(m);
      if (!cashText || cashText.value !== m.banked) {
        cashText = { value: m.banked, text: E.formatMoney(m.banked) };
        cashTextCache.set(m, cashText);
      }
      ctx.fillText(cashText.text, bcx, bcy - 18 * camera.zoom);
    }

    // idle smoke puffs from higher tier machines
    if ((visual.order || 0) >= 1 && Math.random() < 0.02 * (visual.particleDensity || 1)) {
      spawnParticle({
        kind: "smoke",
        x: s.x + (Math.random() - 0.5) * size * 0.3,
        y: by,
        vx: (Math.random() - 0.5) * 6,
        vy: -18 - Math.random() * 10,
        life: 1.4 + Math.random() * 0.6,
        size: 6 * camera.zoom + Math.random() * 4,
        color: "rgba(255,255,255,0.25)",
      });
    }

    if (mechanicStatus) {
      const labelText = mechanicStatus.labelKey && G.i18n ? G.i18n.t(mechanicStatus.labelKey) : "";
      const detailText = mechanicStatus.detailKey && G.i18n ? G.i18n.t(mechanicStatus.detailKey, mechanicStatus.params) : "";
      drawMechanicStatus(Object.assign({}, mechanicStatus, { label: labelText, detail: detailText }), size, s.x, s.y);
    }

    ctx.restore();
  }

  function shade(hex, percent) {
    const cacheKey = String(hex) + ":" + String(percent);
    if (shadeCache.has(cacheKey)) return shadeCache.get(cacheKey);
    const num = parseInt(String(hex).replace("#", ""), 16);
    let r = (num >> 16) + Math.round((percent / 100) * 255);
    let g = ((num >> 8) & 0x00ff) + Math.round((percent / 100) * 255);
    let b = (num & 0x0000ff) + Math.round((percent / 100) * 255);
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    const out = `rgb(${r},${g},${b})`;
    shadeCache.set(cacheKey, out);
    return out;
  }
  function hexAlpha(hex, a) {
    const cacheKey = String(hex) + ":" + String(a);
    if (hexAlphaCache.has(cacheKey)) return hexAlphaCache.get(cacheKey);
    const num = parseInt(String(hex).replace("#", ""), 16);
    const r = num >> 16, g = (num >> 8) & 0x00ff, b = num & 0x0000ff;
    const out = `rgba(${r},${g},${b},${a})`;
    hexAlphaCache.set(cacheKey, out);
    return out;
  }

  function updateAndDrawParticles(dt) {
    ctx.save();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life) { p.active = false; continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const t = p.age / p.life;
      ctx.globalAlpha = (1 - t) * 0.7;
      ctx.fillStyle = p.color || "rgba(255,255,255,0.3)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 + t * 0.8), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function updateAndDrawFloaters(dt) {
    ctx.save();
    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      if (!f.active) continue;
      f.age += dt;
      if (f.age >= f.life) { f.active = false; continue; }
      const t = f.age / f.life;
      const y = f.y - t * 46 * camera.zoom;
      ctx.globalAlpha = 1 - t;
      ctx.font = `bold ${(f.crit ? 20 : 15) * camera.zoom}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillStyle = f.color || "#ffe27a";
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 3;
      ctx.strokeText(f.text, f.x, y);
      ctx.fillText(f.text, f.x, y);
    }
    ctx.restore();
  }

  function spawnCollectFloater(worldX, worldY, amount, crit) {
    const s = worldToScreen(worldX, worldY);
    spawnFloater({ x: s.x, y: s.y, text: (crit ? "\u2605 " : "+") + G.Econ.formatMoney(amount), life: 0.9, crit, color: crit ? "#ff9d3d" : "#8dffb0" });
  }
  function spawnBonusIcon(worldX, worldY) {
    const s = worldToScreen(worldX, worldY);
    spawnFloater({ x: s.x, y: s.y - 30, text: "\u2726 Bonus!", life: 1.6, crit: true, color: "#ff5da2" });
  }

  function ensureBonusStarPath() {
    if (bonusStarPath) return bonusStarPath;
    const spikes = 5, innerRatio = 6 / 14;
    let rot = (Math.PI / 2) * 3;
    const step = Math.PI / spikes;
    const path = new Path2D();
    path.moveTo(0, -1);
    for (let i = 0; i < spikes; i++) {
      let x = Math.cos(rot), y = Math.sin(rot);
      path.lineTo(x, y); rot += step;
      x = Math.cos(rot) * innerRatio; y = Math.sin(rot) * innerRatio;
      path.lineTo(x, y); rot += step;
    }
    path.lineTo(0, -1);
    path.closePath();
    bonusStarPath = path;
    return bonusStarPath;
  }

  function drawBonusMarker(slot) {
    const p = slotWorldPos(slot.r, slot.c);

    const requirements = mechanic.visibility && Array.isArray(mechanic.visibility.requirements) ? mechanic.visibility.requirements : [];
    return requirements.length > 0 && G.Zone.requirementsMet(state, requirements, zoneDef.id);
  }

  function fishImageMarkup(speciesId) {
    return `<div class="fish-thumb fish--${escapeHtml(speciesId)}" aria-hidden="true">${fishDecorationMarkup()}</div>`;
  }

  function formatFishReward(amount) { return money(Number(amount) || 0); }

  function renderOceanFishEncyclopedia() {
    const mechanic = oceanFishMechanicDef();

    els.modalContent.innerHTML = `<button class="panel-close" id="modal-close">✕</button><h2>${escapeHtml(G.i18n.t("fish.catalog.title"))}</h2><p class="m-sub">${escapeHtml(G.i18n.t("fish.catalog.subtitle"))}</p><div class="fish-encyclopedia-grid">${species.map((fish) => `<div class="fish-entry"><div class="fish-entry-art">${fishImageMarkup(fish.id)}</div><div class="fish-entry-info"><div class="fish-entry-head"><b>${escapeHtml(G.i18n.t(fish.nameKey))}</b><span class="fish-rarity fish-rarity--${escapeHtml(fish.id)}">${escapeHtml(G.i18n.t(fish.rarityKey))}</span></div><div class="fish-entry-row"><span>${escapeHtml(G.i18n.t("fish.catalog.reward"))}</span><strong>${escapeHtml(formatFishReward(fish.reward))}</strong></div><div class="fish-entry-row"><span>${escapeHtml(G.i18n.t("fish.catalog.duration"))}</span><strong>${escapeHtml(String(fish.durationSeconds))}s</strong></div></div></div>`).join("")}</div><div class="fish-catalog-note">${escapeHtml(G.i18n.t("fish.catalog.manual"))} ${escapeHtml(G.i18n.t("fish.catalog.auto"))}</div>`;

  function refreshMechanicIndicators(uiOverride) {
    if (!els.mechanicIndicators || !state || !G.Zone) return;
    const ui = uiOverride || G.Zone.getMechanicUIState(state, state.currentZoneId, state.currentFloorId);
    const indicators = ui.zoneIndicators || [];
    els.mechanicIndicators.innerHTML = indicators.map((item) => {
      const tone = item.tone || "info";
      const value = formatMechanicIndicator(item);

  function refreshOceanFishButton() {
    const btn = els.oceanFishEncyclopedia;
    if (!btn) return;

    btn.hidden = !visible;
    if (visible) {
      btn.innerHTML = `📖 <span>${escapeHtml(G.i18n.t("fish.catalog.open"))}</span>`;
      if (!btn.dataset.wired) {
        btn.dataset.wired = "1";
        btn.addEventListener("click", () => { G.Audio.unlock(); G.Audio.sfxClick(); openPanel("oceanFishEncyclopedia"); });

  function refreshHUD(mechanicUi) {
    els.moneyVal.textContent = money(state.money);
    const mps = G.Zone.computeMps(state);
    els.mpsVal.textContent = mps !== 0 ? (mps > 0 ? "+" : "−") + E.formatMoney(Math.abs(mps)) + G.i18n.t("hud.perSec") : "";
    const hudDanger = !!(mechanicUi && mechanicUi.hudEffects && (mechanicUi.hudEffects.moneyTone === "danger" || mechanicUi.hudEffects.mpsTone === "danger"));
    els.moneyChip?.classList.toggle("danger", hudDanger);
    els.mpsVal?.classList.toggle("danger", !!(mechanicUi && mechanicUi.hudEffects && mechanicUi.hudEffects.mpsTone === "danger"));
    els.researchVal.textContent = E.formatMoney(state.research);
    const cap = E.powerCapacity(state), demand = E.powerDemand(state);
    els.powerVal.textContent = Math.round(demand) + "/" + Math.round(cap);
    els.powerWrap.style.color = demand > cap ? "var(--accent-warn)" : "";

    const interval = D.SKILL_POINT_INTERVAL_SECONDS;
    const online = Math.max(0, Number(state.skills.onlineSeconds) || 0);
    const remainder = online % interval;
    const pct = interval > 0 ? Math.min(100, remainder / interval * 100) : 0;
    els.skillVal.textContent = String(Math.max(0, Math.floor(state.skills.points || 0)));
    els.skillProgress.textContent = E.formatTime(Math.max(0, interval - remainder)) + " " + G.i18n.t("hud.skillNext");
    els.skillProgress.style.setProperty("--skill-progress", pct.toFixed(2) + "%");

    const zoneDef = D.zoneById(state.currentZoneId);
    const floorDef = D.floorById(state.currentZoneId, state.currentFloorId);
    if (zoneDef) els.zoneName.textContent = G.i18n.t(zoneDef.nameKey);
    if (floorDef) els.floorName.textContent = G.i18n.t(floorDef.nameKey);
    els.dotTech.classList.toggle("show", (state.skills.points || 0) > 0);
    refreshMechanicIndicators(mechanicUi);
    refreshOceanFishButton();
  }

  function refreshLocationBar() {
    els.zoneButtons.innerHTML = "";
    D.ZONES.forEach((zoneDef) => {
      const zone = F.getZone(state, zoneDef.id);
      const btn = document.createElement("button");
      btn.className = "lb-btn" + (zone.id === state.currentZoneId ? " active" : "") + (!zone.unlocked ? " locked" : "");
      if (zone.unlocked) {
        btn.textContent = G.i18n.t(zoneDef.nameKey);
        btn.addEventListener("click", () => enterZone(zoneDef.id));
      } else {
        const status = G.Zone.zoneUnlockStatus(state, zoneDef.id);
        const costLabel = status.cost > 0 ? G.i18n.t("zone.unlockFor", { amount: money(status.cost) }) : G.i18n.t("zone.noRequirements");
        btn.innerHTML = `🔒 ${escapeHtml(G.i18n.t(zoneDef.nameKey))}<span class="lock-cost">${escapeHtml(costLabel)}</span>`;
        btn.title = G.i18n.t("zone.preview");
        btn.addEventListener("click", () => { selectedZonePreviewId = zoneDef.id; openPanel("zones"); });
      }
      els.zoneButtons.appendChild(btn);
    });

    els.floorButtons.innerHTML = "";
    const curZoneDef = D.zoneById(state.currentZoneId), curZone = F.getZone(state, state.currentZoneId);
    if (!curZoneDef || !curZone) return;
    curZoneDef.floors.forEach((floorDef) => {
      const floor = curZone.floors.find((f) => f.id === floorDef.id);
      if (!floor) return;
      const btn = document.createElement("button");
      btn.className = "lb-btn" + (floor.id === state.currentFloorId ? " active" : "") + (!floor.unlocked ? " locked" : "");
      if (floor.unlocked) {
        btn.textContent = G.i18n.t(floorDef.nameKey);
        btn.addEventListener("click", () => { state.currentFloorId = floor.id; hideMachinePanel(); refreshAll(); onAfterAction(); });
      } else {
        const status = G.Zone.floorUnlockStatus(state, curZone.id, floor.id);
        const cost = Number.isFinite(status.cost) ? status.cost : 0;
        btn.innerHTML = `🔒 ${escapeHtml(G.i18n.t(floorDef.nameKey))}<span class="lock-cost">${escapeHtml(G.i18n.t("floor.unlockFor", { amount: money(cost) }))}</span>`;
        btn.title = status.missing && status.missing.length ? formatRequirementsTooltip(status.missing, curZone.id) : "";
        btn.addEventListener("click", () => {
          const events = [];
          const res = F.unlockFloor(state, curZone.id, floor.id, events);
          if (res.ok) { G.Main && typeof G.Main.processEvents === "function" && G.Main.processEvents(events); toast(G.i18n.t("notify.floorUnlocked", { floor: G.i18n.t(floorDef.nameKey) })); refreshAll(); onAfterAction(); }
          else {
            G.Audio.sfxError();
            if (res.reason === "requirements" && res.missing && res.missing.length) toast(formatRequirement(res.missing[0], curZone.id), "warn");
            else if (res.reason === "money") toast(G.i18n.t("notify.notEnoughMoney"), "warn");
            else toast(G.i18n.t("zone.contentLocked"), "warn");
          }
        });
      }
      els.floorButtons.appendChild(btn);
    });
  }

  function enterZone(zoneId) {
    const zone = F.getZone(state, zoneId);
    const def = D.zoneById(zoneId);
    if (!zone || !def || !zone.unlocked) return;
    state.currentZoneId = zoneId;
    const firstUnlocked = zone.floors.find((f) => f.unlocked);
    state.currentFloorId = firstUnlocked ? firstUnlocked.id : def.floors[0].id;
    selectedSlotRef = null;
    hideMachinePanel();
    selectedZonePreviewId = zoneId;
    if (G.Audio && typeof G.Audio.syncZone === "function") G.Audio.syncZone(state);
    G.Background.sync(state);
    refreshAll();
    onAfterAction();
  }

  // ---- Global machine catalogue -----------------------------------------
  function machineUnlockRequirements(def) {
    const unlock = def && def.unlock ? def.unlock : {};
    const reqs = Array.isArray(unlock.requirements) ? unlock.requirements.slice() : [];
    if (unlock.secretId) reqs.push({ type: "secretDiscovered", secretId: unlock.secretId, value: 1 });
    return reqs;
  }

  function catalogStatus(def) { return G.Zone.machineUnlockStatus(state, def.id, state.currentZoneId); }

  function machineCard(def) {
    const status = catalogStatus(def);
    const selected = state.selectedMachineId === def.id;
    const isZone = def.kind === "zone";
    const homeZone = isZone ? D.zoneById(def.zoneId) : null;
    const cost = E.machineCostById(state, def.id);
    let meta = "";
    let actionState = "";

    if (!status.ok) {
      if (status.reason === "zoneLocked") {
        meta = G.i18n.t("zone.machineZoneLocked", { zone: homeZone ? G.i18n.t(homeZone.nameKey) : def.zoneId });
        actionState = "locked";
      } else if (isZone && status.manual && !status.already && status.missing.length === 0) {
        meta = G.i18n.t("zone.unlockFor", { amount: money(status.cost) });
        actionState = state.money >= status.cost ? "ready" : "locked";
      } else {
        meta = status.missing && status.missing.length ? G.i18n.t("zone.machineLocked") : G.i18n.t("zone.machineLocked");
        actionState = "locked";
      }
    } else {
      meta = money(cost);
      if (isZone) meta += " · " + G.i18n.t("zone.availableFrom", { zone: homeZone ? G.i18n.t(homeZone.nameKey) : def.zoneId });
    }

    const reqs = machineUnlockRequirements(def);
    const title = reqs.length ? formatRequirementsTooltip(reqs, def.zoneId) : meta;
    const cardClass = `machine-catalog-card ${selected ? "selected" : ""} ${status.ok ? "unlocked" : "locked"} ${actionState}`;
    return `<button type="button" class="${cardClass}" data-machine-id="${escapeHtml(def.id)}" title="${escapeHtml(title)}">
      <span class="catalog-swatch" style="background:${escapeHtml(def.color || "#8edcff")}"></span>
      <span class="catalog-main"><b>${escapeHtml(G.i18n.t(def.nameKey))}</b><small>${isZone && homeZone ? escapeHtml(G.i18n.t(homeZone.nameKey)) : escapeHtml(G.i18n.t("zone.coreMachines"))}</small></span>
      <span class="catalog-meta">${status.ok ? "✓ " : "🔒 "}${escapeHtml(meta)}</span>
    </button>`;
  }

  function refreshMachineSelector() {
    const host = els.zoneMachineSelector;
    if (!host) return;
    const core = D.MACHINE_DEFS.filter((m) => m.kind === "tier");
    const groups = [{ label: G.i18n.t("zone.coreMachines"), defs: core }];
    D.ZONES.filter((z) => (z.machines || []).length).forEach((zone) => groups.push({ label: G.i18n.t(zone.nameKey), defs: (zone.machines || []).map((m) => D.machineById(m.id)).filter(Boolean) }));
    const totalMachines = groups.reduce((sum, group) => sum + group.defs.length, 0);
    const selectedDef = state.selectedMachineId ? D.machineById(state.selectedMachineId) : null;
    const selectedName = selectedDef ? G.i18n.t(selectedDef.nameKey) : G.i18n.t("zone.coreMachines");
    const selectedCost = selectedDef ? E.machineCostById(state, selectedDef.id) : null;
    const selectedCostText = selectedCost != null && Number.isFinite(selectedCost) ? money(selectedCost) : "";
    host.innerHTML = `<div class="machine-selector-head">
      <div class="machine-selector-title"><span class="machine-selector-icon">▦</span><span><b>${escapeHtml(G.i18n.t("zone.machines"))}</b><small>${totalMachines} · ${escapeHtml(selectedName)}${selectedCostText ? " · " + escapeHtml(selectedCostText) : ""}</small></span></div>
      <button type="button" class="machine-selector-toggle" aria-expanded="${machineSelectorCollapsed ? "false" : "true"}" aria-controls="machine-selector-body"><span>${machineSelectorCollapsed ? "＋" : "−"}</span><small>${machineSelectorCollapsed ? G.i18n.t("menu.open") : G.i18n.t("menu.close")}</small></button>
    </div><div id="machine-selector-body" class="machine-selector-body">${groups.map((group) => `<section class="machine-catalog-group"><h4>${escapeHtml(group.label)}</h4><div class="machine-catalog-track">${group.defs.map(machineCard).join("")}</div></section>`).join("")}</div>`;
    host.classList.remove("hidden");
    host.classList.toggle("is-collapsed", machineSelectorCollapsed);
    const toggle = host.querySelector(".machine-selector-toggle");
    toggle.addEventListener("click", (event) => {
      event.stopPropagation();
      machineSelectorCollapsed = !machineSelectorCollapsed;
      host.classList.toggle("is-collapsed", machineSelectorCollapsed);
      toggle.setAttribute("aria-expanded", String(!machineSelectorCollapsed));
      toggle.querySelector("span").textContent = machineSelectorCollapsed ? "＋" : "−";
      toggle.querySelector("small").textContent = machineSelectorCollapsed ? G.i18n.t("menu.open") : G.i18n.t("menu.close");
      try { localStorage.setItem("factory.machineSelectorCollapsed", machineSelectorCollapsed ? "1" : "0"); } catch (_) {}
      G.Audio.unlock(); G.Audio.sfxClick();
    });
    host.querySelectorAll("[data-machine-id]").forEach((btn) => btn.addEventListener("click", () => selectMachineFromCatalog(btn.dataset.machineId)));
  }

  function selectMachineFromCatalog(machineId) {
    const def = D.machineById(machineId);
    if (!def) return;
    const status = catalogStatus(def);
    if (status.reason === "zoneLocked") {
      selectedZonePreviewId = def.zoneId;
      openPanel("zones");
      G.Audio.sfxError();
      toast(G.i18n.t("zone.machineZoneLocked", { zone: G.i18n.t(D.zoneById(def.zoneId).nameKey) }), "warn");
      return;
    }
    if (def.kind === "zone" && status.manual && !status.already) {
      if (status.missing.length) { G.Audio.sfxError(); toast(formatRequirement(status.missing[0], def.zoneId), "warn"); return; }
      const machineEvents = [];
      const res = G.Zone.unlockMachine(state, def.id, machineEvents);
      if (!res.ok) {
        G.Audio.sfxError();
        if (res.reason === "money") toast(G.i18n.t("notify.notEnoughMoney"), "warn");
        else if (res.reason === "secret") toast(G.i18n.t("zone.machineLocked"), "warn");
        else toast(G.i18n.t("zone.machineLocked"), "warn");
        return;
      }
      if (G.Main && typeof G.Main.processEvents === "function") G.Main.processEvents(machineEvents);
    } else if (!status.ok) {
      G.Audio.sfxError();
      toast(status.missing && status.missing.length ? formatRequirement(status.missing[0], def.zoneId) : G.i18n.t("zone.machineLocked"), "warn");
      return;
    }
    state.selectedMachineId = def.id;
    if (def.tierId) state.selectedTierId = def.tierId;
    G.Audio.sfxClick();
    refreshMachineSelector();
    onAfterAction(true);
  }

  function refreshTierSelector() { refreshMachineSelector(); }
  function refreshZoneMachineSelector() { refreshMachineSelector(); }

  function formatRequirement(req, zoneId) {
    if (!req) return G.i18n.t("zone.noRequirements");
    const value = req.value;
    const amount = req.type === "mps" ? E.formatMoney(value) : (req.type === "money" || req.type === "maxMoney" ? money(value) : value);
    const key = req.labelKey || ("zone.requirement." + req.type);
    if (req.type === "zoneStat" || req.type === "mechanicState" || req.type === "zoneVariable") return G.i18n.t(key, { amount, stat: req.stat || req.path || "" });
    if (req.type === "zoneUpgradeLevel") return G.i18n.t(key, { amount, upgrade: req.upgradeId || "" });
    if (req.type === "zoneUnlocked") {
      const z = D.zoneById(req.zoneId || zoneId); return G.i18n.t(key, { zone: z ? G.i18n.t(z.nameKey) : (req.zoneId || zoneId) });
    }
    if (req.type === "floorUnlocked") {
      const f = D.floorById(zoneId, req.floorId); return G.i18n.t(key, { floor: f ? G.i18n.t(f.nameKey) : (req.floorId || "") });
    }
    if (req.type === "secretDiscovered") {
      const s = (D.zoneById(zoneId)?.secrets || []).find((x) => x.id === req.secretId); return G.i18n.t(key, { secret: s ? G.i18n.t(s.nameKey || s.hintKey) : req.secretId });
    }
    if (req.type === "machineOwned" || req.type === "machineUnlocked") {
      const m = D.machineById(req.machineId); return G.i18n.t(key, { machine: m ? G.i18n.t(m.nameKey) : req.machineId, amount });
    }
    return G.i18n.t(key, { amount });
  }

  function formatRequirementsTooltip(requirements, zoneId) {
    if (!Array.isArray(requirements) || !requirements.length) return G.i18n.t("zone.noRequirements");
    return requirements.map((req) => (G.Zone.requirementMet(state, req, zoneId) ? "✅ " : "❌ ") + formatRequirement(req, zoneId)).join("\n");
  }

  // ---- Machine panel ------------------------------------------------------
  function hideMachinePanel() {
    els.machinePanel.classList.add("hidden");
    delete els.machinePanel.dataset.machineId;
    selectedSlotRef = null;
    if (G.Render) G.Render.setSelected(null);
  }
  function selectSlot(slot) {
    selectedSlotRef = { r: slot.r, c: slot.c };
    if (G.Render) G.Render.setSelected(selectedSlotRef);
    renderMachinePanel();
  }
  function machineArt(machine, tier) {
    const o = Number(machine && machine.order) || Number(tier.order) || 0;
    const accent = (machine && machine.color) || tier.color || "#9aa5ad";
    const glow = (machine && machine.glow) || tier.glow || "#c7cfd4";
    const shape = machine && machine.visual && machine.visual.shape;
    const extra = shape === "abyssal" ? `<path d="M44 30h32M48 24h24M51 18h18v28H51z" fill="none" stroke="${glow}" stroke-width="2"/><circle cx="60" cy="32" r="10" fill="none" stroke="${glow}" stroke-width="1.5"/>` : shape === "leviathan" ? `<path d="M42 34c6-12 12-12 18 0s12 12 18 0M42 26c6-10 12-10 18 0s12 10 18 0" fill="none" stroke="${glow}" stroke-width="2"/><circle cx="60" cy="30" r="7" fill="none" stroke="${glow}"/>` : o >= 9 ? `<circle cx="60" cy="22" r="9" fill="none" stroke="${glow}" stroke-width="2"/><path d="M60 13v18M51 22h18" stroke="${glow}" stroke-width="1.5"/>` : o >= 7 ? `<circle cx="60" cy="22" r="7" fill="${glow}" opacity=".9"/><circle cx="60" cy="22" r="13" fill="none" stroke="${glow}" stroke-width="1.5" opacity=".8"/>` : o >= 5 ? `<path d="M51 18h18l-3 8H54z" fill="${glow}" opacity=".9"/>` : o >= 4 ? `<path d="M52 25l8-12 8 12" fill="none" stroke="${glow}" stroke-width="2"/>` : o >= 3 ? `<rect x="54" y="15" width="12" height="12" rx="2" fill="${glow}" opacity=".85"/>` : `<circle cx="60" cy="22" r="5" fill="${glow}" opacity=".85"/>`;
    return `<svg viewBox="0 0 120 64" aria-hidden="true"><defs><filter id="machineGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="14" y="20" width="92" height="30" rx="7" fill="#151922" stroke="${accent}" stroke-width="2"/><rect x="23" y="27" width="24" height="14" rx="3" fill="${accent}" opacity=".24" stroke="${glow}"/><rect x="73" y="27" width="24" height="14" rx="3" fill="${accent}" opacity=".18" stroke="${glow}"/><path d="M33 20v-7h54v7" fill="none" stroke="${accent}" stroke-width="2"/><path d="M28 50v6M92 50v6" stroke="${accent}" stroke-width="3"/><g filter="url(#machineGlow)">${extra}</g></svg>`;
  }

  function renderMachinePanel() {
    if (!selectedSlotRef) { els.machinePanel.classList.add("hidden"); return; }
    const floor = F.currentFloor(state), slot = floor && floor.grid.find((s) => s.r === selectedSlotRef.r && s.c === selectedSlotRef.c);
    if (!slot || !slot.machine) { hideMachinePanel(); return; }
    const m = slot.machine;
    const machine = D.machineById(m.typeId) || D.tierById(m.tierId);
    if (!machine) { hideMachinePanel(); return; }
    const tier = D.tierById(m.tierId) || { id: "zone", order: Number(machine.order) || 7, color: machine.color || "#8edcff", glow: machine.glow || "#ffffff" };
    els.machinePanel.classList.remove("hidden");
    els.machinePanel.dataset.machineId = machine.id;
    const rows = ["speed", "output", "ink"].map((uid) => {
      const u = D.UPGRADES[uid], lvl = m.levels[uid], maxed = lvl >= u.maxLevel, cost = maxed ? 0 : E.upgradeCost(uid, lvl, state), afford = !maxed && state.money >= cost;
      return `<div class="upg-row"><div><div class="upg-name">${escapeHtml(G.i18n.t(u.nameKey))}</div><div class="upg-level">${maxed ? G.i18n.t("action.max") : G.i18n.t("common.levelShort") + " " + lvl + " → " + (lvl + 1)}</div></div><button class="btn" data-upgrade="${uid}" ${maxed || !afford ? "disabled" : ""}>${maxed ? G.i18n.t("action.max") : money(cost)}</button></div>`;
    }).join("");
    const zoneOrigin = machine.kind === "zone" && D.zoneById(machine.zoneId) ? G.i18n.t(D.zoneById(machine.zoneId).nameKey) : G.i18n.t("zone.coreMachines");
    const baseCooldown = E.machineCooldown(m, state);
    const liveCooldown = G.Zone.modifyCooldown(state, state.currentZoneId, state.currentFloorId, m, baseCooldown);
    els.machinePanel.innerHTML = `<button class="panel-close" id="mp-close">✕</button><div class="machine-art" style="--machine-color:${escapeHtml(machine.color || tier.color)}; --machine-glow:${escapeHtml(machine.glow || tier.glow)};">${machineArt(machine, tier)}</div><h3 style="color:${escapeHtml(machine.color || tier.color)}">${escapeHtml(G.i18n.t(machine.nameKey))}</h3><div class="m-desc">${escapeHtml(G.i18n.t(machine.descKey))}</div><div class="machine-origin">${escapeHtml(zoneOrigin)} · <span data-machine-rate>${E.formatMoney(1 / liveCooldown)} ${G.i18n.t("common.cyclesPerSec")}</span></div>${rows}`;
    $("mp-close").addEventListener("click", hideMachinePanel);
    els.machinePanel.querySelectorAll("[data-upgrade]").forEach((btn) => btn.addEventListener("click", () => {
      const uid = btn.getAttribute("data-upgrade"), res = F.upgradeMachine(state, state.currentZoneId, state.currentFloorId, slot.r, slot.c, uid);
      if (res.ok) { G.Audio.sfxUpgrade(); toast(G.i18n.t("notify.upgradeBought", { upgrade: G.i18n.t(D.UPGRADES[uid].nameKey), level: res.newLevel })); renderMachinePanel(); refreshHUD(); refreshMachineSelector(); onAfterAction(); }
      else if (res.reason === "money") { G.Audio.sfxError(); toast(G.i18n.t("notify.notEnoughMoney"), "warn"); }
    }));

  function refreshMachinePanelControls() {
    if (!selectedSlotRef || els.machinePanel.classList.contains("hidden")) return;
    const floor = F.currentFloor(state), slot = floor && floor.grid.find((s) => s.r === selectedSlotRef.r && s.c === selectedSlotRef.c);
    if (!slot || !slot.machine) return;
    els.machinePanel.querySelectorAll("[data-upgrade]").forEach((btn) => {
      const uid = btn.getAttribute("data-upgrade"), u = D.UPGRADES[uid], lvl = slot.machine.levels[uid], maxed = lvl >= u.maxLevel, cost = maxed ? 0 : E.upgradeCost(uid, lvl, state);

    });

  // ---- Panels -------------------------------------------------------------
  function syncModalUiState() {
    const open = !!activePanel;
    const app = els.modalOverlay && els.modalOverlay.parentElement;
    if (app) {
      app.classList.toggle("ui-modal-open", open);
      app.classList.toggle("ui-rooms-open", activePanel === "rooms");
      app.classList.toggle("ui-zones-open", activePanel === "zones");
    }
    if (els.modalOverlay) els.modalOverlay.setAttribute("aria-hidden", open ? "false" : "true");
  }

  function openPanel(name) {
    if (name === "zones" && !selectedZonePreviewId) selectedZonePreviewId = state.currentZoneId;
    activePanel = name;
    syncModalUiState();
    els.modalOverlay.classList.toggle("modal-overlay--light", name === "hardResetConfirm");
    els.modalOverlay.classList.remove("hidden");
    renderPanel();
  }
  function closePanel() {
    activePanel = null;
    hardResetReturnPanel = null;
    syncModalUiState();
    els.modalOverlay.classList.remove("modal-overlay--light");
    els.modalOverlay.classList.add("hidden");
  }
  function wireModalClose() { const btn = $("modal-close"); if (btn) btn.addEventListener("click", closePanel); }

  function openHardResetConfirm(resetTutorial = false) {
    hardResetAlsoResetTutorial = !!resetTutorial;
    hardResetReturnPanel = activePanel || "settings";
    activePanel = "hardResetConfirm";
    syncModalUiState();
    els.modalOverlay.classList.add("modal-overlay--light");
    els.modalOverlay.classList.remove("hidden");
    renderPanel();
  }

  function renderHardResetConfirmPanel() {
    const confirmBody = hardResetAlsoResetTutorial
      ? G.i18n.t("settings.hardResetConfirmBody") + " " + G.i18n.t("tutorial.settings.resetFirstTimeConfirmExtra")
      : G.i18n.t("settings.hardResetConfirmBody");
    const confirmAction = hardResetAlsoResetTutorial
      ? G.i18n.t("tutorial.settings.resetFirstTimeConfirmAction")
      : G.i18n.t("settings.hardResetConfirmAction");
    els.modalContent.innerHTML = `<button class="panel-close" id="modal-close">✕</button><div class="hard-reset-confirm"><div class="hard-reset-icon">⚠</div><h2>${escapeHtml(G.i18n.t("settings.hardResetConfirmTitle"))}</h2><p class="m-sub">${escapeHtml(confirmBody)}</p><div class="hard-reset-actions"><button type="button" class="btn ghost" id="hard-reset-cancel">${escapeHtml(G.i18n.t("settings.hardResetConfirmCancel"))}</button><button type="button" class="btn warn" id="hard-reset-confirm-action">${escapeHtml(confirmAction)}</button></div></div>`;
    const cancel = $("hard-reset-cancel");
    if (cancel) cancel.addEventListener("click", () => {
      const previous = hardResetReturnPanel || "settings";
      hardResetReturnPanel = null;
      hardResetAlsoResetTutorial = false;
      activePanel = null;
      els.modalOverlay.classList.remove("modal-overlay--light");
      els.modalOverlay.classList.add("hidden");
      if (previous && previous !== "hardResetConfirm") openPanel(previous);
    });
    const confirmButton = $("hard-reset-confirm-action");
    if (confirmButton) confirmButton.addEventListener("click", () => {
      const resetTutorial = hardResetAlsoResetTutorial;
      hardResetReturnPanel = null;
      hardResetAlsoResetTutorial = false;
      if (G.Main && typeof G.Main.hardReset === "function") G.Main.hardReset();
      else { closePanel(); }
      // Reset gameplay only when the first button was chosen. The replay-tutorial
      // action also resets Layer 1 and explicitly re-enables Contextual Guidance,
      // whose preference is stored separately from the gameplay save.
      if (resetTutorial && G.Tutorial) {
        if (typeof G.Tutorial.resetFirstTime === "function") G.Tutorial.resetFirstTime();
        if (typeof G.Tutorial.setGuidanceEnabled === "function") G.Tutorial.setGuidanceEnabled(true);
      }
    });
    wireModalClose();
  }

  function renderPanel() {
    if (!activePanel) return;
    const scrollTop = els.modalContent.scrollTop;
    if (activePanel === "rooms") renderRoomsPanel();
    else if (activePanel === "zones") renderZonesPanel();
    else if (activePanel === "tech") renderTechPanel();
    else if (activePanel === "settings") renderSettingsPanel();
    else if (activePanel === "oceanFishEncyclopedia") renderOceanFishEncyclopedia();
    else if (activePanel === "hardResetConfirm") renderHardResetConfirmPanel();
    els.modalContent.scrollTop = scrollTop;
  }

  function refreshOpenPanel() {
    if (!activePanel) return;
    if (activePanel === "rooms") {
      const floor = F.currentFloor(state); if (!floor) return;
      els.modalContent.querySelectorAll("[data-room]").forEach((btn) => { const id=btn.dataset.room, def=D.ROOMS[id], lvl=state.rooms[id].level, cost=lvl>=def.maxLevel?0:E.roomCost(id,lvl); btn.disabled=lvl>=def.maxLevel||state.money<cost; });
      els.modalContent.querySelectorAll("[data-floorsys]").forEach((btn) => { const id=btn.dataset.floorsys, def=D.FLOOR_SYSTEMS[id], lvl=floor.systems[id], cost=lvl>=def.maxLevel?0:E.floorSystemCost(id,lvl,state); btn.disabled=lvl>=def.maxLevel||state.money<cost; });
      els.modalContent.querySelectorAll("[data-zone-content]").forEach((btn) => {
        const status = G.Zone.zoneContentStatus(state, state.currentZoneId, btn.dataset.zoneContent, btn.dataset.zoneContentKind);
        btn.disabled = !status.ok;
      });
    } else if (activePanel === "tech") {
      const line=$("tech-resource-line"); if(line) line.textContent=G.i18n.t("tech.points",{points:state.skills.points,research:E.formatMoney(state.research)});
    } else if (activePanel === "zones") {
      const previewId = (selectedZonePreviewId && D.zoneById(selectedZonePreviewId)) ? selectedZonePreviewId : state.currentZoneId;
      const zone = F.getZone(state, previewId);
      const unlockBtn = $("btn-atlas-unlock");
      const enterBtn = $("btn-atlas-enter");
      const actuallyUnlocked = !!zone?.unlocked;
      const lockedView = !!unlockBtn && !enterBtn;
      if ((actuallyUnlocked && lockedView) || (!actuallyUnlocked && !lockedView)) {
        renderZonesPanel();
      } else if (!actuallyUnlocked && unlockBtn) {
        const status = G.Zone.zoneUnlockStatus(state, previewId);
        unlockBtn.disabled = !status.ok;
        unlockBtn.textContent = G.i18n.t("zone.unlockFor", { amount: money(status.cost) });
      }
    }
    // Settings is intentionally not rebuilt every frame: this avoids destroying
    // the language selectors and import/export interactions.
  }

  function renderZonesPanel() {

    const machines = (def.machines || []).map((m) => {

      }
      return `<div class="atlas-mechanic"><div class="atlas-mechanic-title"><b>${escapeHtml(G.i18n.t(m.nameKey))}</b></div><div class="atlas-mechanic-desc">${escapeHtml(G.i18n.t(m.descriptionKey))}</div></div>`;

      return `<div class="atlas-secret is-hidden">❔ <span><b class="atlas-secret-mask">${escapeHtml(G.i18n.t("zone.secretUnknown"))}</b><small>${escapeHtml(s.hintKey ? G.i18n.t(s.hintKey) : G.i18n.t("zone.secretUnknown"))}</small></span></div>`;
    }).join("");

    const previewName = G.i18n.t(def.nameKey);

    els.modalContent.innerHTML = `<button class="panel-close" id="modal-close">✕</button><h2>${escapeHtml(G.i18n.t("zone.atlas"))}</h2><div class="zone-atlas-layout"><aside class="zone-atlas-list">${D.ZONES.map((z) => { const zs=F.getZone(state,z.id); return `<button type="button" class="zone-atlas-item ${z.id===previewId?"active":""}" data-preview-zone="${escapeHtml(z.id)}"><span>${zs?.unlocked?"":"🔒 "}${escapeHtml(G.i18n.t(z.nameKey))}</span><small>#${z.order+1}</small></button>`; }).join("")}</aside><section class="zone-atlas-detail"><div class="zone-preview-surface" id="zone-preview-surface"><div class="zone-preview-overlay"><strong>${escapeHtml(previewName)}</strong><span>${escapeHtml(isUnlocked?G.i18n.t("zone.unlocked"):G.i18n.t("zone.locked"))}</span></div></div><p class="m-sub">${escapeHtml(G.i18n.t(def.descriptionKey))}</p><div class="atlas-meta">${floors}</div>${!isUnlocked?`<h4>${escapeHtml(G.i18n.t("zone.unlockRequirements"))}</h4><div>${requirementRows||`<div class="atlas-req ok">✓ ${escapeHtml(G.i18n.t("zone.noRequirements"))}</div>`}</div><div class="zone-cost">${escapeHtml(G.i18n.t("zone.unlockCost"))}: ${escapeHtml(money(status.cost))}</div><button class="btn brass" id="btn-atlas-unlock" data-zone-unlock="${escapeHtml(previewId)}" ${status.ok?"":"disabled"}>${escapeHtml(G.i18n.t("zone.unlockFor",{amount:money(status.cost)}))}</button>`:`<div class="atlas-actions"><button class="btn brass" id="btn-atlas-enter">${escapeHtml(G.i18n.t("zone.enter"))}</button></div>`}<div class="atlas-section"><h4>${escapeHtml(G.i18n.t("zone.mechanics"))} <span class="atlas-count">${mechanics.length}</span></h4>${hiddenMechanicCount ? `<div class="atlas-meta-line">${escapeHtml(G.i18n.t("zone.hiddenMechanicCount", { count: hiddenMechanicCount }))}</div>` : ""}${mechanicCards||`<div class="m-sub">${escapeHtml(G.i18n.t("zone.noMechanics"))}</div>`}</div><div class="atlas-section"><h4>${escapeHtml(G.i18n.t("zone.machines"))}</h4>${machines||`<div class="m-sub">${escapeHtml(G.i18n.t("zone.none"))}</div>`}</div><div class="atlas-section"><h4>${escapeHtml(G.i18n.t("zone.secrets"))} <span class="atlas-count">${discoveredSecretCount}/${secretsData.length}</span></h4>${secrets||`<div class="m-sub">${escapeHtml(G.i18n.t("zone.noSecrets"))}</div>`}</div></section></div>`;
    wireModalClose();

    if(surface) G.Background.previewStyle(previewId,surface);
    els.modalContent.querySelectorAll("[data-preview-zone]").forEach((btn)=>btn.addEventListener("click",()=>{selectedZonePreviewId=btn.dataset.previewZone;renderZonesPanel();}));
    const unlockBtn=$("btn-atlas-unlock");
    if(unlockBtn) unlockBtn.addEventListener("click",()=>{const events=[]; const res=F.unlockZone(state,previewId,events);if(res.ok){G.Main && typeof G.Main.processEvents === "function" && G.Main.processEvents(events); toast(G.i18n.t("notify.zoneUnlocked",{zone:previewName}));renderZonesPanel();refreshAll();onAfterAction();}else{G.Audio.sfxError();if(res.reason==="money")toast(G.i18n.t("notify.notEnoughMoney"),"warn");else if(res.reason==="requirements")toast(formatRequirement(res.missing[0],previewId),"warn");}});
    const enterBtn=$("btn-atlas-enter"); if(enterBtn) enterBtn.addEventListener("click",()=>{enterZone(previewId);closePanel();});
  }

  function zoneContentCard(def, status) {
    if (!status.visible) {
      return `<div class="room-card zone-content-card is-hidden"><div class="r-icon">❔</div><div class="r-body"><div class="r-title">${escapeHtml(G.i18n.t("zone.contentHidden"))}</div><div class="r-desc">${escapeHtml(G.i18n.t("zone.contentLocked"))}</div></div><button class="btn" disabled>${escapeHtml(G.i18n.t("action.locked"))}</button></div>`;
    }
    const isPurchase = status.kind === "purchase";
    const maxed = status.level >= status.maxLevel;
    const levelText = isPurchase
      ? (maxed ? G.i18n.t("zone.contentOwned") : G.i18n.t("zone.contentLocked"))
      : G.i18n.t("zone.contentLevel", { level: status.level, max: status.maxLevel });
    const description = def.descriptionKey ? G.i18n.t(def.descriptionKey) : "";
    const missingText = status.missing && status.missing.length ? G.i18n.t("zone.contentLocked") + ": " + formatRequirement(status.missing[0], status.zoneId) : "";
    const powerText = Number.isFinite(Number(def.powerDemand)) && Number(def.powerDemand) > 0 ? "⚡" + Math.round(Number(def.powerDemand)) : "";
    const meta = [levelText, missingText, powerText].filter(Boolean).join(" · ");
    const buttonLabel = maxed ? G.i18n.t(isPurchase ? "zone.contentOwned" : "action.max") : money(status.cost);
    const title = status.missing && status.missing.length ? formatRequirementsTooltip(status.missing, status.zoneId) : (description || G.i18n.t("zone.localSystems"));
    return `<div class="room-card zone-content-card ${maxed ? "is-maxed" : ""}" title="${escapeHtml(title)}"><div class="r-icon">${escapeHtml(def.icon || (isPurchase ? "🧰" : "⚙️"))}</div><div class="r-body"><div class="r-title">${escapeHtml(G.i18n.t(def.nameKey))} <span>${escapeHtml(meta)}</span></div>${description ? `<div class="r-desc">${escapeHtml(description)}</div>` : ""}</div><button class="btn" data-zone-content="${escapeHtml(def.id)}" data-zone-content-kind="${escapeHtml(status.kind)}" ${maxed || !status.ok ? "disabled" : ""}>${escapeHtml(buttonLabel)}</button></div>`;
  }

  function zoneLocalSystemsBlock() {
    const zoneDef = D.zoneById(state.currentZoneId);
    const zone = F.getZone(state, state.currentZoneId);
    if (!zoneDef || !zone) return "";
    const defs = [
      ...(zoneDef.upgrades || []).map((def) => ({ def, kind: "upgrade" })),
      ...(zoneDef.purchases || []).map((def) => ({ def, kind: "purchase" })),
    ];
    if (!defs.length) return "";
    const cards = defs.map(({ def, kind }) => zoneContentCard(def, G.Zone.zoneContentStatus(state, state.currentZoneId, def.id, kind))).join("");
    return `<div class="m-sub">${escapeHtml(G.i18n.t("zone.localSystems"))} · ${escapeHtml(G.i18n.t(zoneDef.nameKey))}</div>${cards}`;
  }

  function wireZoneContentButtons() {
    els.modalContent.querySelectorAll("[data-zone-content]").forEach((btn) => btn.addEventListener("click", () => {
      const id = btn.dataset.zoneContent;
      const kind = btn.dataset.zoneContentKind;
      const def = G.Zone.getZoneContentDef(state.currentZoneId, id, kind);
      const res = G.Zone.buyZoneContent(state, state.currentZoneId, id, kind);
      if (res.ok) {
        G.Audio.sfxUpgrade();
        const level = res.newLevel;
        const label = def ? G.i18n.t(def.nameKey) : id;
        toast(G.i18n.t(res.kind === "purchase" ? "notify.zonePurchaseBought" : "notify.zoneUpgradeBought", { item: label, level }));
        renderRoomsPanel();
        refreshHUD();
        onAfterAction();
      } else {
        G.Audio.sfxError();
        if (res.reason === "money") toast(G.i18n.t("notify.notEnoughMoney"), "warn");
        else if (res.reason === "requirements") toast(res.missing && res.missing.length ? formatRequirement(res.missing[0], state.currentZoneId) : G.i18n.t("zone.contentLocked"), "warn");
        else if (res.reason === "hidden") toast(G.i18n.t("zone.contentLocked"), "warn");
        else toast(G.i18n.t("zone.contentLocked"), "warn");
      }
    }));
  }

  const ROOM_ICONS = { rnd:"🔬", vault:"🏦", power:"⚡" };
  function renderRoomsPanel() {
    const cards=["rnd","vault","power"].map((rid)=>{const def=D.ROOMS[rid],lvl=state.rooms[rid].level,maxed=lvl>=def.maxLevel,cost=maxed?0:E.roomCost(rid,lvl),afford=!maxed&&state.money>=cost;let stat="";if(rid==="rnd")stat=`${E.formatMoney(E.rndRatePerSec(state))} 🔬${G.i18n.t("common.perSecShort")}`;if(rid==="vault")stat=`${G.i18n.t("room.level",{level:lvl})} · +${(E.vaultInterestPerHour(state)*100).toFixed(2)}%${G.i18n.t("common.perHour")}`;if(rid==="power")stat=`${Math.round(E.powerDemand(state))}/${Math.round(E.powerCapacity(state))} ${G.i18n.t("common.used")}`;return `<div class="room-card"><div class="r-icon">${ROOM_ICONS[rid]}</div><div class="r-body"><div class="r-title">${escapeHtml(G.i18n.t("room."+rid+".name"))} <span>${escapeHtml(G.i18n.t("room.level",{level:lvl}))}</span></div><div class="r-desc">${escapeHtml(G.i18n.t("room."+rid+".desc"))}</div><div class="r-desc">${escapeHtml(stat)}</div><div class="bar-track"><div class="bar-fill" style="width:${lvl/def.maxLevel*100}%"></div></div></div><button class="btn brass" data-room="${rid}" ${maxed||!afford?"disabled":""}>${maxed?G.i18n.t("action.max"):money(cost)}</button></div>`;}).join("");
    els.modalContent.innerHTML=`<button class="panel-close" id="modal-close">✕</button><h2>${escapeHtml(G.i18n.t("menu.rooms"))}</h2>${zoneLocalSystemsBlock()}<div class="m-sub" style="margin-top:14px;">${escapeHtml(G.i18n.t("zone.globalSystems"))}</div>${floorSystemsBlock()}<div class="m-sub" style="margin-top:14px;">${escapeHtml(G.i18n.t("menu.rooms"))}</div>${cards}`;
