    if (!isPlainObject(zoneState.purchases)) zoneState.purchases = {};
    if (!Array.isArray(zoneState.secrets)) zoneState.secrets = [];
    if (!Array.isArray(zoneState.mechanicDiscoveries)) zoneState.mechanicDiscoveries = [];
    if (!Array.isArray(zoneState.unlockedMachineIds)) zoneState.unlockedMachineIds = [];
    if (!isPlainObject(zoneState.stats)) zoneState.stats = {};

    // Content variables are the data-driven contract between Zone JSON and
    // Zone mechanic JS. Missing declared variables are restored from content.
    const declaredVariables = isPlainObject(zoneDef.variables) ? zoneDef.variables : {};
    Object.keys(declaredVariables).forEach((key) => {
      if (!Object.prototype.hasOwnProperty.call(zoneState.variables, key)) zoneState.variables[key] = cloneJson(declaredVariables[key]);
    });

    (zoneDef.mechanics || []).forEach((def) => {
      if (!def || typeof def.id !== "string") return;
      if (!Object.prototype.hasOwnProperty.call(zoneState.mechanicState, def.id)) {
        zoneState.mechanicState[def.id] = isPlainObject(def.initialState) || Array.isArray(def.initialState) ? cloneJson(def.initialState) : {};
      }
    });

    const validSecrets = new Set((zoneDef.secrets || []).map((s) => s && s.id).filter(Boolean));
    zoneState.secrets = [...new Set(zoneState.secrets.filter((id) => validSecrets.has(id)))];
    const validHiddenMechanics = new Set((zoneDef.mechanics || []).filter((m) => m && m.visibility && m.visibility.hidden === true).map((m) => m.id));
    zoneState.mechanicDiscoveries = [...new Set(zoneState.mechanicDiscoveries.filter((id) => validHiddenMechanics.has(id)))];

    const validMachines = new Set((zoneDef.machines || []).map((m) => m && m.id).filter(Boolean));
    zoneState.unlockedMachineIds = [...new Set(zoneState.unlockedMachineIds.filter((id) => validMachines.has(id)))];

    const upgradeDefs = new Map((zoneDef.upgrades || []).map((item) => [item.id, item]));
    Object.keys(zoneState.upgrades).forEach((id) => {
      const def = upgradeDefs.get(id);
      const value = zoneState.upgrades[id];
      if (!def || !Number.isFinite(Number(value))) { delete zoneState.upgrades[id]; return; }
      const maxLevel = Math.max(1, Math.floor(Number(def.maxLevel) || 1));
      zoneState.upgrades[id] = Math.max(0, Math.min(maxLevel, Math.floor(Number(value))));
    });

    const purchaseIds = new Set((zoneDef.purchases || []).map((item) => item && item.id).filter(Boolean));
    Object.keys(zoneState.purchases).forEach((id) => {
      if (!purchaseIds.has(id) || zoneState.purchases[id] !== true) delete zoneState.purchases[id];
    });

    // Persisted purchase state is authoritative. Re-apply idempotent `set`
    // effects on load so a save created before/around a purchase cannot leave
    // a purchased machine disabled because its derived boolean was missing.
    (zoneDef.purchases || []).forEach((purchase) => {
      if (!purchase || zoneState.purchases[purchase.id] !== true || !Array.isArray(purchase.effects)) return;
      purchase.effects.forEach((effect) => {
        if (effect && effect.operation === "set" && typeof effect.target === "string") {
          const value = cloneJson(effect.value);
          if (normalizePath(effect.target)) writePath(zoneState.variables, effect.target, value);
        }
      });
    });
  }

  function buildUiStateSnapshot(state) {
    return deepFreeze(cloneJson(state || {}));
  }

  function buildUiZoneDef(zoneDef) {
    return deepFreeze(cloneJson(zoneDef || {}));
  }

  function buildUiZoneStateSnapshot(state, zoneId) {
    const snapshot = cloneJson(getZoneState(state, zoneId) || {});
    return deepFreeze(snapshot);
  }

  function buildUiGameView() {
    const data = D || {};
    const cloneDef = (fn, arg) => {
      try { return deepFreeze(cloneJson(typeof fn === "function" ? fn(arg) : null)); } catch (_e) { return null; }
    };
    return Object.freeze({
      DATA: Object.freeze({
        machineById: (id) => cloneDef(data.machineById, id),
        tierById: (id) => cloneDef(data.tierById, id),
        zoneById: (id) => cloneDef(data.zoneById, id),
        floorById: (zoneId, floorId) => {
          try { return deepFreeze(cloneJson(typeof data.floorById === "function" ? data.floorById(zoneId, floorId) : null)); } catch (_e) { return null; }
        },
      }),
    });
  }

  function buildMechanicGameView(state) {
    const data = D || {};
    const machineCache = new Map();
    const tierCache = new Map();
    const zoneCache = new Map();
    const floorCache = new Map();
    const cachedClone = (cache, key, fn, args) => {
      const cacheKey = String(key);
      if (cache.has(cacheKey)) return cache.get(cacheKey);
      try {
        const value = deepFreeze(cloneJson(typeof fn === "function" ? fn(...args) : null));
        cache.set(cacheKey, value);
        return value;
      } catch (_e) { return null; }
    };
    return Object.freeze({
      DATA: Object.freeze({
        machineById: (id) => cachedClone(machineCache, id, data.machineById, [id]),
        tierById: (id) => cachedClone(tierCache, id, data.tierById, [id]),
        zoneById: (id) => cachedClone(zoneCache, id, data.zoneById, [id]),
        floorById: (zoneId, floorId) => cachedClone(floorCache, String(zoneId) + "|" + String(floorId), data.floorById, [zoneId, floorId]),
      }),
      Econ: Object.freeze({
        machineCooldown: (machine) => G.Econ && typeof G.Econ.machineCooldown === "function" ? G.Econ.machineCooldown(machine, state) : null,
        machineBaseYield: (machine, floorMult) => G.Econ && typeof G.Econ.machineBaseYield === "function" ? G.Econ.machineBaseYield(machine, floorMult, state) : null,
        machineCritChance: (machine) => G.Econ && typeof G.Econ.machineCritChance === "function" ? G.Econ.machineCritChance(machine, state) : null,
        tierUnlocked: (tierId) => G.Econ && typeof G.Econ.tierUnlocked === "function" ? G.Econ.tierUnlocked(state, tierId) : false,
      }),
    });
  }

  function isMechanicUiVisible(zoneDef, zoneState, mechanicId) {
    const def = (zoneDef && zoneDef.mechanics || []).find((m) => m && m.id === mechanicId);
    if (!def || !def.visibility || def.visibility.hidden !== true) return true;
    return !!(zoneState && Array.isArray(zoneState.mechanicDiscoveries) && zoneState.mechanicDiscoveries.includes(mechanicId));
  }

  class ZoneRuntime {
    constructor(state, zoneDef, zoneState) {
      this.state = state;
      this.zoneDef = zoneDef;
      this.zoneState = zoneState;
      this.instances = new Map();
      this.uiInstances = new Map();
      this.hotContexts = new Map();
      this.uiContexts = new Map();
      this.uiFloorId = null;
      this.uiFloorProxy = null;
      this.instancesReady = false;
      this.instantiatingInstances = false;
      this.hooks = Object.create(null);
      HOOK_METHODS.forEach((name) => { this.hooks[name] = []; });
      this.disabled = new Set();
      this.mechanicGameView = buildMechanicGameView(state);
      this.uiZoneDef = buildUiZoneDef(zoneDef);
      ensureZoneContainers(zoneState, zoneDef);
    }

    defs() { return Array.isArray(this.zoneDef.mechanics) ? this.zoneDef.mechanics : []; }

    ensureInstances() {
      if (this.instancesReady || this.instantiatingInstances) return;
      this.instantiatingInstances = true;
      try {
        for (const def of this.defs()) this.instanceFor(def);
        this.instancesReady = true;
      } finally {
        this.instantiatingInstances = false;
      }
    }

    instanceFor(def) {
      if (!def || def.enabled === false || !def.script || this.disabled.has(def.id)) return null;
      if (this.instances.has(def.id)) return this.instances.get(def.id);
      const MechanicClass = mechanicRegistry.get(def.script);
      if (!MechanicClass) return null;
      try {
        validateMechanicClass(MechanicClass);
        const instance = new MechanicClass(def);
        this.instances.set(def.id, instance);
        const uiInstance = Object.create(Object.getPrototypeOf(instance));
        Object.getOwnPropertyNames(instance).forEach((key) => { uiInstance[key] = instance[key]; });
        Object.freeze(uiInstance);
        this.uiInstances.set(def.id, uiInstance);
        for (const method of HOOK_METHODS) {
          if (typeof instance[method] === "function" && instance[method] !== ZoneMechanicContract.prototype[method]) {
            this.hooks[method].push(instance);
          }
        }
        const attached = this.call(instance, "onAttach", this.context(instance, { mode: "attach" }));
        if (attached === false) {
          this.disable(def.id, new Error("Mechanic rejected attachment"));
          return null;
        }
        return instance;
      } catch (error) {
        this.disable(def.id, error);
        return null;
      }
    }

    disable(mechanicId, error) {
      this.disabled.add(mechanicId);
      if (error) console.error("Zone mechanic quarantined:", this.zoneDef.id, mechanicId, error);
    }

    uiContext(mechanic, _uiSnapshot, floorId, _calculationState) {
      // UI contexts are read-only and synchronous. Keep one frozen facade per
      // mechanic and update only the two values that can change between frames.
      // This removes repeated object creation/freeze work from the render loop.
      this.uiFloorId = floorId;
      const liveFloor = (this.zoneState.floors || []).find((item) => item && item.id === floorId) || null;
      this.uiFloorProxy = readonlyView(liveFloor);
      let cached = this.uiContexts.get(mechanic.id);
      if (cached) return cached;

      const liveState = readonlyView(this.state);
      const liveZoneState = readonlyView(this.zoneState);
      const mechanics = readonlyView(this.zoneState.mechanicState || {});
      const variables = readonlyView(this.zoneState.variables || {});
      const zoneDefSnapshot = this.uiZoneDef || (this.uiZoneDef = buildUiZoneDef(this.zoneDef));
      const runtime = this;
      const ctx = {
        game: this.mechanicGameView || buildMechanicGameView(this.state),
        state: liveState,
        zoneId: this.zoneDef.id,
        zoneDef: zoneDefSnapshot,
        zoneState: liveZoneState,
        zone: liveZoneState,
        get floor() { return runtime.uiFloorProxy; },
        get floorId() { return runtime.uiFloorId; },
        zoneVariables: variables,
        mechanic: readonlyView(mechanic),
        mechanics,
        mechanicStateFor: (id) => readonlyView(this.zoneState.mechanicState && this.zoneState.mechanicState[id]) || EMPTY_READONLY_OBJECT,
        discoverSecret: () => false,
        rewardCash: () => false,
        emit: () => false,
        emitUI: () => false,
        requirementValue: (req) => requirementValue(this.state, req, this.zoneDef.id),
        requirementMet: (req) => requirementMet(this.state, req, this.zoneDef.id),
        requirementsMet: (reqs) => requirementsMet(this.state, reqs, this.zoneDef.id),
        machineUnlocked: (machineId) => isMachineUnlocked(this.state, machineId),
        canPlaceMachine: (machineId, targetZoneId) => canPlaceMachineInZone(this.state, machineId, targetZoneId || this.zoneDef.id),
        mode: "ui",
      };
      Object.freeze(ctx);
      this.uiContexts.set(mechanic.id, ctx);
      return ctx;
    }

    context(mechanic, extra) {
      const input = Object.assign({}, extra || {});
      // Events are only writable through emit()/emitUI(); never hand the mutable
      // array to a mechanic directly. Domain objects exposed for reads are proxy
      // protected so accidental writes throw in strict mode instead of bypassing Core.
      delete input.events;
      delete input.state;
      delete input.zoneDef;
      delete input.zoneState;
      delete input.zoneVariables;
      delete input.mechanics;
      delete input.floor;
      delete input.slot;
      delete input.machine;
      return Object.assign({
        game: this.mechanicGameView,
        state: readonlyView(this.state),
        zoneId: this.zoneDef.id,
        zoneDef: readonlyView(this.zoneDef),
        zoneState: readonlyView(this.zoneState),
        zoneVariables: readonlyView(this.zoneState.variables),
        mechanic: readonlyView(mechanic),
        mechanics: readonlyView(this.zoneState.mechanicState),
        floor: readonlyView(extra && extra.floor),
        slot: readonlyView(extra && extra.slot),
        machine: readonlyView(extra && extra.machine),
        mechanicStateFor: (id) => {
          if (!isPlainObject(this.zoneState.mechanicState[id]) && !Array.isArray(this.zoneState.mechanicState[id])) this.zoneState.mechanicState[id] = {};
          return this.zoneState.mechanicState[id];
        },
        discoverSecret: (secretId) => discoverSecret(this.state, this.zoneDef.id, secretId, extra && extra.events),
        rewardCash: (amount, _reason) => {
          const value = Number(amount);
          if (!Number.isFinite(value) || value <= 0 || !G.Factory || typeof G.Factory.grantMoney !== "function") return false;
          G.Factory.grantMoney(this.state, value);
          return true;
        },
        emit: (type, payload) => emitSafeEvent(extra && extra.events, type, Object.assign({}, payload || {}, { zoneId: this.zoneDef.id, mechanicId: mechanic.id })),
        emitUI: (spec) => isMechanicUiVisible(this.zoneDef, this.zoneState, mechanic.id)
          ? emitMechanicUiSafe(extra && extra.events, this.zoneDef.id, mechanic.id, spec)
          : false,
        requirementValue: (req) => requirementValue(this.state, req, this.zoneDef.id),
        requirementMet: (req) => requirementMet(this.state, req, this.zoneDef.id),
        requirementsMet: (reqs) => requirementsMet(this.state, reqs, this.zoneDef.id),
        machineUnlocked: (machineId) => isMachineUnlocked(this.state, machineId),
        canPlaceMachine: (machineId, targetZoneId) => canPlaceMachineInZone(this.state, machineId, targetZoneId || this.zoneDef.id),
      }, input);
    }

    call(instance, method, ctx, args) {
      if (!instance || this.disabled.has(instance.id)) return undefined;
      try { return instance[method](ctx, ...(args || [])); }
      catch (error) { this.disable(instance.id, error); return undefined; }
    }

    hotContext(instance, methodName, dynamic) {
      let byMethod = this.hotContexts.get(instance);
      if (!byMethod) { byMethod = new Map(); this.hotContexts.set(instance, byMethod); }
      let ctx = byMethod.get(methodName);
      if (!ctx) {
        ctx = this.context(instance, { mode: dynamic.mode });
        byMethod.set(methodName, ctx);
      }
      ctx.mode = dynamic.mode;
      ctx.floor = readonlyView(dynamic.floor);
      ctx.machine = readonlyView(dynamic.machine);
      ctx.slot = readonlyView(dynamic.slot);
      return ctx;
    }

    forEachHot(methodName, dynamic, fn) {
      const list = this.hooks[methodName];
      if (!Array.isArray(list)) return;
      for (const instance of list) {
        if (!instance || this.disabled.has(instance.id)) continue;
        const ctx = this.hotContext(instance, methodName, dynamic);
        try { fn(instance, ctx); } catch (error) { this.disable(instance.id, error); }
      }
    }

    callUi(instance, ctx) {
      if (!instance || this.disabled.has(instance.id)) return undefined;
      try {
        const uiInstance = this.uiInstances.get(instance.id) || instance;
        return instance.getUIState.call(uiInstance, ctx);
      } catch (error) {
        console.error("Zone mechanic UI failed:", this.zoneDef.id, instance.id, error);
        return undefined;
      }
    }

    forEach(fn, extra, methodName = null) {
      if (methodName && Array.isArray(this.hooks[methodName])) {
        const list = this.hooks[methodName];
        for (const instance of list) {
          if (!instance || this.disabled.has(instance.id)) continue;
          const ctx = this.context(instance, extra);
          try { fn(instance, ctx); } catch (error) { this.disable(instance.id, error); }
        }
        return;
      }
      for (const def of this.defs()) {
        if (!def || def.enabled === false || this.disabled.has(def.id)) continue;
        const instance = this.instanceFor(def);
        if (!instance) continue;
        const ctx = this.context(instance, extra);
        try { fn(instance, ctx); } catch (error) { this.disable(instance.id, error); }
      }
    }

    diagnostics() {
      const missingScripts = [];
      const configurationErrors = [];
      if (this.defs().length < 1) configurationErrors.push("Zone must declare at least one JavaScript mechanic");
      this.defs().forEach((def) => {
        if (!def || def.enabled === false || !def.script || mechanicRegistry.has(def.script)) return;
        missingScripts.push({ mechanicId: def.id, script: def.script });
      });
      return { zoneId: this.zoneDef.id, missingScripts, disabledMechanics: [...this.disabled], configurationErrors };
    }
  }

  function getRuntime(state, zoneId) {
    const zoneDef = getZoneDef(zoneId);
    const zoneState = getZoneState(state, zoneId);
    if (!zoneDef || !zoneState) return null;
    ensureZoneContainers(zoneState, zoneDef);
    let runtime = runtimeByZoneState.get(zoneState);
    if (!runtime || runtime.state !== state || runtime.zoneDef !== zoneDef) {
      runtime = new ZoneRuntime(state, zoneDef, zoneState);
      runtimeByZoneState.set(zoneState, runtime);
    }
    // Hot hooks use prebuilt lists for the steady-state game loop. Always
    // materialize declared mechanics before returning a live runtime, including
    // after save/load when a new runtime is first reconstructed. Storing the
    // runtime in the WeakMap first also prevents recursive runtime creation if
    // a future onAttach implementation consults Zone Core.
    runtime.ensureInstances();
    return runtime;
  }

  function forEachMechanic(state, zoneId, fn, extra) { const runtime = getRuntime(state, zoneId); if (runtime) runtime.forEach(fn, extra); }

  // ---- Generic requirements ---------------------------------------------
  function countMachines(state, zoneId, machineId, machineTag) {
    let count = 0;
    (state.zones || []).forEach((zone) => {
      if (zoneId && zone.id !== zoneId) return;
      (zone.floors || []).forEach((floor) => (floor.grid || []).forEach((slot) => {
        if (!slot.machine) return;
        const machineMatches = !machineId || slot.machine.typeId === machineId;
        if (!machineMatches) return;
        if (machineTag) {
          const def = machineDef(slot.machine.typeId);
          if (!def || !Array.isArray(def.tags) || !def.tags.includes(machineTag)) return;
        }
        count++;
      }));
    });
    return count;
  }
  function hasMachine(state, machineId, zoneId) { return countMachines(state, zoneId, machineId) > 0; }

  function requirementValue(state, req, zoneId) {
    if (!req || typeof req !== "object") return 0;
    const scopeZoneId = req.scope === "zone" ? zoneId : null;
    switch (req.type) {
      case "money": return state.money;
      case "maxMoney": return state.maxMoney;
      case "research": return state.research;
      case "machineCount": return countMachines(state, scopeZoneId, req.machineId || null, req.tag || null);
      case "machineOwned": return hasMachine(state, req.machineId, scopeZoneId) ? 1 : 0;
      case "machineUnlocked": return isMachineUnlocked(state, req.machineId) ? 1 : 0;
      case "zoneUnlocked": return getZoneState(state, req.zoneId || zoneId)?.unlocked ? 1 : 0;
      case "secretDiscovered": {
        const secretZoneId = req.zoneId || zoneId;
        return getZoneState(state, secretZoneId)?.secrets.includes(req.secretId) ? 1 : 0;
      }
      case "mps": return computeMps(state, scopeZoneId);
      case "floorUnlocked": {
        const floor = getZoneState(state, zoneId)?.floors?.find((x) => x.id === req.floorId);
        return floor && floor.unlocked ? 1 : 0;
      }
      case "zoneStat": {
        const zone = getZoneState(state, zoneId);
        const value = zone ? readPath(zone.stats, req.stat, 0) : 0;
        return Number.isFinite(Number(value)) ? Number(value) : 0;
      }
      case "zoneVariable": {
        const zone = getZoneState(state, zoneId);
        const value = zone ? readPath(zone.variables, req.path, 0) : 0;
        return Number.isFinite(Number(value)) ? Number(value) : 0;
      }
      case "zoneUpgradeLevel": {
        const zone = getZoneState(state, zoneId);
        const raw = zone && zone.upgrades ? zone.upgrades[req.upgradeId] : 0;
        return Number.isFinite(Number(raw)) ? Math.max(0, Math.floor(Number(raw))) : 0;
      }
      case "powerAvailable": {
        if (!G.Econ || typeof G.Econ.powerCapacity !== "function" || typeof G.Econ.powerDemand !== "function") return 0;
        return Math.max(0, Number(G.Econ.powerCapacity(state)) - Number(G.Econ.powerDemand(state)));
      }
      case "mechanicState": {
        const zone = getZoneState(state, zoneId);
        if (!zone) return 0;
        const value = readPath(zone.mechanicState && zone.mechanicState[req.mechanicId], req.path, 0);
        return Number.isFinite(Number(value)) ? Number(value) : 0;
      }
      default: return 0;
    }
  }

  function requirementMet(state, req, zoneId) {
    if (!req || typeof req !== "object") return false;
    const actual = requirementValue(state, req, zoneId);
    const expected = Number(req.value);
    if (!Number.isFinite(expected)) return false;
    switch (req.op) {
      case "gt": return actual > expected;
      case "eq": return actual === expected;
      case "lte": return actual <= expected;
      case "lt": return actual < expected;
      case "gte":
      default: return actual >= expected;
    }
  }
  function requirementsMet(state, requirements, zoneId) { return !Array.isArray(requirements) || requirements.every((req) => requirementMet(state, req, zoneId)); }
  function missingRequirements(state, requirements, zoneId) { return !Array.isArray(requirements) ? [] : requirements.filter((req) => !requirementMet(state, req, zoneId)); }

  // ---- Zone-specific upgrades / purchasables ----------------------------
  // These are owned only by their home Zone. JSON declares cost, requirements
  // and state effects; Zone mechanic JavaScript simply consumes zoneVariables.
  const ZONE_CONTENT_KINDS = Object.freeze(["upgrade", "purchase"]);
  const ZONE_EFFECT_OPERATIONS = Object.freeze(new Set(["set", "add", "subtract", "multiply", "divide", "min", "max"]));

  function getZoneContentDef(zoneId, contentId, kind) {
    const zoneDef = getZoneDef(zoneId);
    if (!zoneDef || !contentId) return null;
    const lists = kind === "purchase" ? [zoneDef.purchases || []] : kind === "upgrade" ? [zoneDef.upgrades || []] : [zoneDef.upgrades || [], zoneDef.purchases || []];
    for (const list of lists) {
      const found = list.find((item) => item && item.id === contentId);
      if (found) return found;
    }
    return null;
  }

  function getZoneContentKind(zoneId, contentId) {
    const zoneDef = getZoneDef(zoneId);
    if (!zoneDef) return null;
    if ((zoneDef.upgrades || []).some((item) => item && item.id === contentId)) return "upgrade";
    if ((zoneDef.purchases || []).some((item) => item && item.id === contentId)) return "purchase";
    return null;
  }

  function zoneContentLevel(zoneState, contentDef, kind) {
    if (!zoneState || !contentDef) return 0;
    if (kind === "purchase") return zoneState.purchases && zoneState.purchases[contentDef.id] === true ? 1 : 0;
    const raw = zoneState.upgrades && zoneState.upgrades[contentDef.id];
    return Number.isFinite(Number(raw)) ? Math.max(0, Math.floor(Number(raw))) : 0;
  }

  function zoneContentCost(contentDef, currentLevel) {
    if (!contentDef) return 0;
    const raw = contentDef.cost;
    if (Number.isFinite(Number(raw))) return Math.max(0, Math.ceil(Number(raw)));
    if (!isPlainObject(raw) || !Number.isFinite(Number(raw.base))) return Infinity;
    const growth = Number.isFinite(Number(raw.growth)) ? Math.max(1, Number(raw.growth)) : 1;
    return Math.max(0, Math.ceil(Number(raw.base) * Math.pow(growth, Math.max(0, Number(currentLevel) || 0))));
  }

  function zoneContentVisibilityRequirements(contentDef) {
    const visibility = isPlainObject(contentDef && contentDef.visibility) ? contentDef.visibility : null;
    return visibility && Array.isArray(visibility.requirements) ? visibility.requirements : [];
  }

  function zoneContentUnlockRequirements(contentDef) {
    const unlock = isPlainObject(contentDef && contentDef.unlock) ? contentDef.unlock : null;
    return unlock && Array.isArray(unlock.requirements) ? unlock.requirements : [];
  }

  function zoneContentIsHidden(contentDef) {
    return !!(contentDef && contentDef.visibility && contentDef.visibility.hidden === true);
  }

  function applyZoneEffect(target, effect) {
    if (!effect || !ZONE_EFFECT_OPERATIONS.has(effect.operation) || typeof effect.target !== "string" || !normalizePath(effect.target)) return false;
    const operation = effect.operation;
    const hasValue = Object.prototype.hasOwnProperty.call(effect, "value");
    const current = readPath(target, effect.target, undefined);
    // Effects are bound to declared Zone variables. This mirrors build-time
    // validation and prevents malformed runtime content from creating new
    // state paths accidentally.
    if (current === undefined) return false;
    let next;
    if (operation === "set") {
      if (!hasValue) return false;
      next = cloneJson(effect.value);
    } else {
      const rhs = Number(effect.value);
      const lhs = current === undefined ? 0 : Number(current);
      if (!Number.isFinite(rhs) || !Number.isFinite(lhs)) return false;
      if (operation === "add") next = lhs + rhs;
      else if (operation === "subtract") next = lhs - rhs;
      else if (operation === "multiply") next = lhs * rhs;
      else if (operation === "divide") { if (rhs === 0) return false; next = lhs / rhs; }
      else if (operation === "min") next = Math.min(lhs, rhs);
      else if (operation === "max") next = Math.max(lhs, rhs);
    }
    if (typeof next === "number" && !Number.isFinite(next)) return false;
    return writePath(target, effect.target, next);
  }

  function applyZoneContentEffects(zoneState, effects) {
    if (!zoneState || !Array.isArray(effects) || !effects.length) return { ok: true, variables: zoneState ? cloneJson(zoneState.variables || {}) : {} };
    const candidate = cloneJson(zoneState.variables || {});
    for (const effect of effects) {
      if (!applyZoneEffect(candidate, effect)) return { ok: false, reason: "invalidEffect" };
    }
    return { ok: true, variables: candidate };
  }

  function zoneContentStatus(state, zoneId, contentId, kind) {
    const zoneDef = getZoneDef(zoneId);
    const zoneState = getZoneState(state, zoneId);
    const resolvedKind = kind && ZONE_CONTENT_KINDS.includes(kind) ? kind : getZoneContentKind(zoneId, contentId);
    const def = getZoneContentDef(zoneId, contentId, resolvedKind);
    if (!zoneDef || !zoneState || !def || !resolvedKind) return { ok: false, reason: "invalid", visible: false, kind: resolvedKind, level: 0, maxLevel: 0, cost: 0, missingVisibility: [], missing: [] };
    ensureZoneContainers(zoneState, zoneDef);
    const maxLevel = Math.max(1, Math.floor(Number(def.maxLevel) || 1));
    const level = zoneContentLevel(zoneState, def, resolvedKind);
    const visibilityReqs = zoneContentVisibilityRequirements(def);
    const visible = !zoneContentIsHidden(def) || requirementsMet(state, visibilityReqs, zoneId);
    const missingVisibility = visible ? [] : missingRequirements(state, visibilityReqs, zoneId);
    const unlockReqs = zoneContentUnlockRequirements(def);
    const missing = visible ? missingRequirements(state, unlockReqs, zoneId) : missingVisibility.slice();
    const cost = level >= maxLevel ? 0 : zoneContentCost(def, level);
    const canPay = level >= maxLevel || state.money >= cost;
    const ok = !!zoneState.unlocked && visible && level < maxLevel && missing.length === 0 && canPay;
    let reason = null;
    if (!zoneState.unlocked) reason = "zoneLocked";
    else if (!visible) reason = "hidden";
    else if (level >= maxLevel) reason = "max";
    else if (missing.length) reason = "requirements";
    else if (!canPay) reason = "money";
    return { ok, reason, visible, hidden: !visible && zoneContentIsHidden(def), kind: resolvedKind, level, maxLevel, cost, canPay, missingVisibility, missing, zoneId, contentId, def };
  }

  function buyZoneContent(state, zoneId, contentId, kind) {
    const status = zoneContentStatus(state, zoneId, contentId, kind);
    if (!status.ok) return status;
    const zoneState = getZoneState(state, zoneId);
    const def = status.def;
    const nextLevel = status.level + 1;
    const effectsResult = applyZoneContentEffects(zoneState, def.effects);
    if (!effectsResult.ok) return { ok: false, reason: effectsResult.reason };
    if (state.money < status.cost) return { ok: false, reason: "money", cost: status.cost };
    state.money -= status.cost;
    // Commit the candidate in place so the Zone variables root remains stable
    // for any runtime adapter that is holding the current Zone state object.
    const committedVariables = zoneState.variables;
    Object.keys(committedVariables).forEach((key) => { delete committedVariables[key]; });
    Object.keys(effectsResult.variables).forEach((key) => { committedVariables[key] = effectsResult.variables[key]; });
    if (status.kind === "purchase") zoneState.purchases[contentId] = true;
    else zoneState.upgrades[contentId] = nextLevel;
    state.stats.totalUpgradesBought = Math.max(0, Number(state.stats.totalUpgradesBought) || 0) + 1;
    // Resolve secrets/mechanic discoveries immediately after the state change.
    // Without this, buying the fifth Waterproofing level could leave the hidden
    // Ink mechanic undiscovered until a later simulation tick.
    checkSecrets(state, zoneId, null);
    return { ok: true, kind: status.kind, contentId, cost: status.cost, newLevel: nextLevel, maxLevel: status.maxLevel };
  }

  function getZoneContentCatalog(state, zoneId) {
    const zoneDef = getZoneDef(zoneId), zoneState = getZoneState(state, zoneId);
    if (!zoneDef || !zoneState) return [];
    ensureZoneContainers(zoneState, zoneDef);
    const entries = [];
    (zoneDef.upgrades || []).forEach((def) => entries.push(Object.assign({ id: def.id, kind: "upgrade" }, zoneContentStatus(state, zoneId, def.id, "upgrade"))));
    (zoneDef.purchases || []).forEach((def) => entries.push(Object.assign({ id: def.id, kind: "purchase" }, zoneContentStatus(state, zoneId, def.id, "purchase"))));
    return entries;
  }

  // ---- Machine unlock / placement ---------------------------------------
  function machineDef(machineId) { return D.machineById(machineId); }
  function normalizedMachineUnlock(def) {
    const unlock = isPlainObject(def && def.unlock) ? def.unlock : {};
    const manual = unlock.manual === undefined ? unlock.auto !== true : !!unlock.manual;
    return Object.assign({}, unlock, { manual });
  }
  function zoneOrder(zoneId) {
    const def = getZoneDef(zoneId);
    return def && Number.isFinite(Number(def.order)) ? Number(def.order) : Infinity;
  }

  function isMachineUnlocked(state, machineId) {
    const def = machineDef(machineId);
    if (!def) return false;
    if (def.kind === "tier") return G.Econ.tierUnlocked(state, def.tierId);
    const homeZone = getZoneState(state, def.zoneId);
    const homeDef = getZoneDef(def.zoneId);
    if (!homeZone || !homeDef || !homeZone.unlocked) return false;
    ensureZoneContainers(homeZone, homeDef);
    if (homeZone.unlockedMachineIds.includes(def.id)) return true;
    const unlock = normalizedMachineUnlock(def);
    if (unlock.secretId && !homeZone.secrets.includes(unlock.secretId)) return false;
    if (unlock.manual) return false;
    return requirementsMet(state, unlock.requirements || [], def.zoneId);
  }

  function canPlaceMachineInZone(state, machineId, targetZoneId) {
    const def = machineDef(machineId);
    const targetZone = getZoneState(state, targetZoneId);
    const targetDef = getZoneDef(targetZoneId);
    if (!def || !targetZone || !targetDef || !targetZone.unlocked) return false;
    if (!isMachineUnlocked(state, machineId)) return false;
    if (def.kind !== "zone") return true;
    return zoneOrder(targetZoneId) >= zoneOrder(def.zoneId);
  }

  // Compatibility alias for old input code; semantics are now global unlock + placement.
  function machineUnlocked(state, machineId, targetZoneId) { return canPlaceMachineInZone(state, machineId, targetZoneId); }

  function machineUnlockStatus(state, machineId, _targetZoneId) {
    const def = machineDef(machineId);
    if (!def) return { ok: false, reason: "invalid", missing: [] };
    if (def.kind === "tier") {
      const ok = G.Econ.tierUnlocked(state, def.tierId);
      return { ok, already: ok, missing: ok || !def.unlockRequirement ? [] : [def.unlockRequirement], manual: false, cost: 0, canPay: true, zoneId: null };
    }
    const homeZone = getZoneState(state, def.zoneId);
    const homeDef = getZoneDef(def.zoneId);
    if (!homeZone || !homeDef || !homeZone.unlocked) return { ok: false, reason: "zoneLocked", missing: [], manual: true, cost: Math.max(0, Number((def.unlock || {}).cost) || 0), canPay: false, zoneId: def.zoneId };
    ensureZoneContainers(homeZone, homeDef);
    const unlock = normalizedMachineUnlock(def);
    if (homeZone.unlockedMachineIds.includes(def.id)) return { ok: true, already: true, missing: [], cost: 0, manual: unlock.manual, canPay: true, zoneId: def.zoneId };
    const missing = missingRequirements(state, unlock.requirements || [], def.zoneId);
    if (unlock.secretId && !homeZone.secrets.includes(unlock.secretId)) missing.push({ type: "secretDiscovered", secretId: unlock.secretId, value: 1, _secretGate: true });
    const cost = Math.max(0, Number(unlock.cost) || 0);
    const canPay = state.money >= cost;
    const ready = !unlock.manual && missing.length === 0 && canPay;
    return { ok: ready, manual: unlock.manual, missing, cost, canPay, zoneId: def.zoneId, reason: missing.length ? "requirements" : (canPay ? null : "money") };
  }

  function unlockMachine(state, machineId, events) {
    const def = machineDef(machineId);
    if (!def || def.kind !== "zone") return { ok: false, reason: "invalid" };
    const zone = getZoneState(state, def.zoneId);
    const zoneDef = getZoneDef(def.zoneId);
    if (!zone || !zoneDef || !zone.unlocked) return { ok: false, reason: "zoneLocked" };
    ensureZoneContainers(zone, zoneDef);
    if (zone.unlockedMachineIds.includes(def.id)) return { ok: true, already: true, machineId: def.id, cost: 0 };
    const unlock = normalizedMachineUnlock(def);
    if (!unlock.manual) return { ok: false, reason: "notManual" };
    if (unlock.secretId && !zone.secrets.includes(unlock.secretId)) return { ok: false, reason: "secret", secretId: unlock.secretId };
    const missing = missingRequirements(state, unlock.requirements || [], def.zoneId);
    if (missing.length) return { ok: false, reason: "requirements", missing, cost: Number(unlock.cost) || 0 };
    const cost = Math.max(0, Number(unlock.cost) || 0);
    if (state.money < cost) return { ok: false, reason: "money", cost };
    state.money -= cost;
    zone.unlockedMachineIds.push(def.id);
    if (Array.isArray(events)) events.push({ type: "machineUnlocked", zoneId: def.zoneId, machineId: def.id, cost });
    return { ok: true, machineId: def.id, cost };
  }

  // ---- Floor unlock ------------------------------------------------------
  // Floors use the same requirement engine as Zones, machines and local content.
  // Legacy {type:"money", amount:N} remains supported as a compatibility form
  // and means both "requires N cash" and "costs N cash". New content should use
  // { requirements:[...], cost:N }.
  function normalizedFloorUnlock(def) {
    const unlock = isPlainObject(def && def.unlock) ? def.unlock : null;
    if (!unlock) return { requirements: [], cost: 0 };
    if (Array.isArray(unlock.requirements)) {
      const cost = Number.isFinite(Number(unlock.cost)) ? Math.max(0, Number(unlock.cost)) : 0;
      return { requirements: unlock.requirements, cost };
    }
    if (unlock.type === "money" && Number.isFinite(Number(unlock.amount))) {
      const amount = Math.max(0, Number(unlock.amount));
      return { requirements: [{ type: "money", value: amount }], cost: amount };
    }
    return { requirements: [], cost: Infinity, invalid: true };
  }

  function floorUnlockStatus(state, zoneId, floorId) {
    const def = D.floorById(zoneId, floorId);
    const zone = getZoneState(state, zoneId);
    const floor = zone?.floors?.find((item) => item.id === floorId);
    if (!def || !zone || !floor) return { ok: false, reason: "invalid", missing: [], cost: 0, canPay: false };
    if (!zone.unlocked) return { ok: false, reason: "zoneLocked", missing: [], cost: 0, canPay: false };
    if (floor.unlocked) return { ok: true, already: true, missing: [], cost: 0, canPay: true };
    const unlock = normalizedFloorUnlock(def);
    if (unlock.invalid) return { ok: false, reason: "invalid", missing: [], cost: Infinity, canPay: false };
    const missing = missingRequirements(state, unlock.requirements, zoneId);
    const canPay = state.money >= unlock.cost;
    return {
      ok: missing.length === 0 && canPay,
      missing,
      cost: unlock.cost,
      canPay,
      reason: missing.length ? "requirements" : (canPay ? null : "money"),
    };
  }

  function unlockFloor(state, zoneId, floorId, events) {
    const status = floorUnlockStatus(state, zoneId, floorId);
    if (status.already) return { ok: true, already: true, cost: 0 };
    if (!status.ok) return status;
    const floor = getZoneState(state, zoneId).floors.find((item) => item.id === floorId);
    if (!floor) return { ok: false, reason: "invalid" };
    if (status.cost > 0) {
      if (state.money < status.cost) return { ok: false, reason: "money", cost: status.cost };
      state.money -= status.cost;
    }
    floor.unlocked = true;
    if (Array.isArray(events)) events.push({ type: "floorUnlocked", zoneId, floorId, cost: status.cost });
    return { ok: true, cost: status.cost };
  }

  // ---- Zone unlock -------------------------------------------------------
  function zoneUnlockStatus(state, zoneId) {
    const def = getZoneDef(zoneId), zone = getZoneState(state, zoneId);
    if (!def || !zone) return { ok: false, reason: "invalid", missing: [] };
    if (zone.unlocked) return { ok: true, already: true, missing: [], cost: 0, canPay: true };
    const unlock = isPlainObject(def.unlock) ? def.unlock : {};
    const missing = missingRequirements(state, unlock.requirements || [], zoneId);
    const cost = Math.max(0, Number(unlock.cost) || 0);
    return { ok: missing.length === 0 && state.money >= cost, missing, cost, canPay: state.money >= cost };
  }

  function unlockZone(state, zoneId, events) {
    const def = getZoneDef(zoneId), zone = getZoneState(state, zoneId);
    if (!def || !zone) return { ok: false, reason: "invalid" };
    if (zone.unlocked) return { ok: true, already: true, cost: 0 };
    const status = zoneUnlockStatus(state, zoneId);
    if (status.missing.length) return { ok: false, reason: "requirements", missing: status.missing, cost: status.cost };
    if (!status.canPay) return { ok: false, reason: "money", cost: status.cost };
    state.money -= status.cost;
    zone.unlocked = true;
    ensureZoneContainers(zone, def);
    if (Array.isArray(events)) events.push({ type: "zoneUnlocked", zoneId, cost: status.cost });
    onZoneUnlocked(state, zoneId, events);
    checkSecrets(state, zoneId, events);
    return { ok: true, cost: status.cost };
  }

  function onZoneUnlocked(state, zoneId, events) {
    forEachMechanic(state, zoneId, (_mechanic, ctx) => {
      const runtime = getRuntime(state, zoneId);
      if (runtime) runtime.call(ctx.mechanic, "onZoneUnlocked", Object.assign(ctx, { mode: "live", events }), []);
    }, { events });
  }

  // ---- Production hooks --------------------------------------------------
  function beforeZoneTick(state, zone, dt, events) { if (zone) { const runtime = getRuntime(state, zone.id); if (runtime) runtime.forEach((m, c) => runtime.call(m, "onBeforeZoneTick", Object.assign(c, { zone, dt, events, mode: "live" })), { events }, "onBeforeZoneTick"); } }
  function afterZoneTick(state, zone, dt, events) { if (zone) { const runtime = getRuntime(state, zone.id); if (runtime) runtime.forEach((m, c) => runtime.call(m, "onAfterZoneTick", Object.assign(c, { zone, dt, events, mode: "live" })), { events }, "onAfterZoneTick"); } }
  function beforeTick(state, zone, floor, dt, events) { if (zone && floor) { const runtime = getRuntime(state, zone.id); if (runtime) runtime.forEach((m, c) => runtime.call(m, "onBeforeTick", Object.assign(c, { zone, floor, dt, events, mode: "live" })), { events }, "onBeforeTick"); } }

  function beforeMachineCycle(state, zone, floor, machine, slot, events) {
    let working = true;
    if (!zone) return working;
    const runtime = getRuntime(state, zone.id);
    if (!runtime) return working;
    runtime.forEach((m, c) => {
      const result = runtime.call(m, "onBeforeMachineCycle", Object.assign(c, { zone, floor, machine, slot, events, mode: "live" }));
      if (result === false) working = false;
    }, { events }, "onBeforeMachineCycle");
    return working;
  }

  function getProductionMultiplier(state, zoneId, floor, machine, slot, mode = "live") {
    let multiplier = 1;
    const runtime = getRuntime(state, zoneId);
    if (!runtime) return multiplier;
    runtime.forEachHot("modifyProduction", { floor, machine, slot: slot || null, mode }, (m, c) => {
      const result = runtime.call(m, "modifyProduction", c, [multiplier, machine]);
      if (Number.isFinite(result)) multiplier = clampMultiplier(result, multiplier);
    });
    return multiplier;
  }

  function modifyCooldown(state, zoneId, floor, machine, cooldown, mode = "live") {
    let value = Number.isFinite(cooldown) ? cooldown : 1;
    const runtime = getRuntime(state, zoneId);
    if (!runtime) return value;
    runtime.forEachHot("modifyCooldown", { floor, machine, slot: undefined, mode }, (m, c) => {
      const result = runtime.call(m, "modifyCooldown", c, [value, machine]);
      if (Number.isFinite(result)) value = Math.max(0.05, result);
    });
    return value;
  }

  function afterMachineCycle(state, zone, floor, machine, slot, result, events) {
    if (!zone) return;
    const runtime = getRuntime(state, zone.id);
    if (!runtime) return;
    runtime.forEach((m, c) => runtime.call(m, "onMachineCycle", Object.assign(c, { zone, floor, machine, slot, result, events, mode: "live" }), [result]), { events }, "onMachineCycle");
  }
  function onMachinePlaced(state, zoneId, floor, machine, slot, events) {
    const runtime = getRuntime(state, zoneId);
    if (runtime) runtime.forEach((m, c) => runtime.call(m, "onMachinePlaced", Object.assign(c, { floor, machine, slot, events, mode: "live" })), { events }, "onMachinePlaced");
  }
  function onMachineCollected(state, zoneId, floor, machine, slot, amount, events, automatic = false) {
    const runtime = getRuntime(state, zoneId);
    if (runtime) runtime.forEach((m, c) => runtime.call(m, "onMachineCollected", Object.assign(c, { floor, machine, slot: slot || null, amount, automatic: !!automatic, events, mode: "live" }), [amount]), { events }, "onMachineCollected");
  }
  function afterTick(state, zone, floor, dt, events) {
    if (zone && floor) { const runtime = getRuntime(state, zone.id); if (runtime) runtime.forEach((m, c) => runtime.call(m, "onAfterTick", Object.assign(c, { zone, floor, dt, events, mode: "live" })), { events }, "onAfterTick"); }
  }

  function dispatchEvents(state, events) {
    if (!Array.isArray(events) || !events.length) return;
    let index = 0;
    let processed = 0;
    while (index < events.length && processed < INTERNAL.MAX_MECHANIC_EVENTS_PER_FRAME) {
      const event = events[index++];
      if (!event || event.__zoneMechanicEvent !== true || !event.zoneId) continue;
      processed++;
      const zone = getZoneState(state, event.zoneId);
      if (!zone || !zone.unlocked) continue;
      const runtime = getRuntime(state, event.zoneId);
      if (runtime) runtime.forEach((m, c) => runtime.call(m, "onGameEvent", Object.assign(c, { event, events, mode: "live" }), [event]), { events }, "onGameEvent");
    }
  }

  function invokeMechanicAction(state, zoneId, mechanicId, actionId, events) {
    const zoneDef = getZoneDef(zoneId), zoneState = getZoneState(state, zoneId);
    if (!zoneDef || !zoneState || !zoneState.unlocked || typeof mechanicId !== "string" || typeof actionId !== "string") return { ok: false, reason: "invalid" };
    const runtime = getRuntime(state, zoneId);
    if (!runtime) return { ok: false, reason: "runtime" };
    const instance = runtime.instances.get(mechanicId);
    if (!instance || runtime.disabled.has(mechanicId) || typeof instance.onAction !== "function") return { ok: false, reason: "invalid" };
    const ctx = runtime.context(instance, { mode: "action", events: Array.isArray(events) ? events : null });
    const result = runtime.call(instance, "onAction", ctx, [actionId]);
    if (result && typeof result === "object") return result;
    return result === true ? { ok: true } : { ok: false, reason: "rejected" };
  }

  // ---- MPS bridge --------------------------------------------------------
  function computeMps(state, zoneOnlyId) {
    let mps = 0;
    (state.zones || []).forEach((zone) => {
      if (!zone.unlocked || (zoneOnlyId && zone.id !== zoneOnlyId)) return;
      (zone.floors || []).forEach((floor) => {
        if (!floor.unlocked) return;
        const outMult = G.Econ.floorOutputMult(floor);
        (floor.grid || []).forEach((slot) => {
          const machine = slot.machine;
          if (!machine) return;
          const baseCooldown = G.Econ.machineCooldown(machine, state);
          const cooldown = modifyCooldown(state, zone.id, floor, machine, baseCooldown, "query");
          const avgYield = G.Econ.machineBaseYield(machine, outMult, state) * (1 + G.Econ.machineCritChance(machine, state) * (G.Econ.machineCritMult(machine) - 1));
          const modifier = getProductionMultiplier(state, zone.id, floor, machine, slot, "query");
          mps += (avgYield * modifier) / cooldown;
        });
      });
    });
    return Number.isFinite(mps) ? mps : 0;
  }

  // ---- Secrets -----------------------------------------------------------
  function applySecretReward(state, zoneDef, secret) {
    if (!secret || !secret.reward || !G.Factory) return;
    const reward = secret.reward;
    if (reward.type === "cash" && Number.isFinite(reward.amount) && reward.amount > 0) {
      G.Factory.grantMoney(state, Math.min(INTERNAL.MAX_SECRET_REWARD_AMOUNT, reward.amount));
    } else if (reward.type === "research" && Number.isFinite(reward.amount) && reward.amount > 0) {
      state.research += reward.amount;
    } else if (reward.type === "unlockMachine" && typeof reward.machineId === "string") {
      const zoneState = getZoneState(state, zoneDef.id);
      if (zoneState && (zoneDef.machines || []).some((m) => m.id === reward.machineId) && !zoneState.unlockedMachineIds.includes(reward.machineId)) zoneState.unlockedMachineIds.push(reward.machineId);
    } else if (reward.type === "mechanicState" && typeof reward.mechanicId === "string" && typeof reward.path === "string") {
      const zoneState = getZoneState(state, zoneDef.id);
      if (zoneState) {
        if (!zoneState.mechanicState[reward.mechanicId]) zoneState.mechanicState[reward.mechanicId] = {};
        writePath(zoneState.mechanicState[reward.mechanicId], reward.path, reward.value);
      }
    }
  }

  function mechanicIsHidden(def) { return !!(def && def.visibility && def.visibility.hidden === true); }

  function discoverMechanic(state, zoneId, mechanicId, events) {
    const zoneDef = getZoneDef(zoneId), zoneState = getZoneState(state, zoneId);
    if (!zoneDef || !zoneState || !zoneState.unlocked) return false;
    ensureZoneContainers(zoneState, zoneDef);
    if (zoneState.mechanicDiscoveries.includes(mechanicId)) return false;
    const mechanic = (zoneDef.mechanics || []).find((m) => m && m.id === mechanicId);
    if (!mechanic || !mechanicIsHidden(mechanic)) return false;
    const requirements = mechanic.visibility && mechanic.visibility.requirements;
    if (!Array.isArray(requirements) || !requirementsMet(state, requirements, zoneId)) return false;
    zoneState.mechanicDiscoveries.push(mechanicId);
    emitSafeEvent(events, "mechanicDiscovered", { zoneId, mechanicId });
    return true;
  }

  function checkMechanicDiscoveries(state, zoneId, events) {
    const zoneDef = getZoneDef(zoneId), zoneState = getZoneState(state, zoneId);
    if (!zoneDef || !zoneState || !zoneState.unlocked) return;
    ensureZoneContainers(zoneState, zoneDef);
    (zoneDef.mechanics || []).forEach((mechanic) => {
      if (!mechanic || !mechanicIsHidden(mechanic) || zoneState.mechanicDiscoveries.includes(mechanic.id)) return;
      discoverMechanic(state, zoneId, mechanic.id, events);
    });
  }

  function getZoneMechanics(state, zoneId) {
    const def = getZoneDef(zoneId), zone = getZoneState(state, zoneId);
    if (!def || !zone) return [];
    ensureZoneContainers(zone, def);
    return (def.mechanics || []).map((mechanic) => {
      const hidden = mechanicIsHidden(mechanic);
      const discovered = !hidden || zone.mechanicDiscoveries.includes(mechanic.id);
      return {
        id: mechanic.id,
        discovered,
        hidden,
        nameKey: mechanic.nameKey,
        descriptionKey: mechanic.descriptionKey,
        hintKey: mechanic.visibility && mechanic.visibility.hintKey,
        discovery: mechanic.visibility && mechanic.visibility.requirements ? { requirements: mechanic.visibility.requirements } : null,
      };
    });
  }

  function discoverSecret(state, zoneId, secretId, events) {
    const zoneDef = getZoneDef(zoneId), zoneState = getZoneState(state, zoneId);
    if (!zoneDef || !zoneState || !zoneState.unlocked) return false;
    ensureZoneContainers(zoneState, zoneDef);
    if (zoneState.secrets.includes(secretId)) return false;
    const secret = (zoneDef.secrets || []).find((s) => s && s.id === secretId);
    if (!secret) return false;
    const requirements = secret.discovery && secret.discovery.requirements;
    if (!Array.isArray(requirements) || !requirementsMet(state, requirements, zoneId)) return false;
    zoneState.secrets.push(secretId);
    applySecretReward(state, zoneDef, secret);
    emitSafeEvent(events, "secretDiscovered", { zoneId, secretId });
    return true;
  }

  function checkSecrets(state, zoneId, events) {
    const zoneDef = getZoneDef(zoneId), zoneState = getZoneState(state, zoneId);
    if (!zoneDef || !zoneState || !zoneState.unlocked) return;
    ensureZoneContainers(zoneState, zoneDef);
    // Let mechanics update their own persistent conditions first. Generic
    // secret/mechanic discovery then observes the resulting state in the same tick.
    const runtime = getRuntime(state, zoneId);
    if (runtime) runtime.forEach((m, c) => runtime.call(m, "onCheckSecrets", Object.assign(c, { events, mode: "live" })), { events }, "onCheckSecrets");

          floorId: entry.floor.id,
          r: entry.slot.r,
          c: entry.slot.c,
          speciesId: species.id,
          amount: reward,
          automatic: reason === "auto",
        });
      }
      return true;
    }

    onBeforeZoneTick(ctx) {
      if (!this.isDiscovered(ctx)) return;
      const root = this.stateRoot(ctx);
      const dt = Math.max(0, finiteNumber(ctx.dt, 0));
      root.clock += dt;
      const now = root.clock;
      const autoEnabled = !!(ctx.zoneState && ctx.zoneState.variables && ctx.zoneState.variables.fishCatcherEnabled);
      const autoDelay = Math.max(0.1, finiteNumber(this.config.autoCatchDelaySeconds, 1.1));

        });

    }

          floorId: entry.floor.id, r: entry.slot.r, c: entry.slot.c, until: root.clock + duration,

    }

      const entries = this.activeEntries(root);
      if (!entries.length) return false;

      if (root.siphonCount >= capacity) return false;
      root.infected = {};
      root.siphonTimerUntil = 0;
      root.siphonCount = Math.min(capacity, root.siphonCount + 1);
      root.siphonCountTotal = Math.max(0, Math.floor(finiteNumber(root.siphonCountTotal, 0))) + 1;
      this.emit(ctx, "oceanInkSiphoned", { count: root.siphonCount, capacity });

      // random chance alone can leave a player waiting several minutes with no
      // wave at all, making the purchased siphon look broken. Keep the random
      // behavior, but add a short first-wave delay and a hard maximum wait so
      // the mechanic always produces observable gameplay.
      const initialDelay = Math.max(0.1, finiteNumber(this.config.initialInfectionDelaySeconds, 8));
      const maxWait = Math.max(initialDelay, finiteNumber(this.config.maxInfectionWaitSeconds, 75));
      if (!(root.nextInfectionAt > 0)) {
        const infectionCount = Math.max(0, Math.floor(finiteNumber(root.infectionCount, 0)));
        // Schedule from the start of this tick, not after dt has already been
        // added. This keeps large simulation steps from accidentally extending
        // the first-wave delay by another full delay window.

      const perSecond = Math.max(0, Math.min(0.25, finiteNumber(this.config.infectionChancePerSecond, 0.0025)));
      const chance = 1 - Math.pow(1 - perSecond, dt);
      const due = root.clock >= root.nextInfectionAt;
      if ((due || Math.random() < chance) && this.startInfection(ctx, machines, root)) {

      if (!this.isDiscovered(ctx) || !ctx.machine || !ctx.slot || !ctx.floor) return multiplier;

      if (finiteNumber(root && root.clock, 0) < flushUntil) return multiplier * Math.max(1, finiteNumber(this.config.flushMultiplier, 1.5));

    }

    onAction(ctx, actionId) {
      if (actionId !== "flushInk" || !this.isDiscovered(ctx)) return false;
      const root = this.stateRoot(ctx);
      const capacity = Math.max(1, Math.floor(finiteNumber(this.config.siphonCapacity, 5)));
      if (!ctx.zoneVariables || !ctx.zoneVariables.inkSiphonEnabled || root.siphonCount < capacity) return false;
      root.siphonCount = 0;
      root.siphonTimerUntil = 0;
      root.flushUntil = root.clock + Math.max(1, finiteNumber(this.config.flushDurationSeconds, 15));
      this.emit(ctx, "oceanInkFlushed", { duration: this.config.flushDurationSeconds || 15, multiplier: this.config.flushMultiplier || 1.5 });
      this.emitUI(ctx, { kind: "banner", id: "ink_flushed", labelKey: "zoneui.ocean.inkBuff", detailKey: "zoneui.ocean.inkBuffDetail", icon: "🌊", tone: "good", value: "×" + Math.max(1, finiteNumber(this.config.flushMultiplier, 1.5)).toFixed(1), durationMs: 2600, cooldownMs: 1200, priority: 96 });
      return { ok: true };
    }

    getUIState(ctx) {
      if (!this.isDiscovered(ctx)) return null;
      const root = ctx.mechanicStateFor(this.id);
      const floor = ctx.floor;
      const capacity = Math.max(1, Math.floor(finiteNumber(this.config.siphonCapacity, 5)));
      const active = this.activeEntries(root);
      const machineStatuses = [];
      active.forEach(([key, item]) => {
        const parsed = parseSlotKey(key);
        if (!parsed) return;
        const remaining = Math.max(0, finiteNumber(item.until, root.clock) - root.clock);
        if (floor && parsed.floorId === floor.id) {
          machineStatuses.push({ floorId: parsed.floorId, r: parsed.r, c: parsed.c, statusId: "ink_infected", variant: "disabled", tone: "danger", icon: "🖋️", labelKey: "zoneui.ocean.inkInfected", detailKey: "zoneui.ocean.inkInfectedDetail", progress: Math.min(1, remaining / Math.max(0.1, finiteNumber(this.config.infectionDurationSeconds, 45))), value: -1, valueUnit: "×", priority: 120 });
        }
      });
      const flushActive = root.clock < finiteNumber(root.flushUntil, 0);
      const actions = [];
      if (ctx.zoneState && ctx.zoneState.variables && ctx.zoneState.variables.inkSiphonEnabled && root.siphonCount >= capacity) actions.push({ id: "flushInk", mechanicId: this.id, labelKey: "zoneui.ocean.flushInk", tone: "good", disabled: false });
      return {
        machineStatuses,
        zoneIndicators: [{ id: "ink_siphon", labelKey: "zoneui.ocean.inkSiphon", detailKey: root.siphonCount >= capacity ? "zoneui.ocean.inkTankFull" : "zoneui.ocean.inkTank", icon: "🧽", tone: flushActive ? "good" : (active.length ? "danger" : "info"), value: root.siphonCount + "/" + capacity, params: { count: root.siphonCount, max: capacity }, valueUnit: "", progress: flushActive ? Math.min(1, Math.max(0, (root.flushUntil - root.clock) / Math.max(1, finiteNumber(this.config.flushDurationSeconds, 15)))) : undefined, priority: 110 }],
        actions,
        hudEffects: active.length ? { moneyTone: "danger", mpsTone: "danger" } : {}
      };
    }
  }

  G.Zone.registerMechanic("ocean.waterExposure", OceanWaterExposure);
  G.Zone.registerMechanic("ocean.inkInfection", OceanInkInfection);
  G.Zone.registerMechanic("ocean.coldCurrents", OceanColdCurrents);
  G.Zone.registerMechanic("ocean.machineSystems", OceanMachineSystems);
  G.Zone.registerMechanic("ocean.strandedFish", OceanStrandedFish);

    },
    moonspot_koi: {
      accent: "#f1dccb", secondary: "#de95ac", highlight: "#fff8ef",
      mark: "#ba6a84", glow: 0,
    },
    abyssal_glowfish: {
      accent: "#a06cff", secondary: "#5d25c7", highlight: "#eedbff",
      mark: "#d7b5ff", glow: 1,
    },
    crown_sea_dragon: {
      accent: "#ff5b79", secondary: "#c62d4f", highlight: "#ffd36b",
      mark: "#ffd36b", glow: 1,
    },
  };

  function finite(value, fallback) {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  }
  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
  function setVar(element, name, value) {
    if (element && element.style) element.style.setProperty(name, String(value));
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w * .5, h * .5);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  class OceanBackground extends G.Background.ZoneBackground {
    onEnter(ctx) {
      this.element = ctx && ctx.element ? ctx.element : null;
      this.rootLayers = [];
      this.pointer = { x: .5, y: .24 };
      this.lastActivity = null;
      this.lastPointerKey = "";
      this.lastVisualAt = -Infinity;
      this.visualClock = 0;
      this.width = 0;
      this.height = 0;
      this.dpr = 1;
      this.canvas = null;
      this.ctx = null;
      this.staticCanvas = null;
      this.staticCtx = null;
      this.resizeObserver = null;
      this.staticSeed = 9137;
      this.kelp = [];
      this.coral = [];
      this.fish = [];
      this.bubbles = [];
      this.silt = [];
      this.shafts = [];
      this.reducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      this.build();
      this.rebuildActors();
      this.updateActivity(ctx);
    }

    onExit(_ctx) {
      if (this.resizeObserver) this.resizeObserver.disconnect();
      this.resizeObserver = null;
      if (this.element) this.element.replaceChildren();
      this.element = null;
      this.rootLayers = [];
      this.canvas = null;
      this.ctx = null;
      this.staticCanvas = null;
      this.staticCtx = null;
    }

    layer(className) {
      const node = document.createElement("div");
      node.className = "ocean-bg-layer " + className;
      node.setAttribute("aria-hidden", "true");
      this.element.appendChild(node);
      this.rootLayers.push(node);
      return node;
    }

    build() {
      const host = this.element;
      if (!host) return;
      host.replaceChildren();

      const config = this.config || {};
      const haze = this.layer("ocean-depth-haze");
      const hazeNode = document.createElement("div");
      hazeNode.className = "ocean-haze";
      haze.appendChild(hazeNode);

      const lifeLayer = this.layer("ocean-life");
      this.canvas = document.createElement("canvas");
      this.canvas.className = "ocean-life-canvas";
      this.canvas.setAttribute("aria-hidden", "true");
      lifeLayer.appendChild(this.canvas);
      this.ctx = this.canvas.getContext("2d", { alpha: true });

      this.staticCanvas = document.createElement("canvas");
      this.staticCtx = this.staticCanvas.getContext("2d", { alpha: true });

      const floor = this.layer("ocean-seafloor");
      floor.setAttribute("aria-hidden", "true");
      lifeLayer.style.zIndex = "5";

      this.resize();
      if (typeof ResizeObserver === "function") {
        this.resizeObserver = new ResizeObserver(() => this.resize());
        this.resizeObserver.observe(host);
      }
    }

    resize() {
      if (!this.element || !this.canvas || !this.ctx || !this.staticCanvas || !this.staticCtx) return;
      const width = Math.max(1, this.element.clientWidth || window.innerWidth || 1);
      const height = Math.max(1, this.element.clientHeight || window.innerHeight || 1);
      if (width === this.width && height === this.height) return;

      this.width = width;
      this.height = height;
      const maxDpr = width < 900 ? 1.5 : 2;
      this.dpr = clamp(finite(window.devicePixelRatio, 1), 1, maxDpr);
      this.canvas.width = Math.max(1, Math.round(width * this.dpr));
      this.canvas.height = Math.max(1, Math.round(height * this.dpr));
      this.canvas.style.width = width + "px";
      this.canvas.style.height = height + "px";
      this.staticCanvas.width = this.canvas.width;
      this.staticCanvas.height = this.canvas.height;
      this.staticCanvas.style.width = width + "px";
      this.staticCanvas.style.height = height + "px";
      this.drawStaticScene();
      this.buildLightField();
      this.rebuildActors();
    }

    buildLightField() {
      const count = clamp(Math.floor(finite(this.config?.lightShaftCount, 5)), 2, 8);
      const w = this.width;
      const h = this.height;
      this.shafts = [];
      for (let i = 0; i < count; i++) {
        const x = w * (0.06 + (i / Math.max(1, count - 1)) * 0.88);
        this.shafts.push({
          x,
          width: w * (0.035 + (i % 3) * 0.012),
          lean: w * (0.028 + (i % 2) * 0.018),
          phase: i * 1.73 + 0.4,
          speed: 0.10 + (i % 3) * 0.018,
          alpha: 0.050 + (i % 4) * 0.012,
        });
      }
    }

    drawStaticScene() {
      const ctx = this.staticCtx;
      if (!ctx) return;
      const d = this.dpr;
      const w = this.width;
      const h = this.height;
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // Quiet depth silhouettes at the very bottom. Irregular, hand-drawn-like
      // polygons are used instead of repeated gradients to keep the scene natural.
      const rng = mulberry32(this.staticSeed);
      const floorY = h * .84;
      for (let i = 0; i < 18; i++) {
        const x = (i / 17) * w + (rng() - .5) * w * .035;
        const rw = w * (.025 + rng() * .06);
        const rh = h * (.025 + rng() * .06);
        ctx.fillStyle = `rgba(${18 + (rng() * 18) | 0},${43 + (rng() * 27) | 0},${46 + (rng() * 18) | 0},${.34 + rng() * .16})`;
        ctx.beginPath();
        ctx.ellipse(x, floorY + rng() * h * .13, rw, rh, (rng() - .5) * .8, 0, TAU);
        ctx.fill();
      }

      const rockCount = 9;
      for (let i = 0; i < rockCount; i++) {
        const side = i % 2 === 0 ? 1 : -1;
        const x = side === 1 ? w * (.02 + rng() * .13) : w * (.87 + rng() * .11);
        const y = h * (.79 + rng() * .12);
        const rw = w * (.035 + rng() * .055);
        const rh = h * (.018 + rng() * .035);
        const grd = ctx.createLinearGradient(x - rw, y - rh, x + rw, y + rh);
        grd.addColorStop(0, "rgba(38,66,69,.78)");
        grd.addColorStop(1, "rgba(4,19,24,.92)");
        ctx.fillStyle = grd;
        ctx.beginPath();
        const points = 7;
        for (let p = 0; p < points; p++) {
          const a = (p / points) * TAU;
          const rr = 0.72 + rng() * .34;
          const px = x + Math.cos(a) * rw * rr;
          const py = y + Math.sin(a) * rh * rr;
          if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      // A few shallow sand ripples, mostly at the corners so the factory floor remains clear.
      ctx.strokeStyle = "rgba(132,155,133,.055)";
      ctx.lineWidth = 1;
      for (let i = 0; i < 8; i++) {
        const left = i < 4;
        const x0 = left ? w * (.02 + i * .025) : w * (.72 + i * .045);
        const y0 = h * (.88 + (i % 3) * .028);
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(x0 + w * .045, y0 - h * .012, x0 + w * .09, y0);
        ctx.stroke();
      }
    }

    rebuildActors() {
      const config = this.config || {};
      const rng = mulberry32(271828);
      const width = Math.max(1, this.width);
      const height = Math.max(1, this.height);
      this.kelp = [];
      this.coral = [];
      this.fish = [];
      this.bubbles = [];
      this.silt = [];

      const kelpCount = clamp(Math.floor(finite(config.kelpCount, 9)), 4, 14);
      for (let i = 0; i < kelpCount; i++) {
        const edgeBias = i % 2 === 0 ? rng() * .25 : .75 + rng() * .25;
        this.kelp.push({
          x: width * clamp(edgeBias + (rng() - .5) * .08, 0, 1),
          h: height * (.18 + rng() * .23),
          scale: .75 + rng() * .5,
          phase: rng() * TAU,
          speed: .55 + rng() * .45,
          width: .55 + rng() * .65,
          tint: i % 3,
        });
      }

      const coralCount = clamp(Math.floor(finite(config.coralCount, 7)), 3, 12);
      for (let i = 0; i < coralCount; i++) {
        const side = i % 2 === 0 ? 1 : -1;
        this.coral.push({
          x: side === 1 ? width * (.05 + rng() * .2) : width * (.75 + rng() * .2),
          y: height * (.78 + rng() * .12),
          scale: .55 + rng() * .75,
          phase: rng() * TAU,
          speed: .35 + rng() * .5,
          hue: i % 4,
        });
      }

      const fishCount = clamp(Math.floor(finite(config.backgroundFishCount, 6)), 3, 8);
      const species = Array.isArray(config.backgroundFishSpecies) && config.backgroundFishSpecies.length
        ? config.backgroundFishSpecies : Object.keys(SPECIES);
      for (let i = 0; i < fishCount; i++) {
        this.fish.push({
          x: rng() * width,
          y: height * (.17 + rng() * .56),
          speed: width * (.018 + rng() * .028) * (rng() < .2 ? .72 : 1),
          scale: .46 + rng() * .72,
          phase: rng() * TAU,
          bob: height * (.008 + rng() * .018),
          dir: rng() < .5 ? 1 : -1,
          species: species[i % species.length],
          opacity: .19 + rng() * .28,
          depth: .6 + rng() * .6,
        });
      }
      this.fish.sort((a, b) => a.depth - b.depth);

      const bubbleCount = clamp(Math.floor(finite(config.backgroundBubbleCount, 16)), 8, 30);
      for (let i = 0; i < bubbleCount; i++) {
        this.bubbles.push({
          x: width * (0.04 + rng() * .92),
          y: height * (0.48 + rng() * .58),
          speed: height * (.018 + rng() * .038),
          drift: width * (.008 + rng() * .02),
          phase: rng() * TAU,
          size: 1.4 + rng() * 4.4,
          opacity: .12 + rng() * .28,
        });
      }

      const siltCount = clamp(Math.floor(finite(config.backgroundSiltCount, 18)), 8, 36);
      for (let i = 0; i < siltCount; i++) {
        this.silt.push({
          x: rng() * width,
          y: height * (.08 + rng() * .82),
          speed: height * (.008 + rng() * .014),
          drift: width * (.002 + rng() * .006),
          phase: rng() * TAU,
          size: .45 + rng() * 1.5,
          opacity: .08 + rng() * .18,
        });
      }
    }

    updateActivity(ctx) {
      const stateView = ctx && ctx.stateView ? ctx.stateView : null;
      const zone = stateView && stateView.zone ? stateView.zone : null;
      const capacity = Math.max(1, finite(zone && zone.gridCapacity, 24));
      const machines = clamp(finite(zone && zone.occupiedMachineCount, 0) / capacity, 0, 1);
      const value = machines.toFixed(3);
      if (value === this.lastActivity) return;
      this.lastActivity = value;
      setVar(this.element, "--ocean-activity", value);
    }

    update(ctx) {
      if (!this.element || !this.canvas || !this.ctx) return;
      this.updateActivity(ctx);
      const dt = Math.max(0, finite(ctx && ctx.dt, 0));
      this.visualClock += dt;

      const targetFps = clamp(finite(this.config.visualFps, 30), 20, 60);
      const minStep = 1 / targetFps;
      if (!this.reducedMotion && this.visualClock - this.lastVisualAt < minStep) return;
      this.lastVisualAt = this.visualClock;

      if (this.width !== (this.element.clientWidth || this.width) || this.height !== (this.element.clientHeight || this.height)) this.resize();

      const px = this.pointer.x * 100;
      const py = this.pointer.y * 100;
      const pxText = px.toFixed(2);
      const pyText = py.toFixed(2);
      const pointerKey = pxText + ":" + pyText;
      if (pointerKey !== this.lastPointerKey) {
        this.lastPointerKey = pointerKey;
        setVar(this.element, "--ocean-pointer-x", pxText + "%");
        setVar(this.element, "--ocean-pointer-y", pyText + "%");
      }

      this.stepActors(dt);
      this.renderScene();
    }

    stepActors(dt) {
      if (this.reducedMotion) return;
      const w = this.width;
      const h = this.height;
      this.fish.forEach((fish) => {
        fish.x += fish.speed * dt * fish.dir * fish.depth;
        fish.y += Math.sin(this.visualClock * .45 + fish.phase) * fish.bob * dt * .9;
        const margin = 90 * fish.scale;
        if (fish.dir > 0 && fish.x > w + margin) fish.x = -margin;
        if (fish.dir < 0 && fish.x < -margin) fish.x = w + margin;
        fish.y = clamp(fish.y, h * .08, h * .73);
      });

      this.bubbles.forEach((bubble) => {
        bubble.y -= bubble.speed * dt;
        bubble.x += Math.sin(this.visualClock * .7 + bubble.phase) * bubble.drift * dt;
        if (bubble.y < -16) {
          bubble.y = h * (.88 + Math.random() * .18);
          bubble.x = w * (.03 + Math.random() * .94);
        }
      });

      this.silt.forEach((dot) => {
        dot.y -= dot.speed * dt;
        dot.x += Math.sin(this.visualClock * .35 + dot.phase) * dot.drift * dt;
        if (dot.y < h * .06) {
          dot.y = h * (.92 + Math.random() * .1);
          dot.x = w * Math.random();
        }
      });
    }

    renderScene() {
      const ctx = this.ctx;
      if (!ctx || !this.width || !this.height) return;
      const d = this.dpr;
      const w = this.width;
      const h = this.height;
      const t = this.visualClock;
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.clearRect(0, 0, w, h);
      this.drawLightField(ctx, t);
      if (this.staticCanvas) ctx.drawImage(this.staticCanvas, 0, 0, w, h);

      // Vegetation: only edges/bottom. It frames the factory instead of fighting it.
      this.kelp.forEach((item) => this.drawKelp(ctx, item, t));
      this.coral.forEach((item) => this.drawCoral(ctx, item, t));

      // Background fish use the same five Secret-1 species identities/palettes as the UI fish.
      this.fish.forEach((fish) => this.drawFish(ctx, fish, t));
      this.bubbles.forEach((bubble) => this.drawBubble(ctx, bubble));
      this.silt.forEach((dot) => this.drawSilt(ctx, dot));
    }

    drawLightField(ctx, t) {
      if (!ctx || !this.shafts.length) return;
      const w = this.width;
      const h = this.height;
      ctx.save();
      ctx.globalCompositeOperation = "source-over";

      this.shafts.forEach((shaft, i) => {
        const wave = Math.sin(t * shaft.speed + shaft.phase);
        const wave2 = Math.sin(t * (shaft.speed * .63) + shaft.phase * 1.7);
        const centerTop = shaft.x + wave * shaft.lean * .6;
        const centerBottom = shaft.x + wave * shaft.lean + wave2 * shaft.lean * .35;
        const topHalf = shaft.width * (0.8 + (i % 2) * .16);
        const bottomHalf = shaft.width * (1.35 + (i % 3) * .18);
        ctx.globalAlpha = shaft.alpha;
        ctx.fillStyle = i % 3 === 1 ? "rgba(159,239,255,.9)" : "rgba(198,248,255,.9)";
        ctx.beginPath();
        ctx.moveTo(centerTop - topHalf, -8);
        ctx.lineTo(centerTop + topHalf, -8);
        ctx.lineTo(centerBottom + bottomHalf, h * .78);
        ctx.lineTo(centerBottom - bottomHalf, h * .78);
        ctx.closePath();
        ctx.fill();
      });

      // A very subtle moving caustic band; low frequency, no CSS compositor path.
      ctx.globalAlpha = .055;
      ctx.strokeStyle = "rgba(151,239,255,.9)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const y = h * (.10 + i * .105) + Math.sin(t * .15 + i * 1.4) * 8;
        const skew = Math.sin(t * .11 + i) * 18;
        ctx.beginPath();
        ctx.moveTo(-20, y + skew);
        ctx.quadraticCurveTo(w * .32, y - 18 - skew * .35, w * .63, y + 7);
        ctx.quadraticCurveTo(w * .82, y + 20, w + 20, y - 2 + skew * .25);
        ctx.stroke();
      }
      ctx.restore();
    }

    drawKelp(ctx, item, t) {
      const phase = t * item.speed + item.phase;
      const baseY = this.height + 7;
      const stalkH = item.h * item.scale;
      const fronds = 4;
      for (let i = 0; i < fronds; i++) {
        const x = item.x + (i - 1.5) * (7 + item.width * 2);
        const lean = Math.sin(phase + i * .58) * (12 + i * 2) + Math.cos(phase * .63 + i) * 3;
        const topY = baseY - stalkH * (0.72 + i * .065);
        const c1x = x + lean * .12;
        const c2x = x + lean * .62;
        const endX = x + lean;
        const width = 5 + item.width * (i % 2 ? 1.8 : 1.2);
        const grad = ctx.createLinearGradient(x, baseY, endX, topY);
        grad.addColorStop(0, item.tint === 2 ? "rgba(8,58,48,.90)" : "rgba(5,66,48,.94)");
        grad.addColorStop(.55, item.tint === 1 ? "rgba(22,119,79,.78)" : "rgba(18,101,69,.86)");
        grad.addColorStop(1, "rgba(68,160,112,.28)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(x - width, baseY);
        ctx.quadraticCurveTo(c1x - width * .4, baseY - stalkH * .28, c2x - width * .65, topY + stalkH * .08);
        ctx.quadraticCurveTo(endX - width * .32, topY - 4, endX, topY);
        ctx.quadraticCurveTo(endX + width * .4, topY - 2, c2x + width * .65, topY + stalkH * .08);
        ctx.quadraticCurveTo(c1x + width * .55, baseY - stalkH * .2, x + width, baseY);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = "rgba(4,31,28,.72)";
      ctx.beginPath();
      ctx.ellipse(item.x, baseY - 2, 19 + item.width * 7, 7, 0, 0, TAU);
      ctx.fill();
    }

    drawCoral(ctx, item, t) {
      const p = t * item.speed + item.phase;
      const palette = [
        ["rgba(198,96,103,.72)", "rgba(112,56,83,.86)"],
        ["rgba(223,145,87,.70)", "rgba(116,64,53,.86)"],
        ["rgba(123,159,205,.66)", "rgba(48,71,116,.88)"],
        ["rgba(197,125,183,.66)", "rgba(70,50,89,.88)"],
      ][item.hue % 4];
      const sway = Math.sin(p) * (5 + item.scale * 7);
      const branches = 5;
      const baseY = item.y;
      const trunkH = 30 * item.scale;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let i = 0; i < branches; i++) {
        const x = item.x + (i - 2) * 7 * item.scale;
        const h = trunkH * (.7 + (i % 3) * .14);
        const lean = sway * (.45 + i * .12) + (i - 2) * 2;
        ctx.strokeStyle = palette[1];
        ctx.lineWidth = 3.6 * item.scale;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.quadraticCurveTo(x + lean * .35, baseY - h * .48, x + lean, baseY - h);
        ctx.stroke();
        ctx.strokeStyle = palette[0];
        ctx.lineWidth = 1.8 * item.scale;
        ctx.beginPath();
        ctx.moveTo(x, baseY - 2);
        ctx.quadraticCurveTo(x + lean * .35, baseY - h * .48, x + lean, baseY - h);
        ctx.stroke();
        if (i % 2 === 0) {
          ctx.lineWidth = 2.2 * item.scale;
          ctx.beginPath();
          ctx.moveTo(x + lean * .55, baseY - h * .57);
          ctx.quadraticCurveTo(x + lean * .9 - 8, baseY - h * .7, x + lean * .9 - 11, baseY - h * .82);
          ctx.stroke();
        }
      }
      ctx.fillStyle = "rgba(28,43,44,.72)";
      ctx.beginPath();
      ctx.ellipse(item.x, baseY + 2, 15 * item.scale, 5 * item.scale, 0, 0, TAU);
      ctx.fill();
    }

    drawFish(ctx, fish, t) {
      const species = SPECIES[fish.species] || SPECIES.tide_minnow;
      const x = fish.x;
      const y = fish.y + Math.sin(t * .7 + fish.phase) * fish.bob;
      const s = fish.scale * (0.82 + fish.depth * .18);
      const dir = fish.dir;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir * s, s);
      ctx.globalAlpha = fish.opacity;

      if (species.glow) {
        const glow = ctx.createRadialGradient(15, -1, 1, 15, -1, 27);
        glow.addColorStop(0, fish.species === "crown_sea_dragon" ? "rgba(255,117,109,.26)" : "rgba(179,130,255,.25)");
        glow.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(14, -1, 27, 0, TAU); ctx.fill();
      }

      // Tail.
      ctx.fillStyle = species.secondary;
      ctx.beginPath();
      ctx.moveTo(-13, 0);
      ctx.lineTo(-28, -11);
      ctx.lineTo(-24, 0);
      ctx.lineTo(-28, 11);
      ctx.closePath();
      ctx.fill();

      // Body.
      const body = ctx.createLinearGradient(-10, -10, 19, 9);
      body.addColorStop(0, species.highlight);
      body.addColorStop(.4, species.accent);
      body.addColorStop(1, species.secondary);
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.ellipse(5, 0, 19, 9.5, 0, 0, TAU);
      ctx.fill();

      // Fins.
      ctx.fillStyle = species.accent;
      ctx.beginPath();
      if (fish.species === "crown_sea_dragon") {
        ctx.moveTo(5, -7); ctx.lineTo(2, -19); ctx.lineTo(8, -13); ctx.lineTo(13, -22); ctx.lineTo(14, -9); ctx.closePath();
      } else {
        ctx.moveTo(4, -7); ctx.quadraticCurveTo(1, -17, 10, -10); ctx.closePath();
      }
      ctx.fill();
      ctx.beginPath();

        ctx.beginPath(); ctx.arc(10, 3, 4.1, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(15, -3, 2.2, 0, TAU); ctx.fill();

      ctx.arc(bubble.x - bubble.size * .26, bubble.y - bubble.size * .32, Math.max(.45, bubble.size * .2), 0, TAU);

      ctx.globalAlpha = 1;

      ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.size, 0, TAU); ctx.fill();

      const height = Math.max(1, window.innerHeight || 1);
      const nextX = clamp(finite(ctx.x, width * .5) / width, 0, 1);
      const nextY = clamp(finite(ctx.y, height * .24) / height, 0, 1);
      if (nextX === this.pointer.x && nextY === this.pointer.y) return;
      this.pointer.x = nextX;
      this.pointer.y = nextY;
