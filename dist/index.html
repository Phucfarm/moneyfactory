    wireFloorSystemButtons();
    wireZoneContentButtons();
  }
  function floorSystemsBlock(){const floor=F.currentFloor(state);if(!floor)return"";const rows=["conveyor","collector"].map((sid)=>{const def=D.FLOOR_SYSTEMS[sid],lvl=floor.systems[sid],maxed=lvl>=def.maxLevel,cost=maxed?0:E.floorSystemCost(sid,lvl,state),afford=!maxed&&state.money>=cost,icon=sid==="conveyor"?"🛞":"🧲";return `<div class="room-card"><div class="r-icon">${icon}</div><div class="r-body"><div class="r-title">${escapeHtml(G.i18n.t("floorsys."+sid))} <span>${escapeHtml(G.i18n.t("room.level",{level:lvl}))}</span></div><div class="r-desc">${escapeHtml(G.i18n.t("floorsys."+sid+".desc"))}</div></div><button class="btn" data-floorsys="${sid}" ${maxed||!afford?"disabled":""}>${maxed?G.i18n.t("action.max"):money(cost)}</button></div>`;}).join("");return `${rows}`;}
  function wireFloorSystemButtons(){els.modalContent.querySelectorAll("[data-floorsys]").forEach((btn)=>btn.addEventListener("click",()=>{const events=[]; const res=F.buyFloorSystem(state,state.currentZoneId,state.currentFloorId,btn.dataset.floorsys,events);if(res.ok){G.Audio.sfxUpgrade();renderRoomsPanel();refreshHUD();onAfterAction();}else{G.Audio.sfxError();toast(res.reason==="power"?G.i18n.t("notify.notEnoughPower"):G.i18n.t("notify.notEnoughMoney"),"warn");}}));}

  function renderTechPanel() {
    const branches=["production","automation","economy"], cols=branches.map((branch)=>{const nodes=D.TECH_TREE.filter((t)=>t.branch===branch).map((t)=>{const owned=!!state.skills.tech[t.id],req=E.techRequirementsMet(state,t),locked=!owned&&!req,costLabel=owned?G.i18n.t("action.selected"):t.cost+" ⭐ · "+E.formatMoney(t.researchCost)+" 🔬";return `<div class="tech-node ${owned?"owned":locked?"locked":""}" data-tech="${t.id}"><div class="t-name">${owned?"✅ ":locked?"🔒 ":""}${escapeHtml(G.i18n.t(t.nameKey))}</div><div class="t-cost">${escapeHtml(costLabel)}</div></div>`;}).join("");return `<div class="tech-branch"><h4>${escapeHtml(G.i18n.t("tech.branch."+branch))}</h4>${nodes}</div>`;}).join("");
    const rem=Math.max(0,D.SKILL_POINT_INTERVAL_SECONDS-(Math.max(0,state.skills.onlineSeconds||0)%D.SKILL_POINT_INTERVAL_SECONDS));

isTouchDevice()?G.i18n.t("controls.mobile"):G.i18n.t("controls.pc"))}</span></div><div class="setting-row" style="display:block;"><div class="setting-inline"><span>${escapeHtml(G.i18n.t("settings.export"))}</span><button class="btn" id="btn-export-save">${escapeHtml(G.i18n.t("settings.export"))}</button></div><textarea id="save-export-code" readonly></textarea></div><div class="setting-row" style="display:block;"><div class="setting-inline"><span>${escapeHtml(G.i18n.t("settings.import"))}</span><button class="btn" id="btn-import-save">${escapeHtml(G.i18n.t("settings.import"))}</button></div><textarea id="save-import-code" placeholder="${escapeHtml(G.i18n.t("settings.importPlaceholder"))}"></textarea></div><div class="setting-row setting-danger-row"><div class="setting-danger-buttons"><button class="btn warn" id="btn-hard-reset">${escapeHtml(G.i18n.t("settings.hardReset"))}</button><button class="btn warn" id="btn-reset-tutorial">${escapeHtml(G.i18n.t("tutorial.settings.resetFirstTime"))}</button></div></div>`;

/* ============================================================
   13-tutorial.js — Guidance Core (interactive onboarding + contextual tips).

   An ADD-ON LAYER that sits on top of the game. It OBSERVES gameplay and
   RENDERS guidance. It never mutates gameplay state:

     gameplay (unchanged)  --events/state-->  Guidance Core  -->  #tutorial-layer

   Integration surface with the rest of the game (all optional / null-safe):
     12-main.js   G.Tutorial.update(state, dt, mechanicUi)   once per frame
                  G.Tutorial.observeEvent(ev)                for events already
                                                             passing processEvents
     11-ui.js     G.Tutorial.settingsHtml()/wireSettings()   Settings toggle row
   Removing this subsystem = delete src/13-tutorial*.js, the #tutorial-layer
   element, the CSS block "Guidance Core" and those few null-safe call sites.

   PERSISTENCE (separate from the gameplay save on purpose)
     localStorage["moneyFactoryTycoon.guidance"] =
       { v, layer1:{status,reason,flags,...}, layer2:{enabled,seen{}} }
     Game.Save.hardReset() only removes the gameplay save keys, so first-time
     onboarding completion, the Contextual Guidance toggle and hint history all
     survive a gameplay reset. Save/Import/Export never include this record.

   UI LAYERING
     #tutorial-layer normally lives inside #app between the gameplay HUD and modal.
     A newly actionable urgent Layer 2 opportunity may briefly interrupt Layer 1;
     acknowledging it returns to the current Layer 1 step. For eligible urgent Rooms
     or Zone Atlas hints, the same element may move into #modal-overlay to point to
     an in-panel purchase/upgrade/unlock control. It stays pointer-transparent except
     for the hint acknowledgement button; unrelated panels keep the original hiding.

  "use strict";

  const STORE_KEY = "moneyFactoryTycoon.guidance";

  // Helpers

    let s = G.i18n.t(key, params);
    // Never leak raw placeholders such as "{count}" to the player.
    if (/\{[A-Za-z0-9_]+\}/.test(s)) {
      if (!warned.has(key)) { warned.add(key); console.warn("[Guidance] unresolved placeholder in", key); }
      s = s.replace(/\s*\{[A-Za-z0-9_]+\}/g, "").replace(/\s{2,}/g, " ").trim();
    }
    return s;
  }
  function escapeHtml(v) { return String(v).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch])); }
  function cssEsc(v) { return (window.CSS && CSS.escape) ? CSS.escape(String(v)) : String(v).replace(/[^A-Za-z0-9_-]/g, "\\</body>"); }
  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi < lo ? lo : hi, v)); }

  // ============================================================
  // Store — guidance persistence, independent from the gameplay save.
  // ============================================================
  const Store = (function () {
    let data = null;
    let storageOk = null;
    function available() {
      if (storageOk !== null) return storageOk;
      try { const k = "__mft_guid_test__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); storageOk = true; }
      catch (_) { storageOk = false; }
      return storageOk;
    }
    function blank() {
      return {
        v: STORE_VERSION,
        layer1: { status: "pending", reason: null, flags: { selected: false, collected: false, reward100Granted: false, basicDoneAcknowledged: false, reward1000Granted: false }, startedAt: 0, finishedAt: 0 },
        layer2: { enabled: true, seen: {} },
      };
    }
    function sanitize(raw) {
      const out = blank();
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;
      const l1 = raw.layer1;
      if (l1 && typeof l1 === "object") {
        if (l1.status === "pending" || l1.status === "active" || l1.status === "done") out.layer1.status = l1.status;
        if (typeof l1.reason === "string") out.layer1.reason = l1.reason.slice(0, 24);
        if (l1.flags && typeof l1.flags === "object") {
          out.layer1.flags.selected = l1.flags.selected === true;
          out.layer1.flags.collected = l1.flags.collected === true;
          out.layer1.flags.reward100Granted = l1.flags.reward100Granted === true;
          out.layer1.flags.basicDoneAcknowledged = l1.flags.basicDoneAcknowledged === true;

    const mem = slotMemory.empty;
    if (mem && mem.key === key) {
      const s = empties.find((e) => e.r === mem.r && e.c === mem.c);

  function handleVisibilityChange() {
    if (document.visibilityState !== "visible") {
      G.Save.save(state);
      return;
    }
    // No background production is applied. Reset the frame clock on resume so
    // a long background gap cannot distort the first active-frame delta.
    lastFrameTime = performance.now();
  }

  function handleHoverScreen(sx, sy) {
    G.Render.setHover(G.Render.slotAtScreen(sx, sy));
  }

  function handleSelectTierIndex(idx) {
    const tier = D.TIERS[idx];
    if (!tier || !E.tierUnlocked(state, tier.id)) { G.Audio.sfxError(); G.UI.toast(G.i18n.t("tooltip.locked"), "warn"); return; }
    state.selectedTierId = tier.id;
    state.selectedMachineId = "printer_" + tier.id;
    G.UI.refreshTierSelector();
    G.Audio.sfxClick();
  }

  function handleSelectMachineId(machineId) {
    const machine = D.machineById(machineId);
    if (!machine || !G.Zone.isMachineUnlocked(state, machine.id)) {
      G.Audio.sfxError();
      G.UI.toast(G.i18n.t("zone.machineLocked"), "warn");
      return;
    }
    state.selectedMachineId = machine.id;
    if (machine.tierId) state.selectedTierId = machine.tierId;
    G.UI.refreshTierSelector();
    G.UI.refreshZoneMachineSelector();
  }

  function handleTapScreen(sx, sy) {
    const slot = G.Render.slotAtScreen(sx, sy);
    if (!slot) return;
    const floor = F.currentFloor(state);
    const gridSlot = floor && floor.grid.find((s) => s.r === slot.r && s.c === slot.c);
    if (!gridSlot) return;

    if (gridSlot.machine) {
      collectSlot(gridSlot, true);
      return;
    }

    const buildId = state.selectedMachineId || "printer_" + state.selectedTierId;
    const events = [];
    const res = F.placeMachine(state, state.currentZoneId, state.currentFloorId, slot.r, slot.c, buildId, events);
    if (res.ok) {
      const machine = D.machineById(res.machineId);
      const displayName = machine && machine.nameKey ? G.i18n.t(machine.nameKey) : G.i18n.t("tier." + (res.tierId || "common"));
      processEvents(events);
      G.UI.toast(G.i18n.t("notify.machinePlaced", { tier: displayName }));
      G.UI.refreshHUD(); G.UI.refreshTierSelector(); G.UI.refreshZoneMachineSelector();
      return;
    }
    G.Audio.sfxError();
    if (res.reason === "money") G.UI.toast(G.i18n.t("notify.notEnoughMoney"), "warn");
    else if (res.reason === "wrongZone") {
      const required = D.zoneById(res.requiredZoneId);
      G.UI.toast(G.i18n.t("zone.machineWrongZone", { zone: required ? G.i18n.t(required.nameKey) : res.requiredZoneId }), "warn");
    } else if (res.reason === "tierLocked" || res.reason === "machineLocked") G.UI.toast(G.i18n.t("zone.machineLocked"), "warn");
  }

  function collectSlot(gridSlot, selectAfter) {
    const isBonus = bonusSlot && bonusSlot.zoneId === state.currentZoneId && bonusSlot.floorId === state.currentFloorId && bonusSlot.r === gridSlot.r && bonusSlot.c === gridSlot.c;
    const had = gridSlot.machine.banked;
    const events = [];
    const res = F.collectMachine(state, state.currentZoneId, state.currentFloorId, gridSlot.r, gridSlot.c, events);
    if (res.amount > 0) {
      const p = G.Render.slotWorldPos(gridSlot.r, gridSlot.c);
      G.Render.spawnCollectFloater(p.x, p.y - 30, res.amount, false);
      G.Audio.sfxCollect(Math.min(1, res.amount / 1000));
    }
    if (isBonus) {
      const bonusAmount = (had > 0 ? had : E.machineBaseYield(gridSlot.machine, 1, state)) * (1.5 + Math.random() * 2);
      F.grantMoney(state, bonusAmount);
      const p = G.Render.slotWorldPos(gridSlot.r, gridSlot.c);
      G.Render.spawnBonusIcon(p.x, p.y - 30);
      G.Audio.sfxBonus();
      bonusSlot = null;
    }
    processEvents(events);
    if (selectAfter) G.UI.selectSlot(gridSlot);
    G.UI.refreshHUD();
  }

  function handleCollectNearest() {
    const floor = F.currentFloor(state);
    if (!floor) return;
    let best = null, bestDistSq = Infinity;
    floor.grid.forEach((s) => {
      if (!s.machine || s.machine.banked <= 0) return;
      const p = G.Render.slotWorldPos(s.r, s.c);
      const dx = p.x - state.camera.x, dy = p.y - state.camera.y;
      const distSq = dx * dx + dy * dy;
      if (distSq < bestDistSq) { best = s; bestDistSq = distSq; }
    });
    if (best) collectSlot(best, false);
  }

  function handleImportedState(newState) {
    state = newState;
    bonusSlot = null;
    F.resetRuntime();
    G.i18n.setLang(state.settings.lang);
    G.Audio.setMusicEnabled(state.settings.music);
    G.Audio.setSfxEnabled(state.settings.sfx);
    G.Audio.setMusicVolume(state.settings.musicVolume);
    G.Audio.setSfxVolume(state.settings.sfxVolume);
    G.Audio.syncZone(state);
    G.Render.setCamera(state.camera);
    G.Input.setCameraRef(state.camera);
    G.Background.sync(state);
    G.UI.setState(state);
    G.UI.closePanel();
    G.Save.save(state);
    G.UI.toast(G.i18n.t("notify.saved"));
  }

  function handleHardReset() {
    state = G.Save.hardReset();
    bonusSlot = null;
    F.resetRuntime();
    G.i18n.setLang(state.settings.lang);
    G.Audio.setMusicEnabled(state.settings.music);
    G.Audio.setSfxEnabled(state.settings.sfx);
    G.Audio.setMusicVolume(state.settings.musicVolume);
    G.Audio.setSfxVolume(state.settings.sfxVolume);
    G.Audio.syncZone(state);
    G.Render.setCamera(state.camera);
    G.Input.setCameraRef(state.camera);
    G.Background.sync(state);
    G.Save.save(state);
    G.UI.setState(state);
    G.UI.closePanel();
  }

  // DEV CHEAT CODE — REMOVE THIS BUTTON + HANDLER BEFORE RELEASE.
  // Adds $1,000,000,000,000 for quick PC/mobile testing only.
  function wireDevCheat() {
    const btn = document.getElementById("dev-cheat-money");
    if (!btn) return;
    btn.addEventListener("click", () => {
      const amount = 1000000000000;
      // DEV CHEAT CODE: use the normal money grant path so maxMoney-based
      // machine/tier unlock requirements update exactly like earned money.
      if (G.Factory && typeof G.Factory.grantMoney === "function") {
        G.Factory.grantMoney(state, amount);
      } else {
        state.money = Math.max(0, Number(state.money) || 0) + amount;
        state.maxMoney = Math.max(Number(state.maxMoney) || 0, state.money);
      }
      G.Save.save(state);
      G.UI.refreshAll();
      G.Audio.sfxCollect(1);
      G.UI.toast("DEV CHEAT: +$1,000,000,000,000", "mechanic", 1600);
    });
  }

  function wireGlobalUi() {
    window.addEventListener("mft:hardreset", handleHardReset);
    wireDevCheat();
  }


  function processEvents(events) {
    if (!events || events.length === 0) {
      if (bonusSlot && Date.now() > bonusSlot.expiresAt) bonusSlot = null;
      return;
    }
    const now = performance.now();
    events.forEach((ev) => {
      if (G.Tutorial) G.Tutorial.observeEvent(ev); // Guidance Core: read-only observer
      const audioResult = G.Audio && typeof G.Audio.playEvent === "function" ? G.Audio.playEvent(ev, state) : { replaceDefault: false };
      const suppressDefaultAudio = !!audioResult.replaceDefault;
      if (ev.type === "machinePlaced") {
        if (!suppressDefaultAudio) G.Audio.sfxPlaceMachine();
      } else if (ev.type === "machineCollected" && !ev.automatic) {
        if (!suppressDefaultAudio && ev.amount > 0) G.Audio.sfxCollect(Math.min(1, ev.amount / 1000));
      } else if (ev.type === "zoneUnlocked") {
        if (!suppressDefaultAudio) G.Audio.sfxUnlock();
      } else if (ev.type === "floorUnlocked") {
        if (!suppressDefaultAudio) G.Audio.sfxUnlock();
      } else if (ev.type === "machineUnlocked") {
        if (!suppressDefaultAudio) G.Audio.sfxUnlock();
      } else if (ev.type === "cycle" && ev.crit) {
        if (now - critFlashThrottle > 220) {
          critFlashThrottle = now;
          if (ev.zoneId === state.currentZoneId && ev.floorId === state.currentFloorId) {
            const p = G.Render.slotWorldPos(ev.r, ev.c);
            G.Render.spawnParticle({ kind: "spark", x: p.x, y: p.y, vx: 0, vy: -30, life: 0.5, size: 10, color: "rgba(255,210,90,0.9)" });
            if (!suppressDefaultAudio) G.Audio.sfxCrit();
          }
        }
      } else if (ev.type === "autocollect") {
        if (!suppressDefaultAudio && ev.zoneId === state.currentZoneId && ev.floorId === state.currentFloorId && ev.amount > 0) G.Audio.sfxCollect(Math.min(1, ev.amount / 2000));
      } else if (ev.type === "bonusReady") {
        if (ev.zoneId === state.currentZoneId && ev.floorId === state.currentFloorId) bonusSlot = { zoneId: ev.zoneId, floorId: ev.floorId, r: ev.r, c: ev.c, expiresAt: Date.now() + 30000 };
      } else if (ev.type === "skillPoint") {
        if (!suppressDefaultAudio) G.Audio.sfxUnlock();
        G.UI.toast(G.i18n.t("notify.skillPoint", { amount: ev.amount }));
      } else if (ev.type === "secretDiscovered") {
        if (!suppressDefaultAudio) G.Audio.sfxUnlock();
        const zone = D.zoneById(ev.zoneId);
        const secret = zone && (zone.secrets || []).find((s) => s.id === ev.secretId);
        G.UI.toast(secret ? G.i18n.t("notify.secretDiscovered", { secret: G.i18n.t(secret.nameKey || secret.hintKey) }) : G.i18n.t("notify.secretDiscovered", { secret: ev.secretId }));
        G.UI.refreshOceanFishButton();
      } else if (ev.type === "zoneMechanicUi") {
        if (ev.zoneId === state.currentZoneId) G.UI.showMechanicEvent(ev);
      } else if (ev.type === "mechanicDiscovered") {
        if (!suppressDefaultAudio) G.Audio.sfxUnlock();
        const zone = D.zoneById(ev.zoneId);
        const mechanic = zone && (zone.mechanics || []).find((m) => m.id === ev.mechanicId);
        G.UI.toast(mechanic ? G.i18n.t("notify.mechanicDiscovered", { mechanic: G.i18n.t(mechanic.nameKey) }) : G.i18n.t("notify.mechanicDiscovered", { mechanic: ev.mechanicId }));
      } else if (ev.type === "oceanFishCaught") {
        if (ev.zoneId !== state.currentZoneId || ev.floorId !== state.currentFloorId || !(ev.amount > 0)) return;
        const p = G.Render.slotWorldPos(ev.r, ev.c);
        G.Render.spawnParticle({ kind: "spark", x: p.x, y: p.y - 24, vx: 0, vy: -35, life: 0.7, size: 9, color: "rgba(120,225,255,0.95)" });
        const mechanic = ev.mechanicId ? G.Zone.getZoneMechanicDef(ev.zoneId, ev.mechanicId) : null;
        const species = mechanic?.config?.species?.find((fish) => fish.id === ev.speciesId);
        const fishName = species ? G.i18n.t(species.nameKey) : ev.speciesId;
        const caughtLabel = ev.automatic ? G.i18n.t("zoneui.ocean.fishCaughtAuto") : G.i18n.t("zoneui.ocean.fishCaught");
        G.UI.toast(caughtLabel + ": " + fishName + " +" + E.formatMoney(ev.amount), "mechanic", 2200);
        if (!suppressDefaultAudio) G.Audio.sfxBonus();
        G.UI.refreshHUD();
      }
    });
    if (bonusSlot && Date.now() > bonusSlot.expiresAt) bonusSlot = null;
  }

  G.Main = G.Main || {};
  G.Main.processEvents = processEvents;
  G.Main.hardReset = handleHardReset;

  function loop(ts) {
    try {
      if (!lastFrameTime) lastFrameTime = ts;
      let dt = (ts - lastFrameTime) / 1000;
      lastFrameTime = ts;
      dt = Math.max(0, Math.min(0.25, dt));

      G.Input.update(dt);
      const events = F.tick(state, dt);
      processEvents(events);

      G.Background.sync(state);
      G.Background.update(state, dt);

      const floor = F.currentFloor(state);
      let bonusKey = null;
      if (bonusSlot && bonusSlot.zoneId === state.currentZoneId && bonusSlot.floorId === state.currentFloorId) bonusKey = bonusSlot.r + "_" + bonusSlot.c;
      const mechanicUi = G.Zone.getMechanicUIState(state, state.currentZoneId, state.currentFloorId);
      G.Render.render(state, floor, dt, bonusKey, mechanicUi);
      G.UI.refreshMechanicDecorations(mechanicUi);
      if (G.Tutorial) G.Tutorial.update(state, dt, mechanicUi); // Guidance Core: read-only presenter

      hudAccum += dt;
      if (hudAccum >= 0.15) {
        hudAccum = 0;
        G.UI.refreshHUD(mechanicUi);
        if (G.UI.selectedSlot) G.UI.refreshMachinePanelControls();
        if (G.UI.isPanelOpen) G.UI.refreshOpenPanel();
      }
    } catch (error) {
      console.error("Game loop recovered from error:", error);
      try { hudAccum = 0; G.UI.refreshHUD(); } catch (_) {}
    } finally {
      requestAnimationFrame(loop);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})(window.Game = window.Game || {});


</script>
