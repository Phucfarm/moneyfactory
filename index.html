<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Money Factory Tycoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="start-screen" aria-label="Money Factory" data-i18n-attr="aria-label:start.title">
  <div class="start-card">
    <div class="start-mark">$</div>
    <div class="start-title" data-i18n="start.title">Money Factory</div>
    <div class="start-rule"></div>
    <button id="start-play" class="start-play" type="button"><span data-i18n="start.play">PLAY</span> <span>›</span></button>
  </div>
</div>

<div id="rotate-overlay" class="rotate-overlay hidden" aria-hidden="true"><div class="rotate-card"><div class="rotate-icon">↻</div><div data-i18n="orientation.rotate">Please rotate your device to landscape</div></div></div>
<div id="fullscreen-recovery" class="fullscreen-recovery hidden" aria-hidden="true"><div class="fullscreen-recovery-card"><div class="fullscreen-recovery-title" data-i18n="fullscreenRecovery.title">Fullscreen ended</div><div class="fullscreen-recovery-body" data-i18n="fullscreenRecovery.body">Your factory is still running. Press Continue to restore fullscreen and keep playing.</div><button id="fullscreen-recovery-continue" class="btn brass fullscreen-recovery-button" type="button" data-i18n="fullscreenRecovery.continue">Continue playing</button></div></div>

<div id="app" class="game-hidden">

  <div id="zone-background" aria-hidden="true"></div>
  <canvas id="gameCanvas"></canvas>
  <div id="mechanic-decoration-layer" aria-hidden="true"></div>

  <div id="hud-top">
    <div class="hud-chip">
      <span class="ico">💵</span>
      <span id="hud-money-val">0</span>
      <span class="sub" id="hud-mps-val"></span>
    </div>
    <div class="hud-chip brass">
      <span class="ico">🔬</span>
      <span id="hud-research-val">0</span>
    </div>
    <div class="hud-chip info" id="hud-power-wrap">
      <span class="ico">⚡</span>
      <span id="hud-power-val">0/0</span>
    </div>
    <div class="hud-chip skill-chip">
      <span class="ico">⭐</span>
      <span id="hud-skill-val">0</span>
      <span class="sub" id="hud-skill-progress"></span>
    </div>
    <button id="hud-location" type="button">
      <span><b id="hud-zone-name">Zone</b></span>
      <span id="hud-floor-name">Floor</span>
    </button>
  </div>

  <div id="location-bar">
    <div class="location-scroll">
      <div class="lb-group" id="zone-buttons"></div>
      <div class="lb-group" id="floor-buttons"></div>
    </div>
  </div>

  <div id="zone-machine-selector" aria-label="Machine Catalogue"></div>
  <button id="ocean-fish-encyclopedia" class="ocean-fish-encyclopedia" type="button" hidden></button>

  <nav id="bottom-menu">
    <button class="menu-btn" data-panel="zones"><span>🗺️</span><span class="mb-label" data-i18n="menu.zones"></span></button>
    <button class="menu-btn" data-panel="rooms"><span>🏭</span><span class="mb-label" data-i18n="menu.rooms"></span></button>
    <button class="menu-btn" data-panel="tech"><span>🧪</span><span class="mb-label" data-i18n="menu.tech"></span><span class="dot" id="dot-tech"></span></button>
    <button class="menu-btn" data-panel="settings"><span>⚙️</span><span class="mb-label" data-i18n="menu.settings"></span></button>
  </nav>

  <button id="drawer-toggle" class="mobile-only">☰</button>
  <div id="mobile-drawer" class="mobile-only plate hidden"></div>

  <div id="machine-panel" class="plate hidden"></div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-content" class="plate"></div>
  </div>

  <div id="mechanic-indicator-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="toast-stack"></div>

  <!-- DEV CHEAT CODE: remove #dev-cheat-money and its handler in src/12-main.js before release. -->
  <button id="dev-cheat-money" class="dev-cheat-btn" type="button" aria-label="DEV CHEAT: add 1 million money">+1M</button>


</div>




















  <script src="src/platform/standalone.js"></script>
  <script src="src/platform.js"></script>
  <script src="src/00-zone-content.js"></script>
  <script src="src/00-background-content.js"></script>
  <script src="src/00-audio-content.js"></script>
  <script src="src/00-data.js"></script>
  <script src="src/01-i18n.js"></script>
  <script src="src/02-state.js"></script>
  <script src="src/03-save.js"></script>
  <script src="src/04-economy.js"></script>
  <script src="src/04-zone-framework.js"></script>
  <script src="src/zones/downtown.js"></script>
  <script src="src/zones/ocean.js"></script>
  <script src="src/04-background-core.js"></script>
  <script src="src/05-factory.js"></script>
  <script src="src/08-audio.js"></script>
  <script src="src/09-render.js"></script>
  <script src="src/10-input.js"></script>
  <script src="src/11-ui.js"></script>
  <script src="src/12-main.js"></script>

</body>
</html>
